# ============================================================
# www.yf9.club / yf9.club 站点配置
# 添加时间：2026-11-09
# 归一化策略：唯一正式入口 https://www.yf9.club
#   · http://yf9.club      -> https://www.yf9.club
#   · http://www.yf9.club  -> https://www.yf9.club
#   · https://yf9.club     -> https://www.yf9.club
# IP 直连（http://192.144.175.203）行为保持不变，见 yugangtong.conf
# 证书：Let's Encrypt，由 certbot 自动续期
# ============================================================

# ---------- 80 端口：ACME 校验放行 + 跳转 HTTPS ----------
server {
    listen       80;
    listen       [::]:80;
    server_name  www.yf9.club yf9.club;

    # 续期校验必须放在跳转之前，否则 renew 会失败
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        allow all;
    }

    location / {
        return 301 https://www.yf9.club$request_uri;
    }
}

# ---------- 443 端口：www.yf9.club 正式站点 ----------
server {
    listen       443 ssl http2;
    listen       [::]:443 ssl http2;
    server_name  www.yf9.club;

    ssl_certificate     /etc/letsencrypt/live/www.yf9.club/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.yf9.club/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:YF9SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    resolver            119.29.29.29 223.5.5.5 valid=300s;
    resolver_timeout    5s;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-Frame-Options         "SAMEORIGIN" always;


    # ---- 原型工作台 · 统一口令门禁 ----
    # include 共享片段：/workbench/ 工作台、/pb-api/ 口令接口、/_pb_auth 子请求
    # （这两个路径的 auth_request off 已写在共享片段内，无需在此重复定义）
    include /etc/nginx/workbench-auth.conf;

    # server 层保护：所有 location 继承，含 CSS/JS/图片等静态资源
    # （已实测：精确匹配与正则 location 均继承 server 层 auth_request）
    auth_request /_pb_auth;
    error_page 401 = @pb_login;

    root   /var/www/yugangtong;
    index  index.html;
    charset utf-8;

    # ---- 静态资源缓存 ----
    location = /index.html { add_header Cache-Control "no-cache, must-revalidate"; }
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location ~* \.(png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=86400, must-revalidate";
    }

    # ---- 压缩 ----
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- 内部文件不对外 ----
    location ~ /\.          { deny all; }
    location = /STATE.md   { deny all; }
    location ~* ^/prd-library/ { deny all; }

    # ---- 福景堂站点走独立 8080，这里仅保留老链接跳转 ----
    location = /fjt { return 301 http://192.144.175.203:8080/; }

    # ---- 福景堂静态目录别名（沿用 yugangtong.conf 中已修正的逻辑，勿随意简化）----
    location ^~ /fjt/ {
        alias /var/www/fujingtang/;
        index index.html;
        error_page 404 /fjt/404.html;
        etag on;
        add_header Cache-Control          $fjt_cache always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "no-referrer-when-downgrade" always;

        location ~ /\.        { deny all; }
        location ~* /_docs/  { deny all; }
        location = /fjt/DEPLOY.md { deny all; }

        # 原型工作台 · 统一口令门禁
        # 本块自带 error_page 404，server 层的 401 映射对它不生效，
        # 因此必须在本 location 内显式声明，否则未验证请求会得到裸 401
        # 而不是跳转工作台要求验证密码。
        auth_request /_pb_auth;
        error_page 401 = @pb_login;
}
}

# ---------- 443 端口：裸域跳转到 www ----------
server {
    listen       443 ssl http2;
    listen       [::]:443 ssl http2;
    server_name  yf9.club;

    ssl_certificate     /etc/letsencrypt/live/www.yf9.club/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.yf9.club/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:YF9SSL:10m;
    ssl_session_timeout 1d;

    location / {
        return 301 https://www.yf9.club$request_uri;
    }
}
