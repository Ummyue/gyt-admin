name = "yugangtong-prototype"
pages_build_output_dir = "."
compatibility_date = "2024-01-01"

# v1.7.99.234 hotfix：项目根有 assets/ 目录（CSS/JS 静态资源），被 wrangler 4.x strict validation 误认为 Pages Functions assets 目录
# 加 _headers / _redirects 显式声明是 Pages 项目 + 用 wrangler pages deploy --no-bundle 跳过 bundling
# 实际错误信息："Configuration file for Pages projects does not support 'assets'"
# 解决方案：避免 wrangler 把 assets/ 当成 Pages assets binding（用 wrangler pages deploy 默认行为即可）
# 部署命令：npx wrangler pages deploy . --project-name=yugangtong-prototype --skip-caching
