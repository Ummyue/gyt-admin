<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 豫港通数字供应链管理平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./assets/css/design-system.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      background: #0F172A;
    }
    .login-bg {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(59,130,246,0.3) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(30,64,175,0.4) 0%, transparent 50%),
        linear-gradient(135deg, #0F172A 0%, #1E3A8A 50%, #0F172A 100%);
      overflow: hidden;
    }
    .login-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .login-container {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 80px;
    }
    .login-info {
      position: absolute;
      left: 80px;
      top: 50%;
      transform: translateY(-50%);
      color: white;
      max-width: 500px;
    }
    .login-info-title {
      font-size: 48px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 24px;
      background: linear-gradient(135deg, #FFFFFF 0%, #93C5FD 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .login-info-subtitle {
      font-size: 16px;
      color: rgba(255,255,255,0.7);
      line-height: 1.8;
      margin-bottom: 32px;
    }
    .login-info-stats {
      display: flex;
      gap: 32px;
      padding-top: 24px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .login-info-stat {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .login-info-stat-value {
      font-size: 28px;
      font-weight: 700;
      color: #60A5FA;
    }
    .login-info-stat-label {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
    }
    .login-card {
      width: 400px;
      background: rgba(255,255,255,0.98);
      backdrop-filter: blur(20px);
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .login-card-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-card-logo {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .login-card-logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 18px;
    }
    .login-card-logo-text {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .login-card-welcome {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .login-card-tip {
      font-size: 13px;
      color: var(--text-tertiary);
    }
    .login-form-tabs {
      display: flex;
      border-bottom: 1px solid var(--border-default);
      margin-bottom: 24px;
    }
    .login-form-tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      font-size: 14px;
      color: var(--text-secondary);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
    }
    .login-form-tab:hover {
      color: var(--text-primary);
    }
    .login-form-tab.active {
      color: var(--color-primary);
      border-bottom-color: var(--color-primary);
      font-weight: 500;
    }
    .login-form .input {
      height: 44px;
    }
    .login-form .btn {
      width: 100%;
      height: 44px;
      font-size: 15px;
      margin-top: 8px;
    }
    .login-form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      margin: 16px 0 24px;
    }
    .login-form-remember {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
      cursor: pointer;
    }
    .login-form-remember input {
      cursor: pointer;
    }
    .login-form-forgot {
      color: var(--color-primary);
    }
    .login-form-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
      color: var(--text-tertiary);
      font-size: 12px;
    }
    .login-form-divider::before,
    .login-form-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-default);
    }
    .login-form-footer {
      text-align: center;
      font-size: 12px;
      color: var(--text-tertiary);
      margin-top: 24px;
    }
    .login-checkbox {
      width: 16px;
      height: 16px;
      accent-color: var(--color-primary);
    }
  </style>
</head>
<body>
  <div class="login-bg"></div>

  <div class="login-container">
    <!-- 左侧信息区 -->
    <div class="login-info">
      <div class="login-info-title">豫港通<br>数字供应链管理平台</div>
      <div class="login-info-subtitle">
        河南中豫港通供应链管理有限公司携手河南省征信有限公司<br>
        打造大宗商品数字供应链一体化解决方案
      </div>
      <div class="login-info-stats">
        <div class="login-info-stat">
          <div class="login-info-stat-value">19+</div>
          <div class="login-info-stat-label">业务模块</div>
        </div>
        <div class="login-info-stat">
          <div class="login-info-stat-value">83</div>
          <div class="login-info-stat-label">功能页面</div>
        </div>
        <div class="login-info-stat">
          <div class="login-info-stat-value">80%</div>
          <div class="login-info-stat-label">主产品复用</div>
        </div>
      </div>
    </div>

    <!-- 右侧登录卡片 -->
    <div class="login-card">
      <div class="login-card-header">
        <div class="login-card-logo">
          <div class="login-card-logo-icon">豫</div>
          <div class="login-card-logo-text">港通供应链</div>
        </div>
        <div class="login-card-welcome">欢迎登录</div>
        <div class="login-card-tip">请输入您的账号信息</div>
      </div>

      <div class="login-form-tabs">
        <div class="login-form-tab active">验证码登录</div>
        <div class="login-form-tab">账号密码</div>
        <div class="login-form-tab">企业微信</div>
      </div>

      <form class="login-form" onsubmit="event.preventDefault(); handleLogin();">
        <div class="form-field" style="margin-bottom: 16px;">
          <input type="text" class="input" placeholder="请输入手机号" value="138 0000 XXXX">
        </div>
        <div class="form-field" style="margin-bottom: 16px;">
          <div style="display: flex; gap: 8px;">
            <input type="text" class="input" placeholder="请输入验证码" style="flex: 1;" value="600180">
            <button type="button" class="btn btn-secondary" style="height: 36px; flex-shrink: 0;">获取验证码</button>
          </div>
        </div>

        <div class="login-form-options">
          <label class="login-form-remember">
            <input type="checkbox" class="login-checkbox" checked>
            <span>记住我</span>
          </label>
          <a href="#" class="login-form-forgot">忘记密码？</a>
        </div>

        <button type="submit" class="btn btn-primary">登 录</button>

        <div class="login-form-divider">或</div>

        <button type="button" class="btn btn-secondary" style="width: 100%; height: 44px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          二维码扫码登录
        </button>

        <div class="login-form-footer">
          登录即代表您同意 <a href="#" style="color: var(--color-primary);">《用户协议》</a> 和 <a href="#" style="color: var(--color-primary);">《隐私政策》</a>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Tab 切换
    document.querySelectorAll('.login-form-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.login-form-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
      });
    });

    function handleLogin() {
      // 跳转首页
      window.location.href = './index.html';
    }
  </script>
</body>
</html>
