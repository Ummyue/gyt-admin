<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>审批流程配置 - 豫港通 v1.0.0</title>
  <link rel="stylesheet" href="../assets/css/design-system.css">
  <link rel="stylesheet" href="../assets/css/list-page.css">
  <link rel="stylesheet" href="../assets/css/approval.css">
  <link rel="stylesheet" href="../assets/css/pin-annotation.css">
  <style>
    .page-body { padding: 20px 24px; }
    /* 空状态 */
    .ap-empty { padding: 40px 16px; text-align: center; color: var(--text-tertiary); font-size: 13px; }

    /* 操作列（与全站列表页一致：右对齐 + 8px 间距 + 12px 字号） */
    .col-action-row {
      display: flex; align-items: center; justify-content: flex-end;
      gap: 8px; white-space: nowrap;
    }
    .col-action-row a { color: var(--color-primary); text-decoration: none; font-size: 12px; }
    .col-action-row a:hover { text-decoration: underline; }
    .col-action-row a.danger { color: #DC2626; }

    /* 应用模块 chip */
    .ap-mod { display: inline-block; padding: 1px 7px; margin: 2px 4px 2px 0;
              font-size: 11px; border-radius: 3px;
              background: var(--bg-disabled); color: var(--text-secondary); }

    /* 长文本列允许换行：避免 nowrap 撑宽表格，导致 sticky 操作列遮挡相邻列
       选择器需高于 .cp-table tbody td（0,1,2），故用 (0,2,2) */
    .cp-table tbody td.ap-wrap-cell { white-space: normal; line-height: 1.6; }
    .ap-wrap-cell .ap-mod { white-space: nowrap; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-logo">
      <div style="width: 36px; height: 36px; background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 16px;">豫</div>
      <span>豫港通</span>
    </div>
    <div class="topbar-menu">
      <a class="topbar-menu-item" href="./workbench.html" data-menu-key="工作台">工作台</a>
      <a class="topbar-menu-item" href="./project-list.html" data-menu-key="准入管理">准入管理</a>
      <a class="topbar-menu-item active" href="./contract-purchase.html" data-menu-key="数字供应链">数字供应链</a>
      <a class="topbar-menu-item" href="./warehouse-inbound.html" data-menu-key="仓储管理">仓储管理</a>
      <a class="topbar-menu-item" href="./cockpit.html" data-menu-key="数据中心">数据中心</a>
      <a class="topbar-menu-item" href="./warning-list.html" data-menu-key="预警中心">预警中心</a>
      <a class="topbar-menu-item" href="./account-personal.html" data-menu-key="账户中心">账户中心</a>
      <button class="pin-trigger-btn" id="pinTriggerBtn" title="页面标记（4 位数字密码保护）"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>标记</button>
      <button class="topbar-changelog-btn" onclick="window.open('./changelog.html', '_blank')" title="查看高保真原型版本变更记录">📋 版本变更记录</button>
    </div>
    <div class="topbar-right">
      <div class="topbar-icon-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="badge"></span>
      </div>
      <div class="topbar-user">
        <div class="topbar-user-avatar">张</div>
        <div>
          <div class="topbar-user-name">张爽</div>
          <div class="topbar-user-org">港通供应链</div>
        </div>
      </div>
    </div>
  </div>

  <div style="display: flex;">
    <div class="sidemenu" id="leftSidemenu"></div>

    <div class="main-content" style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
      <div class="page-body" style="flex: 1; overflow-y: auto; background: var(--bg-page);">

        <!-- 面包屑 -->
        <div class="breadcrumb-inline">
          <a href="./contract-purchase.html">数字供应链</a>
          <span class="sep">/</span>
          <a href="./approval-flow-list.html">审批管理</a>
          <span class="sep">/</span>
          <span class="current">审批流程配置</span>
        </div>

        <!-- 标题 + 右侧按钮 -->
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;">
          <h1 class="page-h1" style="margin: 0;">审批流程配置</h1>
          <div style="display: flex; gap: 10px;">
            <button class="btn btn-primary" onclick="openCreateFlow()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
              新建流程
            </button>
          </div>
        </div>

        <!-- ========== 流程模板列表 ========== -->
        <div class="cp-panel">

          <!-- 区块 1：筛选区 -->
          <div class="cp-block">
            <div class="cp-filter-summary">
              <div class="cp-filter-summary-left">
                当前搜索：<span data-filter-chips class="filter-chips"></span><span class="filter-empty-hint">（无筛选条件）</span>
                <button type="button" class="clear-all-btn" style="display: none;" onclick="clearAllFilters(this)">清除全部</button>
              </div>
              <button class="btn btn-text btn-sm" onclick="exportFlows()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                数据导出
              </button>
            </div>
            <div class="cp-filter">
              <div class="cp-filter-item">
                <span class="cp-filter-label">流程名称</span>
                <input type="text" class="input" id="searchKeyword" placeholder="流程名称或说明" oninput="renderList()">
              </div>
              <div class="cp-filter-item">
                <span class="cp-filter-label">流程状态</span>
                <select class="select" id="filterStatus" onchange="renderList()">
                  <option value="">全部状态</option>
                  <option value="enabled">启用</option>
                  <option value="draft">草稿</option>
                  <option value="disabled">停用</option>
                </select>
              </div>
              <div class="cp-filter-item">
                <span class="cp-filter-label">应用模块</span>
                <select class="select" id="filterModule" onchange="renderList()">
                  <option value="">全部模块</option>
                </select>
              </div>
            </div>
          </div>

          <!-- 区块 2：模板表格 -->
          <div class="cp-block" style="padding: 0;">
            <div class="cp-table-wrap">
              <table class="cp-table" style="min-width: 0;">
                <thead>
                  <tr>
                    <th style="width: 17%;">流程名称</th>
                    <th style="width: 8%;">状态</th>
                    <th style="width: 7%;text-align: center;">节点数</th>
                    <th style="width: 26%;">流程说明</th>
                    <th style="width: 14%;">应用模块</th>
                    <th style="width: 12%;">最后修改</th>
                    <th class="col-action" style="width: 16%;text-align: right;">操作</th>
                  </tr>
                </thead>
                <tbody id="flowTableBody"></tbody>
              </table>
            </div>
          </div>

          <!-- 区块 3：分页 -->
          <div class="cp-block">
            <div class="cp-pagination">
              <div id="pageInfo">共 0 条记录 · 第 1 / 1 页</div>
              <div style="display: flex; align-items: center; gap: 14px;">
                <div class="cp-pagination-pages" id="pageBtns"></div>
                <select class="cp-pagination-size">
                  <option>10 条/页</option>
                  <option>20 条/页</option>
                  <option>50 条/页</option>
                </select>
                <span class="cp-pagination-jump">跳至 <input type="number" min="1" value="1"> 页</span>
              </div>
            </div>
          </div>

        </div>
        <!-- /cp-panel -->


      </div>
    </div>
  </div>
  <!-- /main-content -->

  <script src="../shared/js/topnav-drawer.js"></script>
  <script src="../shared/js/left-sidemenu.js"></script>
  <script src="../shared/js/filter-chips.js"></script>
  <script src="../shared/js/approval-engine.js"></script>
  <script>
    const AE = window.ApprovalEngine;

    let currentPage = 1;
    const PAGE_SIZE = 10;

    // ================================================================
    // 筛选
    // ================================================================
    (function initFilters() {
      const sel = document.getElementById('filterModule');
      AE.APPLY_MODULES.forEach(m => {
        const o = document.createElement('option');
        o.value = m.key; o.textContent = m.label;
        sel.appendChild(o);
      });
    })();

    function getFilteredFlows() {
      const kw = (document.getElementById('searchKeyword').value || '').trim();
      const st = document.getElementById('filterStatus').value;
      const md = document.getElementById('filterModule').value;
      return AE.listFlows().filter(f => {
        if (kw && f.name.indexOf(kw) < 0 && (f.desc || '').indexOf(kw) < 0) return false;
        if (st && f.status !== st) return false;
        if (md && AE.normModules(f.applyModules).indexOf(md) < 0) return false;
        return true;
      });
    }

    // ================================================================
    // 列表渲染
    // ================================================================
    function renderList() {
      const all = getFilteredFlows();
      const totalPages = Math.max(1, Math.ceil(all.length / PAGE_SIZE));
      if (currentPage > totalPages) currentPage = totalPages;
      const rows = all.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

      // 状态 → 设计系统既有 tag 色板
      const statusMeta = {
        enabled:  { label: '启用',   cls: 'tag-green'  },
        draft:    { label: '草稿',   cls: 'tag-yellow' },
        disabled: { label: '停用',   cls: 'tag-gray'   }
      };

      document.getElementById('flowTableBody').innerHTML = rows.map(f => {
        const sm = statusMeta[f.status] || statusMeta.draft;
        const nodeCount = (f.nodes || []).filter(n => n.type !== 'start').length;
        return `<tr>
          <td><span style="font-weight: 600; color: var(--color-primary);">${AE.esc(f.name)}</span></td>
          <td><span class="tag ${sm.cls}">${sm.label}</span></td>
          <td style="text-align: center;">${nodeCount}</td>
          <td class="ap-wrap-cell" style="color: var(--text-secondary);">${AE.esc(f.desc || '—')}</td>
          <td class="ap-wrap-cell">${renderModChips(f.applyModules || [])}</td>
          <td style="color: var(--text-tertiary);">
            ${AE.esc(f.updatedBy || '—')}<br>${AE.esc(f.updatedAt || '—')}
          </td>
          <td class="col-action" style="text-align: right;">
            <div class="col-action-row">
              <a class="link" onclick="openEditor('${f.id}')">编排</a>
              <a class="link" onclick="copyFlow('${f.id}')">复制</a>
              <a class="link" onclick="toggleStatus('${f.id}')">${f.status === 'enabled' ? '停用' : '启用'}</a>
              <a class="link danger" onclick="removeFlow('${f.id}')">删除</a>
            </div>
          </td>
        </tr>`;
      }).join('') || `<tr><td colspan="7"><div class="ap-empty">暂无匹配的流程模板</div></td></tr>`;

      renderPagination(all.length, totalPages);
    }

    /** 应用模块 chip（v1.5.0：子项已下线，仅显示模块名） */
    function renderModChips(list) {
      const keys = AE.normModules(list);
      if (!keys.length) return '<span style="color:var(--text-tertiary);">—</span>';
      return keys.map(key => {
        const mod = AE.getModule(key);
        if (!mod) return '';
        return `<span class="ap-mod" title="${AE.esc(mod.label)}">${AE.esc(mod.label)}</span>`;
      }).join('');
    }

    // ================================================================
    // 分页
    // ================================================================
    function renderPagination(total, totalPages) {
      document.getElementById('pageInfo').textContent =
        `共 ${total} 条记录 · 第 ${currentPage} / ${totalPages} 页`;
      const btns = [`<div class="cp-pagination-page${currentPage === 1 ? ' disabled' : ''}" onclick="gotoPage(${currentPage - 1})">‹</div>`];
      for (let i = 1; i <= totalPages; i++) {
        btns.push(`<div class="cp-pagination-page${i === currentPage ? ' active' : ''}" onclick="gotoPage(${i})">${i}</div>`);
      }
      btns.push(`<div class="cp-pagination-page${currentPage === totalPages ? ' disabled' : ''}" onclick="gotoPage(${currentPage + 1})">›</div>`);
      document.getElementById('pageBtns').innerHTML = btns.join('');
    }

    function gotoPage(p) {
      const totalPages = Math.max(1, Math.ceil(getFilteredFlows().length / PAGE_SIZE));
      if (p < 1 || p > totalPages) return;
      currentPage = p;
      renderList();
    }

    // ================================================================
    // 操作（全部跳转独立编排画布）
    // ================================================================
    function openCreateFlow() {
      location.href = './approval-flow-editor.html?flowId=new';
    }

    function openEditor(id) {
      location.href = './approval-flow-editor.html?flowId=' + encodeURIComponent(id);
    }

    function copyFlow(id) {
      const f = AE.getFlow(id);
      AE.duplicateFlow(id, f.name + ' - 副本');
      renderList();
      toast('已复制流程');
    }

    function toggleStatus(id) {
      const f = AE.getFlow(id);
      f.status = f.status === 'enabled' ? 'disabled' : 'enabled';
      AE.saveFlow(f);
      renderList();
      toast(f.status === 'enabled' ? '流程已启用' : '流程已停用');
    }

    function removeFlow(id) {
      const f = AE.getFlow(id);
      if (!confirm(`确定删除流程「${f.name}」？\n\n删除后引用该流程的业务模块需重新配置。`)) return;
      AE.deleteFlow(id);
      renderList();
      toast('流程已删除');
    }

    function exportFlows() {
      toast('已导出 ' + AE.listFlows().length + ' 条流程配置');
    }

    function toast(msg) {
      const t = document.createElement('div');
      t.textContent = msg;
      t.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);' +
        'background:var(--color-primary);color:#fff;padding:8px 18px;border-radius:6px;' +
        'font-size:13px;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.2);';
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2000);
    }

    // ================================================================
    // 初始化
    // ================================================================
    renderList();
  </script>
  <script src="../assets/js/pin-annotation.js"></script>
</body>
</html>
