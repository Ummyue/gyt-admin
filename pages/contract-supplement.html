<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>补充协议 - 豫港通</title>
  <link rel="stylesheet" href="../assets/css/design-system.css">
  <link rel="stylesheet" href="../assets/css/list-page.css">
  <link rel="stylesheet" href="../assets/css/pin-annotation.css">
  <style>
    .page-body {
      padding: 20px 24px;
    }
    /* 双 tap + 右上角"新增"按钮下拉（v1.7.99.7+ 起，采购/销售合同用） */
    .tab-action-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .add-btn-dropdown {
      position: relative;
      display: inline-block;
    }
    .add-btn-dropdown-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      min-width: 240px;
      background: #fff;
      border: 1px solid var(--border-light);
      border-radius: 6px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
      padding: 4px 0;
      display: none;
      z-index: 100;
    }
    .add-btn-dropdown.open .add-btn-dropdown-menu {
      display: block;
    }
    .add-btn-dropdown-menu a {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      color: var(--text-primary);
      font-size: 13px;
      text-decoration: none;
      transition: background 0.15s;
    }
    .add-btn-dropdown-menu a:hover {
      background: var(--bg-page);
    }

    /* 操作列按钮上下排布（v1.7.99.45 新增） */
    .col-action-stack {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }
    .col-action-stack a {
      display: block;
      padding: 0;
      font-size: 13px;
    }

    /* 右侧抽屉式弹窗（v1.7.99.45 新增） */
    .drawer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.45);
      z-index: 9998;
      display: none;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .drawer-overlay.open {
      display: block;
      opacity: 1;
    }
    .drawer-panel {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 1280px;
      max-width: 92vw;
      background: #fff;
      box-shadow: -4px 0 20px rgba(0, 0, 0, 0.1);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.25s ease;
    }
    .drawer-panel.open {
      transform: translateX(0);
    }
    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border-light);
    }
    .drawer-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .drawer-close {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 18px;
    }
    .drawer-close:hover {
      background: var(--bg-page);
      color: var(--text-primary);
    }
    .drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
    }
    .drawer-section {
      margin-bottom: 24px;
    }
    .drawer-section-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .drawer-section-title .count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 20px;
      padding: 0 6px;
      background: #F3F4F6;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      border-radius: 10px;
    }
    .drawer-contract-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .drawer-contract-item {
      padding: 14px 16px;
      border: 1px solid var(--border-light);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
      background: #fff;
    }
    .drawer-contract-item:hover {
      border-color: var(--color-primary);
      background: #F0F7FF;
    }
    .drawer-contract-item-row1 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px dashed var(--border-light);
    }
    .drawer-contract-code {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--color-primary);
      font-weight: 500;
    }
    .drawer-contract-status {
      font-size: 11px;
      padding: 1px 8px;
      border-radius: 10px;
      font-weight: 500;
    }
    .drawer-contract-status.unsigned {
      background: #FEF3C7;
      color: #CA8A04;
    }
    .drawer-contract-status.executed {
      background: #DCFCE7;
      color: #16A34A;
    }
    .drawer-contract-status.unavailable {
      background: #FEE2E2;
      color: #DC2626;
    }
    /* 合同信息 4 列网格：合同号(横跨)/卖方·品类·合同单价 / 买方·计量单位·合同数量 / 签章状态·签订日期·业务类型 / 交货期限·创建人 */
    .drawer-contract-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px 16px;
      font-size: 12px;
    }
    .drawer-contract-grid-row1 {
      grid-column: 1 / -1;
      display: flex;
      gap: 24px;
      margin-bottom: 4px;
      padding-bottom: 6px;
      border-bottom: 1px dashed var(--border-light);
    }
    .drawer-contract-grid-row1 .field-label {
      color: var(--text-tertiary);
      margin-right: 4px;
    }
    .drawer-contract-grid-row1 .field-value {
      color: var(--text-primary);
      font-weight: 500;
    }
    .drawer-contract-grid-row2 {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px 16px;
    }
    .drawer-field {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .drawer-field-label {
      color: var(--text-tertiary);
      font-size: 11px;
    }
    .drawer-field-value {
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 500;
    }
    .drawer-empty {
      padding: 30px 20px;
      text-align: center;
      color: var(--text-tertiary);
      font-size: 13px;
    }
    .drawer-footer {
      padding: 12px 24px;
      border-top: 1px solid var(--border-light);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    /* 抽屉顶部筛选区（v1.7.99.45-fix 新增）：6 项 / 2 行 3 列 */
    .drawer-filter-section {
      background: var(--bg-page);
      border: 1px solid var(--border-light);
      border-radius: 6px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }
    .drawer-filter-title {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 500;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .drawer-filter-title .filter-actions {
      display: flex;
      gap: 8px;
    }
    .drawer-filter-title .filter-actions button {
      font-size: 12px;
      padding: 3px 10px;
      border: 1px solid var(--border-light);
      background: #fff;
      border-radius: 4px;
      cursor: pointer;
      color: var(--text-secondary);
    }
    .drawer-filter-title .filter-actions button:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }
    .drawer-filter-title .filter-actions button.primary {
      background: var(--color-primary);
      color: #fff;
      border-color: var(--color-primary);
    }
    .drawer-filter-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px 16px;
    }
    .drawer-filter-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .drawer-filter-item .filter-label {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.4;
    }
    .drawer-filter-item .filter-control {
      flex: 1;
      min-width: 0;
    }
    .drawer-filter-item .input,
    .drawer-filter-item .select {
      width: 100%;
    }

    /* 日期范围控件（v1.7.99.45-fix2 新增）：左右 2 个 date input + 分隔符 */
    .drawer-date-range {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .drawer-date-range input {
      flex: 1;
      min-width: 0;
    }
    .drawer-date-range .date-sep {
      color: var(--text-tertiary);
      font-size: 12px;
    }

    /* 抽屉内 4 个 tap（v1.7.99.45-fix2 新增）：全部 / 未签 / 已签 / 不可签 */
    .drawer-tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border-light);
    }
    .drawer-tab {
      padding: 10px 18px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .drawer-tab:hover {
      color: var(--color-primary);
    }
    .drawer-tab.active {
      color: var(--color-primary);
      border-bottom-color: var(--color-primary);
      font-weight: 500;
    }
    .drawer-tab .count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      height: 18px;
      padding: 0 5px;
      background: #F3F4F6;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 500;
      border-radius: 9px;
    }
    .drawer-tab.active .count {
      background: rgba(30, 64, 175, 0.1);
      color: var(--color-primary);
    }

    /* 「新增补充协议」按钮下拉（v1.7.99.45-fix 恢复 v1.7.99.19 旧逻辑，作为合同类型首次过滤入口） */
    .add-btn-dropdown .btn .arrow-down {
      margin-left: 2px;
      transition: transform 0.15s;
    }
    .add-btn-dropdown.open .btn .arrow-down {
      transform: rotate(180deg);
    }
  </style>
</head>

    <div class="sidemenu" id="leftSidemenu"></div>

    <div class="main-content" style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
      <div class="page-body" style="flex: 1; overflow-y: auto; background: var(--bg-page);">

        <div class="tab-action-bar" style="margin-bottom: 14px;">
          <div class="tab-action-bar-tabs">

        +     '</div>'
        +   '</div>'
        +   '<div class="drawer-filter-grid">'
        +     '<div class="drawer-filter-item"><label class="filter-label">合同编号</label><div class="filter-control"><input type="text" class="input" id="drawerFilterCode" placeholder="请输入订单或合同编号"></div></div>'
        +     '<div class="drawer-filter-item"><label class="filter-label">企业名称</label><div class="filter-control"><input type="text" class="input" id="drawerFilterSeller" placeholder="请输入企业名称"></div></div>'
        +     '<div class="drawer-filter-item"><label class="filter-label">品类</label><div class="filter-control"><select class="select" id="drawerFilterCategory"><option>全部</option><option>淀粉</option><option>谷物</option><option>糖粉</option></select></div></div>'
        +     '<div class="drawer-filter-item"><label class="filter-label">业务类型</label><div class="filter-control"><select class="select" id="drawerFilterBizType"><option>全部</option><option>存货业务</option><option>预付业务</option><option>账期业务</option><option>购销业务</option></select></div></div>'
        +     '<div class="drawer-filter-item"><label class="filter-label">签订日期</label><div class="filter-control"><div class="drawer-date-range"><input type="date" class="input" id="drawerFilterSignDateStart"><span class="date-sep">~</span><input type="date" class="input" id="drawerFilterSignDateEnd"></div></div></div>'
        +     '<div class="drawer-filter-item"><label class="filter-label">创建人</label><div class="filter-control"><input type="text" class="input" id="drawerFilterCreator" placeholder="请输入创建人"></div></div>'
        +   '</div>'
        + '</div>';
    }

    // 合同完整 11 字段呈现（4 列网格布局）
    function renderContractList(contracts, contractType) {
      var html = '';
      contracts.forEach(function(c) {
        var statusClass = '', statusText = '';
        if (c.status === 'effective') { statusClass = 'executed'; statusText = '已生效'; }
        else if (c.status === 'unavailable') { statusClass = 'unavailable'; statusText = '不可签'; }
        else { statusClass = 'unsigned'; statusText = '未签订'; }

        var clickAction = '';
        if (c.status === 'effective') {
          clickAction = 'onclick="alert(\'该合同已有已生效补充协议，不可重复签订。\')"';
        } else if (c.status === 'unavailable') {
          clickAction = 'onclick="alert(\'' + (c.reason || '该合同不可签补充协议') + '\')"';
        } else {
          clickAction = 'onclick="selectContractFromDrawer(\'' + c.code + '\', \'' + contractType + '\')"';
        }

        html += ''
          + '<div class="drawer-contract-item" ' + clickAction + ' data-code="' + c.code + '" data-seller="' + c.seller + '" data-category="' + c.category + '" data-biztype="' + c.bizType + '" data-signdate="' + c.signDate + '" data-creator="' + c.creator + '" data-status="' + c.status + '">'
          +   '<div class="drawer-contract-item-row1">'
          +     '<div style="display:flex;align-items:center;gap:12px;">'
          +       '<span style="font-size:11px;color:var(--text-tertiary);">合同编号</span>'
          +       '<span class="drawer-contract-code">' + c.code + '</span>'
          +     '</div>'
          +     '<span class="drawer-contract-status ' + statusClass + '">' + statusText + '</span>'
          +   '</div>'
          +   '<div class="drawer-contract-grid">'
          +     '<div class="drawer-field"><span class="drawer-field-label">卖方企业</span><span class="drawer-field-value">' + c.seller + '</span></div>'
          +     '<div class="drawer-field"><span class="drawer-field-label">买方企业</span><span class="drawer-field-value">' + c.buyer + '</span></div>'
          +     '<div class="drawer-field"><span class="drawer-field-label">品类</span><span class="drawer-field-value">' + c.category + '</span></div>'
          +     '<div class="drawer-field"><span class="drawer-field-label">计量单位</span><span class="drawer-field-value">' + c.unit + '</span></div>'
          +     '<div class="drawer-field"><span class="drawer-field-label">合同单价(元/吨)</span><span class="drawer-field-value">' + c.price + '</span></div>'
          +     '<div class="drawer-field"><span class="drawer-field-label">合同数量(吨)</span><span class="drawer-field-value">' + c.quantity + '</span></div>'
          +     '<div class="drawer-field"><span class="drawer-field-label">合同签章状态</span><span class="drawer-field-value">' + c.signStatus + '</span></div>'
          +     '<div class="drawer-field"><span class="drawer-field-label">签订日期</span><span class="drawer-field-value">' + c.signDate + '</span></div>'
          +     '<div class="drawer-field"><span class="drawer-field-label">业务类型</span><span class="drawer-field-value">' + c.bizType + '</span></div>'
          +     '<div class="drawer-field"><span class="drawer-field-label">合同交货期限</span><span class="drawer-field-value">' + c.deadline + '</span></div>'
          +     '<div class="drawer-field"><span class="drawer-field-label">创建人</span><span class="drawer-field-value">' + c.creator + '</span></div>'
          +     (c.supplement ? '<div class="drawer-field" style="grid-column: 1 / -1;"><span class="drawer-field-label">关联补协编号</span><span class="drawer-field-value" style="color:#1e40af;">' + c.supplement + '</span></div>' : '')
          +     (c.reason ? '<div class="drawer-field" style="grid-column: 1 / -1;"><span class="drawer-field-label">不可签原因</span><span class="drawer-field-value" style="color:#dc2626;">' + c.reason + '</span></div>' : '')
          +   '</div>'
          + '</div>';
      });
      if (contracts.length === 0) {
        html = '<div class="drawer-empty">暂无相关合同</div>';
      }
      return html;
    }

    // 重置筛选条件
    function resetDrawerFilters() {
      var defaults = {
        drawerFilterCode: '',
        drawerFilterSeller: '',
        drawerFilterCategory: '全部',
        drawerFilterBizType: '全部',
        drawerFilterSignDateStart: '',
        drawerFilterSignDateEnd: '',
        drawerFilterCreator: ''
      };
      Object.keys(defaults).forEach(function(id) {
        var el = document.getElementById(id);
        if (el) el.value = defaults[id];
      });
    }

    // 获取当前 tap 的合同列表
    function getCurrentTabContracts(allData) {
      if (CURRENT_DRAWER_TAB === 'all') return allData;
      return allData.filter(function(c) { return c.status === CURRENT_DRAWER_TAB; });
    }

    // 应用筛选条件
    function applyDrawerFilters() {
      if (!CURRENT_DRAWER_TYPE) return;
      var code = (document.getElementById('drawerFilterCode').value || '').trim().toLowerCase();
      var seller = (document.getElementById('drawerFilterSeller').value || '').trim();
      var category = document.getElementById('drawerFilterCategory').value;
      var bizType = document.getElementById('drawerFilterBizType').value;
      var signDateStart = (document.getElementById('drawerFilterSignDateStart').value || '').trim();
      var signDateEnd = (document.getElementById('drawerFilterSignDateEnd').value || '').trim();
      var creator = (document.getElementById('drawerFilterCreator').value || '').trim();
      CURRENT_DRAWER_FILTERS = { code: code, seller: seller, category: category, bizType: bizType, signDateStart: signDateStart, signDateEnd: signDateEnd, creator: creator };

      var allData = DRAWER_CONTRACTS[CURRENT_DRAWER_TYPE];
      var tabData = getCurrentTabContracts(allData);
      var filtered = filterContracts(tabData);

      document.getElementById('drawerContractList').innerHTML = renderContractList(filtered, CURRENT_DRAWER_TYPE);
    }

    // 筛选匹配
    function filterContracts(list) {
      return list.filter(function(c) {
        if (CURRENT_DRAWER_FILTERS.code && (c.code || '').toLowerCase().indexOf(CURRENT_DRAWER_FILTERS.code) === -1) return false;
        if (CURRENT_DRAWER_FILTERS.seller && (c.seller || '').indexOf(CURRENT_DRAWER_FILTERS.seller) === -1) return false;
        if (CURRENT_DRAWER_FILTERS.category && CURRENT_DRAWER_FILTERS.category !== '全部' && c.category !== CURRENT_DRAWER_FILTERS.category) return false;
        if (CURRENT_DRAWER_FILTERS.bizType && CURRENT_DRAWER_FILTERS.bizType !== '全部' && c.bizType !== CURRENT_DRAWER_FILTERS.bizType) return false;
        if (CURRENT_DRAWER_FILTERS.creator && (c.creator || '').indexOf(CURRENT_DRAWER_FILTERS.creator) === -1) return false;
        // 签订日期范围
        if (CURRENT_DRAWER_FILTERS.signDateStart && c.signDate < CURRENT_DRAWER_FILTERS.signDateStart) return false;
        if (CURRENT_DRAWER_FILTERS.signDateEnd && c.signDate > CURRENT_DRAWER_FILTERS.signDateEnd) return false;
        return true;
      });
    }

    function selectContractFromDrawer(contractId, contractType) {
      // 跳转到对应的新增补充协议页面，带入合同号
      var targetUrl = contractType === 'framework'
        ? './contract-supplement-new.html?contractId=' + encodeURIComponent(contractId) + '&contractType=framework'
        : './contract-supplement-order-new.html?contractId=' + encodeURIComponent(contractId) + '&contractType=order';
      window.location.href = targetUrl;
    }

    function closeSupplementDrawer() {
      var overlay = document.getElementById('drawerOverlay');
      var panel = document.getElementById('drawerPanel');
      if (overlay) overlay.classList.remove('open');
      if (panel) panel.classList.remove('open');
      // 动画结束后移除 DOM
      setTimeout(function() {
        var container = document.getElementById('drawerContainer');
        if (container) container.parentNode.removeChild(container);
      }, 300);
    }

    // 行点击进入详情页（v1.7.99.11 起，project-list 等列表页用）
    (function() {
      function bindRowClick() {
        var rows = document.querySelectorAll('.cp-row-clickable');
        rows.forEach(function(row) {
          row.addEventListener('click', function(e) {
            if (e.target.closest('.col-action')) return;
            if (e.target.closest('button, a')) return;
            var status = row.getAttribute('data-status') || '';
            var detailHref = row.getAttribute('data-detail-href');
            if (!detailHref) return;
            var url = detailHref + (status ? '?status=' + encodeURIComponent(status) : '');
            window.location.href = url;
          });
        });
      }
      bindRowClick();
      // 切 tap 后重新绑定
      var origSwitch = switchTap;
      switchTap = function() {
        origSwitch.apply(this, arguments);
        bindRowClick();
      };
    })();

    // 初始化：先解析 URL hash 再渲染（v1.7.99.16m 锁定：#tap=xxx 跳转要 JS 主动解析）
    var initHash = location.hash.match(/tap=([\w-]+)/);
    if (initHash && (initHash[1] === 'framework' || initHash[1] === 'order')) {
      switchTap(initHash[1]);
    } else {
      renderTable();
    }
  </script>
  </div>
  <!-- /main-content -->
<script src="../assets/js/pin-annotation.js"></script>
</body>
</html>
