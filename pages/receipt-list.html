<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>回款管理 - 豫港通</title>
  <link rel="stylesheet" href="../assets/css/design-system.css">
  <link rel="stylesheet" href="../assets/css/list-page.css">
  <link rel="stylesheet" href="../assets/css/pin-annotation.css">
  <style>
    .page-body { padding: 20px 24px; }
    /* 认领状态 3 种 badge 颜色（v1.7.99.66） */
    .claim-status {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 2px 10px; border-radius: 4px; font-size: 12px; font-weight: 500;
    }
    .claim-status.unclaim { background: #FEF3C7; color: #A16207; }
    .claim-status.partial { background: #FFEDD5; color: #EA580C; }
    .claim-status.claimed { background: #D1FAE5; color: #047857; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-logo">
      <div style="width: 36px; height: 36px; background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 16px;">豫</div>
      <span>豫港通</span>
    </div>
    <div class="topbar-menu">
      <a class="topbar-menu-item" href="./workbench.html" data-menu-key="工作台">工作台</a>
      <a class="topbar-menu-item" href="./project-list.html" data-menu-key="准入管理">准入管理</a>
      <a class="topbar-menu-item active" href="./contract-purchase.html" data-menu-key="数字供应链">数字供应链</a>
      <a class="topbar-menu-item" href="./warehouse-inbound.html" data-menu-key="仓储管理">仓储管理</a>
      <a class="topbar-menu-item" href="./cockpit.html" data-menu-key="数据中心">数据中心</a>
      <a class="topbar-menu-item" href="./warning-list.html" data-menu-key="预警中心">预警中心</a>
      <a class="topbar-menu-item" href="./account-personal.html" data-menu-key="账户中心">账户中心</a>
      <button class="topbar-changelog-btn" onclick="window.open('./changelog.html', '_blank')" title="查看高保真原型版本变更记录">📋 版本变更记录</button>
    </div>
    <div class="topbar-right">
      <div class="topbar-icon-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="badge"></span>
      </div>
      <div class="topbar-user">
        <div class="topbar-user-avatar">张</div>
        <div>
          <div class="topbar-user-name">张爽</div>
          <div class="topbar-user-org">港通供应链</div>
        </div>
      </div>
    </div>
  </div>

  <div style="display: flex;">
    <div class="sidemenu" id="leftSidemenu"></div>

    <div class="main-content" style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
      <div class="page-body" style="flex: 1; overflow-y: auto; background: var(--bg-page);">

        <!-- 面包屑 -->
        <div class="breadcrumb-inline">
          <a href="#">数字供应链</a>
          <span class="sep">/</span>
          <a href="#">资金管理</a>
          <span class="sep">/</span>
          <span class="current">回款管理</span>
        </div>

        <!-- 标题 + 新增 -->
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;">
          <h1 class="page-h1" style="margin: 0;">回款管理</h1>
          <button class="btn btn-primary" onclick="addReceipt()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
            新增回款
          </button>
        </div>

        <!-- 合并 panel：筛选 / 状态 tab / 表格 / 分页 -->
        <div class="cp-panel">

          <!-- 区块 1：筛选区（v1.7.99.77 改：6 字段 + actions 全部从 cp-filter-summary 拆出，包到 cp-filter grid 3 列布局；actions 跨列底部对齐） -->
          <div class="cp-block">
            <div class="cp-filter-summary">
              <div class="cp-filter-summary-left">
                当前搜索：<span data-filter-chips class="filter-chips"></span><span class="filter-empty-hint">（无筛选条件）</span>
                <button type="button" class="clear-all-btn" style="display: none;" onclick="clearAllFilters(this)">清除全部</button>
              </div>
            </div>
            <div class="cp-filter">
              <div class="cp-filter-item">
                <span class="cp-filter-label">编号</span>
                <input type="text" class="input" placeholder="请输入订单、合同、业务线、回款编号">
              </div>
              <div class="cp-filter-item">
                <span class="cp-filter-label">回款方</span>
                <input type="text" class="input" placeholder="请输入回款方">
              </div>
              <div class="cp-filter-item">
                <span class="cp-filter-label">收款账号</span>
                <input type="text" class="input" placeholder="请输入收款账号">
              </div>
              <div class="cp-filter-item">
                <span class="cp-filter-label">回款日期</span>
                <input type="text" class="input" placeholder="开始时间 ~ 结束时间">
              </div>
              <div class="cp-filter-item">
                <span class="cp-filter-label">回款方式</span>
                <select class="select"><option>请选择回款方式</option><option>电汇</option><option>商业承兑汇票</option><option>电子银行承兑汇票</option></select>
              </div>
              <div class="cp-filter-item">
                <span class="cp-filter-label">数据来源</span>
                <select class="select"><option>请选择数据来源</option><option>OA同步</option><option>手工录入</option><option>银行同步</option></select>
              </div>
              <!-- v1.7.99.205：删 cp-filter-item "操作"列（查询/重置按钮），按 v1.7.99.184 全站筛选标准统一 -->
            </div>
          </div>

          <!-- 区块 2：状态 tab（v1.7.99.66 4 tab：全部/未认领/部分认领/已认领） -->
          <div class="cp-block cp-block-tab">
            <div class="cp-tab-bar">
              <div class="cp-tab-bar-tabs">
                <div class="cp-tab active" data-status="all" onclick="switchTab(this, 'all')">全部 <span class="count">10</span></div>
                <div class="cp-tab" data-status="unclaim" onclick="switchTab(this, 'unclaim')">未认领 <span class="count" style="color: #A16207; font-weight: 600;">0</span></div>
                <div class="cp-tab" data-status="partial" onclick="switchTab(this, 'partial')">部分认领 <span class="count" style="color: #EA580C; font-weight: 600;">1</span></div>
                <div class="cp-tab" data-status="claimed" onclick="switchTab(this, 'claimed')">已认领 <span class="count" style="color: #047857; font-weight: 600;">9</span></div>
              </div>
              <div class="cp-tab-bar-actions">
                <button class="btn btn-default" style="height: 30px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px;" onclick="exportData()">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                  数据导出
                </button>
              </div>
            </div>
          </div>

          <!-- 区块 3：表格（v1.7.99.66 9 列：回款编号/回款方/回款日期/回款金额/已认领金额/可认领金额/收款账号/认领状态/操作） -->
          <div class="cp-block" style="padding: 0;">
            <div class="cp-table-wrap">
              <table class="cp-table">
                <thead>
                  <tr>
                    <th style="width: 9%;">回款编号</th>
                    <th style="width: 16%;">回款方</th>
                    <th style="width: 9%;">回款日期</th>
                    <th style="width: 10%;text-align: right;">回款金额(元)</th>
                    <th style="width: 10%;text-align: right;">已认领金额(元)</th>
                    <th style="width: 10%;text-align: right;">可认领金额(元)</th>
                    <th style="width: 16%;">收款账号</th>
                    <th style="width: 8%;" class="col-status">认领状态</th>
                    <th class="col-action" style="width: 12%;text-align: right;">操作</th>
                  </tr>
                </thead>
                <tbody id="receiptTbody"></tbody>
              </table>
            </div>
          </div>

          <!-- 区块 4：分页 -->
          <div class="cp-block">
            <div class="cp-pagination">
              <div id="paginationInfo">共 10 条记录 · 第 1 / 1 页</div>
              <div style="display: flex; align-items: center; gap: 14px;">
                <div class="cp-pagination-pages">
                  <div class="cp-pagination-page">‹</div>
                  <div class="cp-pagination-page active">1</div>
                  <div class="cp-pagination-page">›</div>
                </div>
                <select class="cp-pagination-size">
                  <option>10 条/页</option>
                  <option>20 条/页</option>
                  <option>50 条/页</option>
                </select>
                <span class="cp-pagination-jump">跳至 <input type="number" min="1" value="1"> 页</span>
              </div>
            </div>
          </div>

        </div>

      </div>
    </div>
  </div>

  <script src="../shared/js/topnav-drawer.js"></script>
  <script src="../shared/js/left-sidemenu.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    // ========== v1.7.99.66 回款管理 mock 数据（10 行真实感但脱敏） ==========
    var RECEIPT_MOCK = [
      { id: 1, no: '961416', payer: '郑州信必达国际供应链有限公司', date: '2026-07-28', amount: 229467.09, claimed: 229467.09, status: 'claimed', account: '河南中豫港通供应链管理有限...', method: '电汇', source: '手工录入' },
      { id: 2, no: '797043', payer: '郑州信必达国际供应链有限公司', date: '2026-07-27', amount: 229467.09, claimed: 229467.09, status: 'claimed', account: '河南中豫港通供应链管理有限...', method: '电汇', source: '手工录入' },
      { id: 3, no: '764711', payer: '郑州信必达国际供应链有限公司', date: '2026-07-24', amount: 113070.74, claimed: 113070.74, status: 'claimed', account: '河南中豫港通供应链管理有限...', method: '电汇', source: '银行同步' },
      { id: 4, no: '863989', payer: '郑州信必达国际供应链有限公司', date: '2026-07-23', amount: 229467.09, claimed: 229467.09, status: 'claimed', account: '河南中豫港通供应链管理有限...', method: '电汇', source: '手工录入' },
      { id: 5, no: '483613', payer: '郑州信必达国际供应链有限公司', date: '2026-07-22', amount: 113070.74, claimed: 113070.74, status: 'claimed', account: '河南中豫港通供应链管理有限...', method: '电子银行承兑汇票', source: '手工录入' },
      { id: 6, no: '887676', payer: '郑州信必达国际供应链有限公司', date: '2026-07-20', amount: 159447.72, claimed: 159447.72, status: 'claimed', account: '河南中豫港通供应链管理有限...', method: '电汇', source: '手工录入' },
      { id: 7, no: '713327', payer: '郑州信必达国际供应链有限公司', date: '2026-07-20', amount: 173763.12, claimed: 173763.12, status: 'claimed', account: '河南中豫港通供应链管理有限...', method: '电汇', source: '银行同步' },
      { id: 8, no: '926521', payer: '郑州信必达国际供应链有限公司', date: '2026-07-18', amount: 109963.95, claimed: 109963.95, status: 'claimed', account: '河南中豫港通供应链管理有限...', method: '电汇', source: '手工录入' },
      { id: 9, no: '361195', payer: '郑州信必达国际供应链有限公司', date: '2026-07-17', amount: 106822.12, claimed: 106822.12, status: 'claimed', account: '河南中豫港通供应链管理有限...', method: '电汇', source: 'OA同步' },
      { id: 10, no: '396835', payer: '郑州信必达国际供应链有限公司', date: '2026-07-17', amount: 43681.10, claimed: 0, status: 'partial', account: '河南中豫港通供应链管理有限...', method: '电子银行承兑汇票', source: '手工录入' }
    ];
    var STATUS_MAP = {
      'unclaim': { label: '未认领', cls: 'unclaim' },
      'partial': { label: '部分认领', cls: 'partial' },
      'claimed': { label: '已认领', cls: 'claimed' }
    };
    function fmt(n) { return n.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

    // ========== v1.7.99.66 渲染表格 ==========
    var currentTab = 'all';
    function renderTable() {
      var list = RECEIPT_MOCK.filter(function(r) { return currentTab === 'all' || r.status === currentTab; });
      var tbody = document.getElementById('receiptTbody');
      if (!tbody) return;
      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" style="text-align: center; padding: 60px 0; color: var(--text-tertiary);">暂无数据</td></tr>';
        return;
      }
      tbody.innerHTML = list.map(function(r) {
        var remain = (r.amount - r.claimed);
        var meta = STATUS_MAP[r.status] || { label: r.status, cls: '' };
        return '<tr class="cp-row-clickable" data-detail-href="./receipt-detail.html?no=' + r.no + '" style="cursor: pointer;">'
          + '<td class="col-num">' + r.no + '</td>'
          + '<td>' + r.payer + '</td>'
          + '<td>' + r.date + '</td>'
          + '<td style="text-align: right;" class="col-num">' + fmt(r.amount) + '</td>'
          + '<td style="text-align: right;" class="col-num">' + fmt(r.claimed) + '</td>'
          + '<td style="text-align: right;" class="col-num">' + fmt(remain) + '</td>'
          + '<td style="color: var(--text-secondary);" title="' + r.account + '">' + r.account + '</td>'
          + '<td class="col-status"><span class="claim-status ' + meta.cls + '">' + meta.label + '</span></td>'
          + '<td class="col-action" style="text-align: right;">'
          +   '<a href="./receipt-detail.html?no=' + r.no + '">详情</a> '
          +   '<a href="./receipt-edit.html?no=' + r.no + '">修改</a> '
          +   '<a href="javascript:void(0)" style="color: #DC2626;" onclick="deleteReceipt(' + r.id + ')">删除</a>'
          + '</td>'
          + '</tr>';
      }).join('');
      document.getElementById('paginationInfo').textContent = '共 ' + list.length + ' 条记录 · 第 1 / 1 页';
    }
    function switchTab(el, key) {
      currentTab = key;
      document.querySelectorAll('.cp-tab').forEach(function(t) { t.classList.remove('active'); });
      el.classList.add('active');
      renderTable();
    }
    function addReceipt() { window.location.href = './receipt-edit.html?action=new'; }
    function exportData() { Utils.toast('已发起数据导出（mock）', 'success'); }
    function deleteReceipt(id) {
      var r = RECEIPT_MOCK.find(function(x) { return x.id === id; });
      if (!r) return;
      if (!confirm('确定要删除回款编号【' + r.no + '】吗？\n\n删除后数据将不可恢复。')) return;
      RECEIPT_MOCK = RECEIPT_MOCK.filter(function(x) { return x.id !== id; });
      Utils.toast('已删除：' + r.no, 'success');
      renderTable();
    }
    renderTable();
  </script>
<script src="../assets/js/pin-annotation.js"></script>
</body>
</html>
