<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>流程编排 - 豫港通 v1.2.0</title>
  <link rel="stylesheet" href="../assets/css/design-system.css">
  <link rel="stylesheet" href="../assets/css/list-page.css">
  <link rel="stylesheet" href="../assets/css/approval.css">
  <link rel="stylesheet" href="../assets/css/pin-annotation.css">
  <style>
    .page-body { padding: 20px 24px; }
    /* ===== 顶部：返回 + 流程名 + 步骤条 + 保存 ===== */
    .wz-topbar {
      position: sticky; top: 0; z-index: 60;
      display: flex; align-items: center; gap: 16px;
      padding: 14px 24px; background: var(--bg-card);
      border-bottom: 1px solid var(--border-default);
    }
    .wz-back {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 13px; color: var(--text-secondary); cursor: pointer;
      padding: 4px 8px; border-radius: 4px; text-decoration: none;
    }
    .wz-back:hover { background: var(--bg-hover); color: var(--color-primary); }

    .wz-title { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .wz-title-name {
      font-size: 16px; font-weight: 600; color: var(--text-primary);
      max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .wz-dirty {
      display: none; align-items: center; gap: 5px;
      font-size: 12px; color: #B45309; background: #FFFBEB;
      border: 1px solid #FDE68A; border-radius: 4px; padding: 2px 8px;
      white-space: nowrap;
    }
    .wz-dirty.show { display: inline-flex; }

    /* 步骤条 */
    .wz-steps { display: flex; align-items: center; gap: 0; margin: 0 auto; }
    .wz-step {
      display: flex; align-items: center; gap: 8px; cursor: pointer;
      padding: 4px 14px; border-radius: 999px;
      font-size: 13px; color: var(--text-secondary); white-space: nowrap;
    }
    .wz-step:hover { background: var(--bg-hover); }
    .wz-step-no {
      width: 20px; height: 20px; border-radius: 50%;
      border: 1px solid var(--border-strong); color: var(--text-tertiary);
      font-size: 11px; line-height: 18px; text-align: center; flex-shrink: 0;
    }
    .wz-step.active { color: var(--color-primary); font-weight: 500; background: #EFF6FF; }
    .wz-step.active .wz-step-no {
      background: var(--color-primary); border-color: var(--color-primary);
      color: var(--text-inverse); font-weight: 600;
    }
    .wz-step.done .wz-step-no {
      background: #DCFCE7; border-color: #86EFAC; color: #15803D; font-weight: 600;
    }
    .wz-step-sep { width: 36px; height: 1px; background: var(--border-default); }

    .wz-actions { display: flex; align-items: center; gap: 10px; }

    /* ===== 步骤内容 ===== */
    .wz-step-pane { display: none; }
    .wz-step-pane.active { display: block; }

    /* ===== 基础信息（v1.7.0：白色底板 + 表单居中） ===== */
    .wz-panel { max-width: 860px; margin: 20px auto 0; }
    .wz-panel-foot { display: flex; justify-content: center; }
    .wz-form { max-width: 760px; margin: 0 auto; padding: 0; }
    .wz-field { margin-bottom: 22px; }
    .wz-field-label {
      display: block; font-size: 13px; color: var(--text-primary);
      margin-bottom: 8px; font-weight: 500;
    }
    .wz-field-label .req { color: #DC2626; margin-right: 3px; }
    .wz-field-label .opt { color: var(--text-tertiary); font-weight: 400; font-size: 12px; margin-left: 6px; }
    .wz-field-help { font-size: 12px; color: var(--text-tertiary); margin-top: 6px; line-height: 1.6; }

    .wz-mods { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 24px; }
    .wz-mod { display: flex; align-items: center; gap: 8px; }
    .wz-mod-main { display: flex; align-items: center; gap: 6px; flex: none; }
    .wz-mod-main label { font-size: 13px; color: var(--text-primary); cursor: pointer; }

    /* ===== 抽屉：审批通知复选下拉 + 金额条件行（v1.8.0） ===== */
    .wz-dd { position: relative; }
    .wz-dd-trigger {
      display: flex; align-items: center; gap: 6px;
      width: 100%; min-height: 30px; padding: 5px 8px;
      font-size: 12px; color: var(--text-secondary); text-align: left;
      background: var(--bg-card); border: 1px solid var(--border-default);
      border-radius: 4px; cursor: pointer;
    }
    .wz-dd-trigger:hover { border-color: var(--color-primary); color: var(--color-primary); }
    .wz-dd-text { flex: 1; line-height: 1.6; }
    .wz-dd-text.is-empty { color: var(--text-tertiary); }
    .wz-dd-trigger svg { flex: none; }
    .wz-dd-panel {
      position: absolute; z-index: 90; top: calc(100% + 4px); left: 0;
      max-height: 260px; overflow-y: auto;
      min-width: 100%; padding: 5px;
      background: var(--bg-card); border: 1px solid var(--border-default);
      border-radius: 6px; box-shadow: 0 6px 18px rgba(15, 23, 42, .14);
      display: none;
    }
    .wz-dd.open .wz-dd-panel { display: block; }
    /* .ap-drawer-body 是 overflow:auto，靠近底部时向下弹会被裁 → 空间不够就向上弹 */
    .wz-dd.open.up .wz-dd-panel { top: auto; bottom: calc(100% + 4px); }
    .wz-dd-bar {
      display: flex; gap: 12px; padding: 3px 6px 6px; margin-bottom: 4px;
      border-bottom: 1px solid var(--border-light);
      font-size: 11px; color: var(--color-primary);
    }
    .wz-dd-bar span { cursor: pointer; }
    .wz-dd-bar span:hover { text-decoration: underline; }
    .wz-dd-opt {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 6px; border-radius: 4px;
      font-size: 12px; color: var(--text-primary); cursor: pointer; white-space: nowrap;
    }
    .wz-dd-opt:hover { background: var(--bg-hover); }
    .wz-dd-opt .ph { margin-left: auto; font-size: 11px; color: var(--text-tertiary); }

    /* 通知面板按部门分组 */
    .notify-grp + .notify-grp { margin-top: 4px; padding-top: 4px; border-top: 1px solid var(--border-light); }
    .notify-grp-title {
      padding: 4px 6px 2px; font-size: 11px; color: var(--text-tertiary); font-weight: 500;
    }

    /* 通知类型：站内信锁定 + 短信可勾（v1.10.0） */
    .cv-chan-box {
      border: 1px solid var(--border-default); border-radius: 6px; overflow: hidden; background: #fff;
    }
    .cv-chan-box.is-disabled { background: var(--bg-hover); }
    .cv-chan-opt {
      display: flex; align-items: center; gap: 8px; cursor: pointer;
      padding: 9px 12px; font-size: 13px; color: var(--text-primary);
    }
    .cv-chan-opt + .cv-chan-opt { border-top: 1px solid var(--border-light); }
    .cv-chan-opt:hover { background: var(--bg-hover); }
    .cv-chan-box.is-disabled .cv-chan-opt { cursor: not-allowed; color: var(--text-tertiary); }
    .cv-chan-box.is-disabled .cv-chan-opt:hover { background: transparent; }
    .cv-chan-lock {
      margin-left: auto; padding: 1px 7px; border-radius: 10px; font-size: 11px; line-height: 16px;
      color: var(--color-primary, #2563EB); background: #EFF6FF; border: 1px solid #DBEAFE;
    }

    /* 触发条件：固定金额条件行 */
    .cv-cond-row { display: flex; align-items: center; gap: 8px; }
    .cv-cond-field {
      flex: none; padding: 0 9px; height: 30px; line-height: 30px;
      font-size: 12px; color: var(--text-secondary);
      background: var(--bg-disabled); border-radius: 4px;
    }

    /* ===== 编排画布（v1.6.0：整页铺满 + 节点自上而下） ===== */
    /* 进入步骤 2 时 page-body 不再整体滚动，改由画布自身滚动 */
    /* 注意：.page-body 上有内联 style="overflow-y:auto"，优先级高于样式表，
       这里必须用 !important 才能真正接管滚动 */
    .page-body.is-canvas { overflow: hidden !important; display: flex; flex-direction: column; }
    .page-body.is-canvas .wz-step-pane.active { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    .cv-head {
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0; padding-bottom: 10px;
    }
    .cv-body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
    .cv-canvas {
      flex: 1; min-height: 0; overflow-y: auto;
      display: flex; flex-direction: column; align-items: center;
      padding: 20px 24px; background: var(--bg-hover);
      border: 1px solid var(--border-default); border-radius: 8px;
    }
    .cv-node {
      width: 420px; max-width: 100%; flex-shrink: 0; background: var(--bg-card);
      border: 1px solid var(--border-default); border-radius: 8px;
      border-left: 3px solid var(--node-color, #64748B);
      cursor: pointer; transition: all .15s;
    }
    .cv-node:hover { box-shadow: var(--shadow-sm); border-color: var(--border-strong); }
    .cv-node.active { box-shadow: 0 0 0 2px rgba(30,64,175,.18); border-color: var(--color-primary); }
    .cv-node.has-cond { background: #FFFBEB; }
    .cv-node-head {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px 8px; border-bottom: 1px solid var(--border-light);
    }
    .cv-node-no {
      width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%;
      background: var(--node-color, #64748B); color: var(--text-inverse);
      font-size: 11px; line-height: 22px; text-align: center; font-weight: 600;
    }
    .cv-node-title {
      flex: 1; min-width: 0; font-size: 13px; font-weight: 600;
      color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .cv-node-body { padding: 10px 12px; }
    .cv-node-type {
      display: inline-block; padding: 1px 6px; margin-bottom: 8px;
      font-size: 11px; border-radius: 3px;
      background: var(--bg-disabled); color: var(--text-secondary);
    }
    .cv-node-type.t-serial   { background: #EFF6FF; color: #1E40AF; }
    .cv-node-type.t-parallel { background: #F5F3FF; color: #6D28D9; }
    .cv-node-type.t-system   { background: var(--bg-disabled); color: var(--text-secondary); }
    .cv-node-cond {
      display: inline-block; padding: 1px 6px; margin-left: 6px;
      font-size: 11px; border-radius: 3px;
      background: #FFFBEB; color: #B45309;
    }
    .cv-line {
      display: flex; align-items: center; gap: 4px;
      font-size: 11px; color: var(--text-secondary); margin-top: 4px;
    }
    .cv-line .ico { width: 13px; color: var(--text-tertiary); flex-shrink: 0; }
    .cv-line .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .cv-node-ops { display: flex; gap: 2px; flex-shrink: 0; }
    .cv-op {
      width: 20px; height: 20px; border: 1px solid transparent; background: transparent;
      border-radius: 3px; cursor: pointer; color: var(--text-tertiary);
      font-size: 12px; line-height: 1; display: inline-flex;
      align-items: center; justify-content: center; padding: 0;
    }
    .cv-op:hover { border-color: var(--border-strong); color: var(--color-primary); background: var(--bg-hover); }
    .cv-op.danger:hover { color: #DC2626; border-color: #FCA5A5; }

    /* ===== 抽屉：审批方式单选卡（v1.6.0） ===== */
    .cv-mode { display: flex; gap: 10px; }
    .cv-mode-opt {
      flex: 1; display: flex; align-items: flex-start; gap: 8px;
      padding: 10px 12px; cursor: pointer;
      border: 1px solid var(--border-default); border-radius: 8px;
      background: var(--bg-card); transition: all .15s;
    }
    .cv-mode-opt:hover { border-color: var(--color-primary); }
    .cv-mode-opt.active { border-color: var(--color-primary); background: var(--color-primary-lighter); }
    .cv-mode-opt input { margin: 2px 0 0; flex-shrink: 0; }
    .cv-mode-name { font-size: 13px; font-weight: 500; color: var(--text-primary); }
    .cv-mode-desc { font-size: 11px; color: var(--text-tertiary); margin-top: 3px; line-height: 1.5; }

    /* 连接线 + 加号（竖向，节点自上而下） */
    .cv-conn {
      display: flex; align-items: center; justify-content: center;
      height: 34px; width: auto; flex-shrink: 0; position: relative;
    }
    .cv-conn-line { width: 1px; height: 100%; background: var(--border-strong); position: relative; }
    .cv-conn-line::after {
      content: ''; position: absolute; left: -3.5px; bottom: -1px;
      border-top: 6px solid var(--border-strong);
      border-left: 3.5px solid transparent; border-right: 3.5px solid transparent;
    }
    .cv-conn-add {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--bg-card); border: 1px solid var(--border-strong);
      color: var(--text-tertiary); font-size: 14px; line-height: 20px; text-align: center;
      cursor: pointer; z-index: 3; padding: 0;
    }
    .cv-conn-add:hover { border-color: var(--color-primary); color: var(--color-primary); }

    /* 加号选项卡片：往下展开 */
    .cv-picker {
      position: absolute; top: calc(50% + 16px); left: 50%; transform: translateX(-50%);
      width: 220px; background: var(--bg-card);
      border: 1px solid var(--border-default); border-radius: 8px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, .14);
      z-index: 40; padding: 4px; display: none;
    }
    .cv-picker.open { display: block; }
    .cv-picker-title {
      font-size: 11px; color: var(--text-tertiary);
      padding: 6px 10px 4px; border-bottom: 1px solid var(--border-light); margin-bottom: 4px;
    }
    .cv-picker-item {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 8px 10px; border-radius: 6px; cursor: pointer;
    }
    .cv-picker-item:hover { background: var(--bg-hover); }
    .cv-picker-ico {
      width: 24px; height: 24px; border-radius: 6px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 600; color: var(--text-inverse);
    }
    .cv-picker-ico.s    { background: #2563EB; }
    .cv-picker-ico.p    { background: #7C3AED; }
    .cv-picker-ico.b    { background: #F59E0B; }
    .cv-picker-name { font-size: 13px; color: var(--text-primary); }
    .cv-picker-desc { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; line-height: 1.5; }

    .cv-footbar {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border-light);
    }

    /* ===== 节点属性抽屉（字段） ===== */
    .cv-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .cv-field:last-child { margin-bottom: 0; }
    .cv-field > label { font-size: 12px; color: var(--text-secondary); font-weight: 500; }
    .cv-field .input, .cv-field .select { width: 100%; }
    .cv-field-help { font-size: 11px; color: var(--text-tertiary); line-height: 1.6; }
    .cv-field-title {
      font-size: 12px; color: var(--text-primary); font-weight: 600;
      padding-bottom: 8px; margin-bottom: 16px; border-bottom: 1px solid var(--border-light);
    }
    .cv-remind-box {
      border: 1px solid var(--border-default); border-radius: 6px; padding: 12px;
      background: var(--bg-hover);
    }
    .cv-remind-row { display: flex; align-items: center; gap: 8px; }
    .cv-remind-row .input { width: 84px; }
    .cv-remind-row .unit { font-size: 12px; color: var(--text-secondary); }
    .cv-sign-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .cv-sign-row .select { flex: 1; min-width: 0; }
    .cv-rule {
      border: 1px solid var(--border-default); border-radius: 6px;
      padding: 10px; margin-bottom: 8px; background: var(--bg-hover);
    }
    .cv-rule-grid { display: grid; grid-template-columns: 1fr 64px 1fr; gap: 6px; align-items: center; }
    .cv-rule-grid .select, .cv-rule-grid .input { width: 100%; min-width: 0; }
    .cv-rule-foot { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
    .cv-rule-foot .label { font-size: 11px; color: var(--text-tertiary); flex-shrink: 0; }

    /* ===== 流程图预览弹窗 ===== */
    .ap-modal-mask {
      position: fixed; inset: 0; background: rgba(15, 23, 42, .45);
      z-index: 1100; display: none; align-items: center; justify-content: center;
    }
    .ap-modal-mask.open { display: flex; }
    .ap-modal {
      width: 720px; max-width: 92vw; max-height: 84vh;
      background: var(--bg-card); border-radius: 10px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, .22);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .ap-modal-header {
      padding: 16px 20px; border-bottom: 1px solid var(--border-default);
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    .ap-modal-title { font-size: 15px; font-weight: 600; color: var(--text-primary); }
    .ap-modal-sub { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }
    .ap-modal-body { padding: 20px 24px; overflow-y: auto; flex: 1; }
    .ap-modal-footer {
      padding: 12px 20px; border-top: 1px solid var(--border-default);
      display: flex; align-items: center; justify-content: flex-end; gap: 10px; flex-shrink: 0;
    }

    /* 预览内的节点摘要条 */
    .pv-summary {
      display: grid; grid-template-columns: 120px 1fr; gap: 8px 12px;
      padding: 14px 16px; background: var(--bg-hover);
      border: 1px solid var(--border-default); border-radius: 6px; margin-bottom: 18px;
    }
    .pv-summary .k { font-size: 12px; color: var(--text-tertiary); }
    .pv-summary .v { font-size: 13px; color: var(--text-primary); font-weight: 500; }
    .pv-summary .v .hint { margin-left: 6px; font-size: 11px; color: var(--text-tertiary); font-weight: 400; }

    /* 抽屉内嵌表格 */
    .cp-table.is-compact { min-width: 0; }
    .cp-table.is-compact thead th,
    .cp-table.is-compact tbody td { padding: 8px 10px; font-size: 12px; white-space: normal; }

    .ap-empty { padding: 40px 16px; text-align: center; color: var(--text-tertiary); font-size: 13px; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-logo">
      <div style="width: 36px; height: 36px; background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 16px;">豫</div>
      <span>豫港通</span>
    </div>
    <div class="topbar-menu">
      <a class="topbar-menu-item" href="./workbench.html" data-menu-key="工作台">工作台</a>
      <a class="topbar-menu-item" href="./project-list.html" data-menu-key="准入管理">准入管理</a>
      <a class="topbar-menu-item active" href="./contract-purchase.html" data-menu-key="数字供应链">数字供应链</a>
      <a class="topbar-menu-item" href="./warehouse-inbound.html" data-menu-key="仓储管理">仓储管理</a>
      <a class="topbar-menu-item" href="./cockpit.html" data-menu-key="数据中心">数据中心</a>
      <a class="topbar-menu-item" href="./warning-list.html" data-menu-key="预警中心">预警中心</a>
      <a class="topbar-menu-item" href="./account-personal.html" data-menu-key="账户中心">账户中心</a>
      <button class="topbar-changelog-btn" onclick="window.open('./changelog.html', '_blank')" title="查看高保真原型版本变更记录">📋 版本变更记录</button>
    </div>
    <div class="topbar-right">
      <div class="topbar-icon-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="badge"></span>
      </div>
      <div class="topbar-user">
        <div class="topbar-user-avatar">张</div>
        <div>
          <div class="topbar-user-name">张爽</div>
          <div class="topbar-user-org">港通供应链</div>
        </div>
      </div>
    </div>
  </div>

  <div style="display: flex;">
    <div class="sidemenu" id="leftSidemenu"></div>

    <div class="main-content" style="flex: 1; min-width: 0; display: flex; flex-direction: column;">

      <!-- ===== 顶部：返回 + 流程名 + 步骤条 + 保存 ===== -->
      <div class="wz-topbar">
        <a class="wz-back" href="javascript:void(0)" onclick="goBack()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
          返回
        </a>
        <div class="wz-title">
          <span class="wz-title-name" id="topFlowName">新建审批流程</span>
          <span class="tag tag-gray" id="topFlowStatus">草稿</span>
          <span class="wz-dirty" id="dirtyFlag">● 有未保存的修改</span>
        </div>

        <div class="wz-steps">
          <div class="wz-step active" id="step1Btn" onclick="gotoStep(1)">
            <span class="wz-step-no">1</span>基础信息
          </div>
          <div class="wz-step-sep"></div>
          <div class="wz-step" id="step2Btn" onclick="gotoStep(2)">
            <span class="wz-step-no">2</span>流程设计
          </div>
        </div>

        <div class="wz-actions">
          <button class="btn btn-default" onclick="openPreview()">流程图预览</button>
          <button class="btn btn-primary" onclick="saveDraft()">保存</button>
        </div>
      </div>

      <div class="page-body" style="flex: 1; overflow-y: auto; background: var(--bg-page);">

        <!-- 面包屑 -->
        <div class="breadcrumb-inline">
          <a href="./contract-purchase.html">数字供应链</a>
          <span class="sep">/</span>
          <a href="./approval-flow-list.html">审批管理</a>
          <span class="sep">/</span>
          <a href="./approval-flow-list.html">审批流程配置</a>
          <span class="sep">/</span>
          <span class="current">流程编排</span>
        </div>

        <!-- ===== 步骤 1：基础信息 ===== -->
        <div class="wz-step-pane active" id="pane1">
          <!-- v1.7.0：补白色底板（cp-panel + cp-block），与图2 标准页 / 全站表单页一致 -->
          <div class="cp-panel wz-panel">
            <div class="cp-block">
          <div class="wz-form">

            <div class="wz-field">
              <label class="wz-field-label"><span class="req">*</span>流程名称</label>
              <input type="text" class="input" id="edFlowName" placeholder="请输入流程名称"
                     maxlength="40" oninput="onEdit()">
              <div class="wz-field-help">建议体现适用场景，例如「采购合同高风险审批流程」</div>
            </div>

            <div class="wz-field">
              <label class="wz-field-label">流程说明</label>
              <textarea class="textarea" id="edFlowDesc" rows="2"
                        placeholder="用一句话描述这个流程的适用场景"
                        oninput="onEdit()"></textarea>
            </div>

            <div class="wz-field">
              <label class="wz-field-label">流程状态</label>
              <div style="display: flex; gap: 20px; align-items: center;">
                <label style="display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer;">
                  <input type="radio" name="flowStatus" value="draft" onchange="onEdit()">草稿
                </label>
                <label style="display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer;">
                  <input type="radio" name="flowStatus" value="enabled" onchange="onEdit()">启用
                </label>
                <label style="display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer;">
                  <input type="radio" name="flowStatus" value="disabled" onchange="onEdit()">停用
                </label>
              </div>
              <div class="wz-field-help">草稿仅自己可见；启用状态的流程才会被应用模块的业务单据引用</div>
            </div>

            <div class="wz-field">
              <label class="wz-field-label">
                <span class="req">*</span>应用模块
                <span class="opt">至少选择一个</span>
              </label>
              <div class="wz-mods" id="modPicker"></div>
              <div class="wz-field-help">
                勾选后，对应业务模块的单据将引用此流程模板。
              </div>
            </div>

          </div>
            </div>
            <div class="cp-block wz-panel-foot">
              <button class="btn btn-primary" style="min-width:120px;" onclick="gotoStep(2)">下一步：流程设计</button>
            </div>
          </div>
        </div>

        <!-- ===== 步骤 2：流程设计 ===== -->
        <div class="wz-step-pane" id="pane2">
          <div class="cv-head">
            <div style="font-size: 13px; font-weight: 600; color: var(--text-primary);">
              节点编排画布
              <span style="font-weight: 400; color: var(--text-tertiary); margin-left: 8px;">
                自上而下依次执行 · 点连接线上的 + 插入审批节点 · 点节点卡片在右侧抽屉编辑属性
              </span>
            </div>
            <span style="font-size: 12px; color: var(--text-tertiary);" id="nodeCountHint"></span>
          </div>

          <div class="cv-body">
            <div class="cv-canvas" id="canvas"></div>
            <div class="cv-footbar">
              <button class="btn btn-default btn-sm" onclick="gotoStep(1)">上一步：基础信息</button>
              <div style="flex:1;"></div>
              <span style="font-size: 12px; color: var(--text-tertiary);">
                至少保留「提交申请」发起节点与「归档完成」节点，二者不可删除
              </span>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
  <!-- /main-content -->

  <!-- ===== 节点属性抽屉（平台统一右侧抽屉） ===== -->
  <div class="ap-drawer-overlay" id="propsOverlay" onclick="closePropsDrawer()"></div>
  <div class="ap-drawer" id="propsDrawer" style="width: 520px;">
    <div class="ap-drawer-header">
      <div>
        <div class="ap-drawer-title" id="propsTitle">节点属性</div>
        <div class="ap-drawer-subtitle" id="propsSubtitle"></div>
      </div>
      <span class="ap-drawer-close" onclick="closePropsDrawer()">×</span>
    </div>
    <div class="ap-drawer-body" id="propsBody"></div>
    <div class="ap-drawer-footer">
      <button class="btn btn-default" onclick="closePropsDrawer()">关闭</button>
      <button class="btn btn-primary" onclick="closePropsDrawer()">完成</button>
    </div>
  </div>

  <!-- ===== 流程图预览弹窗 ===== -->
  <div class="ap-modal-mask" id="previewMask" onclick="if(event.target===this) closePreview()">
    <div class="ap-modal">
      <div class="ap-modal-header">
        <div>
          <div class="ap-modal-title" id="pvTitle">流程图预览</div>
          <div class="ap-modal-sub" id="pvSubtitle"></div>
        </div>
        <span class="ap-drawer-close" onclick="closePreview()">×</span>
      </div>
      <div class="ap-modal-body" id="pvBody"></div>
      <div class="ap-modal-footer">
        <button class="btn btn-default" onclick="closePreview()">关闭</button>
      </div>
    </div>
  </div>

  <script src="../shared/js/topnav-drawer.js"></script>
  <script src="../shared/js/left-sidemenu.js"></script>
  <script src="../shared/js/approval-engine.js"></script>
  <script>
    const AE = window.ApprovalEngine;
    const ALL_PEOPLE = AE.listPeople();

    const STATUS_META = {
      draft:    { label: '草稿',   cls: 'tag-gray'   },
      enabled:  { label: '启用', cls: 'tag-green'  },
      disabled: { label: '停用', cls: 'tag-gray'  }
    };

    let draft = null;       // 当前编辑中的流程
    let step = 1;           // 当前步骤
    let selNodeIdx = -1;    // 选中节点下标
    let openPickerPos = -1; // 当前展开选项卡片的连接线位置

    // ================================================================
    // 初始化
    // ================================================================
    (function init() {
      const q = new URLSearchParams(location.search);
      const flowId = q.get('flowId');
      const isCreate = !flowId || flowId === 'new';

      if (isCreate) {
        draft = {
          id: 'flow_' + Date.now(),
          name: '新建审批流程',
          desc: '',
          status: 'draft',
          applyModules: [],
          nodes: [
            { id: 'n1', type: 'start', name: '提交申请', roleKey: 'submitter' },
            { id: 'n2', type: 'approval', approveMode: 'serial', name: '业务审批',
              roleKey: 'biz_manager', approver: 'u_biz_01',
              remind: { enabled: true, afterHours: 24 }, condition: [] },
            { id: 'n3', type: 'archive', name: '归档完成' }
          ]
        };
      } else {
        const f = AE.getFlow(flowId);
        if (!f) {
          alert('流程不存在或已被删除，将新建流程');
          location.href = './approval-flow-editor.html?flowId=new';
          return;
        }
        // v1.6.0：AE.getFlow 已做节点归一化（旧 serial/parallel_all/branch → approval + approveMode）
        draft = JSON.parse(JSON.stringify(f));
        if (!draft.applyModules) draft.applyModules = [];
        if (!draft.nodes) draft.nodes = [];
      }

      bindBasicInfo();
      renderModules();
      renderCanvas();
    })();

    function bindBasicInfo() {
      document.getElementById('edFlowName').value = draft.name || '';
      document.getElementById('edFlowDesc').value = draft.desc || '';
      const radio = document.querySelector(`input[name="flowStatus"][value="${draft.status || 'draft'}"]`);
      if (radio) radio.checked = true;
      updateTopTitle();
    }

    function updateTopTitle() {
      const nm = document.getElementById('edFlowName').value || '未命名流程';
      document.getElementById('topFlowName').textContent = nm;
      const st = draft.status || 'draft';
      const sm = STATUS_META[st] || STATUS_META.draft;
      const tag = document.getElementById('topFlowStatus');
      tag.className = 'tag ' + sm.cls;
      tag.textContent = sm.label;
    }

    function markDirty() {
      document.getElementById('dirtyFlag').classList.add('show');
    }

    function onEdit() {
      draft.name = document.getElementById('edFlowName').value;
      draft.desc = document.getElementById('edFlowDesc').value;
      draft.status = (document.querySelector('input[name="flowStatus"]:checked') || {}).value || 'draft';
      updateTopTitle();
      markDirty();
    }

    function goBack() {
      if (document.getElementById('dirtyFlag').classList.contains('show')) {
        if (!confirm('有未保存的修改，确定返回列表？')) return;
      }
      location.href = './approval-flow-list.html';
    }

    // ================================================================
    // 步骤切换
    // ================================================================
    function gotoStep(n) {
      if (n === 2) {
        onEdit();                       // 先把基础信息同步进 draft
        if (!validateBasic()) return;
      }
      closePicker();
      step = n;
      document.querySelector('.page-body').classList.toggle('is-canvas', n === 2);
      document.getElementById('pane1').classList.toggle('active', n === 1);
      document.getElementById('pane2').classList.toggle('active', n === 2);
      const b1 = document.getElementById('step1Btn');
      const b2 = document.getElementById('step2Btn');
      b1.classList.toggle('active', n === 1);
      b1.classList.toggle('done', n === 2);
      b2.classList.toggle('active', n === 2);
      b2.classList.remove('done');
      if (n === 2) renderCanvas();
    }

    function validateBasic() {
      if (!(document.getElementById('edFlowName').value || '').trim()) {
        alert('请填写流程名称');
        gotoStepForce(1);
        return false;
      }
      if (!(draft.applyModules || []).length) {
        alert('请至少选择一个应用模块');
        gotoStepForce(1);
        return false;
      }
      return true;
    }

    function gotoStepForce(n) {
      step = n;
      document.querySelector('.page-body').classList.toggle('is-canvas', n === 2);
      document.getElementById('pane1').classList.toggle('active', n === 1);
      document.getElementById('pane2').classList.toggle('active', n === 2);
      document.getElementById('step1Btn').classList.toggle('active', n === 1);
      document.getElementById('step2Btn').classList.toggle('active', n === 2);
    }

    // ================================================================
    // 画布渲染
    // ================================================================
    /** v1.6.0：业务节点只有「审批节点」一种，串行/会签是节点上的审批方式 */
    function nodeTypeLabel(n) {
      if (n.type === 'start') return '发起';
      if (n.type === 'archive') return '归档';
      return '审批节点';
    }
    function nodeTypeClass(n) {
      if (n.type === 'start' || n.type === 'archive') return 't-system';
      return n.approveMode === 'parallel_all' ? 't-parallel' : 't-serial';
    }

    /** 节点的触发条件文案（无条件返回空串） */
    function nodeCondText(n) {
      const rs = n.condition || [];
      if (!rs.length) return '';
      return rs.map(r => (AE.FIELD_LABELS[r.field] || r.field) + ' ' +
                         (AE.OP_LABELS[r.operator] || r.operator) + ' ' + r.value).join(' 或 ');
    }

    /** 审批通知人员姓名文案 */
    function notifyNamesText(n) {
      return (n.notify || []).map(id => {
        const p = AE.getPerson(id);
        return p ? p.name : id;
      }).join('、');
    }

    function isSystemNode(n) {
      return n.type === 'start' || n.type === 'archive';
    }

    function renderCanvas() {
      const box = document.getElementById('canvas');
      document.getElementById('nodeCountHint').textContent =
        '共 ' + draft.nodes.length + ' 个节点';

      const cards = draft.nodes.map((n, i) => {
        const color = AE.nodeColorOf(n);
        const cond = nodeCondText(n);
        const disabled = isSystemNode(n);
        const mode = n.approveMode === 'parallel_all' ? '并行会签' : '串行审批';

        let bodyLine;
        if (n.type === 'start') {
          bodyLine = `<div class="cv-line"><span class="ico">👤</span><span class="txt">发起人提交，系统自动记录</span></div>`;
        } else if (n.type === 'archive') {
          bodyLine = `<div class="cv-line"><span class="ico">✔</span><span class="txt">系统自动归档</span></div>`;
        } else {
          const people = AE.nodeApprovers(n);
          const peopleText = people.length
            ? people.map(p => p.name + ' ' + p.phone).join('、')
            : '未设置审批人员';
          bodyLine = `<div class="cv-line"><span class="ico">👤</span><span class="txt" title="${AE.esc(peopleText)}">${AE.esc(peopleText)}</span></div>`;
        }

        return `
        <div class="cv-node ${selNodeIdx === i ? 'active' : ''} ${cond ? 'has-cond' : ''}"
             style="--node-color:${color}" onclick="openProps(${i})">
          <div class="cv-node-head">
            <div class="cv-node-no">${AE.CIRCLED[i] || (i + 1)}</div>
            <div class="cv-node-title" title="${AE.esc(n.name)}">${AE.esc(n.name)}</div>
            <div class="cv-node-ops">
              <button class="cv-op" title="上移" onclick="event.stopPropagation();moveNode(${i},-1)"
                ${disabled ? 'disabled style="opacity:.25;cursor:not-allowed;"' : ''}>↑</button>
              <button class="cv-op" title="下移" onclick="event.stopPropagation();moveNode(${i},1)"
                ${disabled ? 'disabled style="opacity:.25;cursor:not-allowed;"' : ''}>↓</button>
              <button class="cv-op danger" title="删除" onclick="event.stopPropagation();delNode(${i})"
                ${disabled ? 'disabled style="opacity:.25;cursor:not-allowed;"' : ''}>×</button>
            </div>
          </div>
          <div class="cv-node-body">
            <span class="cv-node-type ${nodeTypeClass(n)}">${nodeTypeLabel(n)}</span>
            ${n.type === 'approval'
              ? `<span class="cv-node-type ${nodeTypeClass(n)}">${mode}</span>` : ''}
            ${cond ? `<span class="cv-node-cond" title="${AE.esc(cond)}">有条件：${AE.esc(cond)}</span>` : ''}
            ${bodyLine}
            ${n.remind && n.remind.enabled ? `
              <div class="cv-line"><span class="ico">⏰</span><span class="txt">未处理满 ${n.remind.afterHours}h 提醒</span></div>` : ''}
            ${(n.notify || []).length ? `
              <div class="cv-line"><span class="ico">🔔</span><span class="txt" title="${AE.esc(notifyNamesText(n))}">通过后通知 ${(n.notify || []).length} 人：${AE.esc(notifyNamesText(n))}${AE.esc(AE.notifyChannelsText(n.notifyChannels))}</span></div>` : ''}
          </div>
        </div>`;
      });

      const withConn = [];
      cards.forEach((c, i) => {
        withConn.push(c);
        if (i < cards.length - 1) {
          const pos = i + 1;   // 插入位置 = 第 i 与 i+1 之间
          withConn.push(`
            <div class="cv-conn">
              <div class="cv-conn-line"></div>
              <button class="cv-conn-add" title="插入审批节点" onclick="event.stopPropagation();togglePicker(${pos}, this)">+</button>
              <div class="cv-picker ${openPickerPos === pos ? 'open' : ''}" data-picker="${pos}" onclick="event.stopPropagation()">
                <div class="cv-picker-title">插入节点</div>
                <div class="cv-picker-item" onclick="insertNodeAt(${pos})">
                  <div class="cv-picker-ico s">审</div>
                  <div>
                    <div class="cv-picker-name">审批节点</div>
                    <div class="cv-picker-desc">插入后在右侧抽屉里选串行审批或并行会签，并可加触发条件</div>
                  </div>
                </div>
              </div>
            </div>`);
        }
      });

      box.innerHTML = withConn.join('');
    }

    function togglePicker(pos, btn) {
      const next = (openPickerPos === pos) ? -1 : pos;
      document.querySelectorAll('.cv-picker').forEach(p => p.classList.remove('open'));
      openPickerPos = next;
      if (next >= 0) {
        const el = document.querySelector(`.cv-picker[data-picker="${next}"]`);
        if (el) el.classList.add('open');
      }
    }

    function closePicker() {
      document.querySelectorAll('.cv-picker').forEach(p => p.classList.remove('open'));
      openPickerPos = -1;
    }

    // 点击画布空白处收起选项卡片
    document.addEventListener('click', (e) => {
      if (openPickerPos >= 0 && !e.target.closest('.cv-conn')) closePicker();
      if (!e.target.closest('.wz-dd')) document.querySelectorAll('.wz-dd.open').forEach(x => x.classList.remove('open'));
    });

    // ================================================================
    // 节点增删改序
    // ================================================================
    /** v1.6.0：只产出一种业务节点 —— 审批节点（串行/会签在抽屉里选） */
    function newNode() {
      return { id: 'n_' + Date.now(), type: 'approval', approveMode: 'serial',
               name: '新审批节点', roleKey: 'biz_manager', approver: 'u_biz_01',
                 remind: { enabled: true, afterHours: 24 }, condition: [] };
    }

    function insertNodeAt(pos) {
      const node = newNode();
      draft.nodes.splice(pos, 0, node);
      selNodeIdx = pos;
      closePicker();
      markDirty();
      renderCanvas();
      openProps(pos);     // 插入后直接打开属性抽屉
    }

    function moveNode(i, dir) {
      const j = i + dir;
      if (j < 0 || j >= draft.nodes.length) return;
      if (isSystemNode(draft.nodes[i]) || isSystemNode(draft.nodes[j])) return;
      const t = draft.nodes[i];
      draft.nodes[i] = draft.nodes[j];
      draft.nodes[j] = t;
      if (selNodeIdx === i) selNodeIdx = j;
      else if (selNodeIdx === j) selNodeIdx = i;
      markDirty();
      renderCanvas();
      if (selNodeIdx >= 0) refreshPropsBody();
    }

    function delNode(i) {
      const n = draft.nodes[i];
      if (n.type === 'start') { alert('「提交申请」发起节点不可删除'); return; }
      if (n.type === 'archive') { alert('「归档完成」节点不可删除'); return; }
      if (!confirm(`确定删除节点「${n.name}」？`)) return;
      draft.nodes.splice(i, 1);
      if (selNodeIdx === i) closePropsDrawer();
      selNodeIdx = -1;
      markDirty();
      renderCanvas();
    }

    // ================================================================
    // 节点属性抽屉
    // ================================================================
    function openProps(i) {
      selNodeIdx = i;
      renderCanvas();
      refreshPropsBody();
      document.getElementById('propsOverlay').classList.add('open');
      document.getElementById('propsDrawer').classList.add('open');
    }

    function closePropsDrawer() {
      document.getElementById('propsOverlay').classList.remove('open');
      document.getElementById('propsDrawer').classList.remove('open');
      selNodeIdx = -1;
      renderCanvas();
    }

    function peopleOptions(selectedId) {
      return ALL_PEOPLE.map(p =>
        `<option value="${p.id}" ${p.id === selectedId ? 'selected' : ''}>${AE.esc(p.name)}  ${AE.esc(p.phone)}</option>`
      ).join('');
    }

    function refreshPropsBody() {
      const n = draft.nodes[selNodeIdx];
      if (!n) return;
      const idx = selNodeIdx;
      document.getElementById('propsTitle').textContent =
        n.type === 'approval' ? '审批节点属性' : '节点属性';
      document.getElementById('propsSubtitle').textContent =
        `${AE.CIRCLED[idx] || (idx + 1)} · ${n.name} · ${nodeTypeLabel(n)}`;

      let html = '';

      // ---------- 系统节点（发起 / 归档）：只读 ----------
      if (isSystemNode(n)) {
        html += `<div class="cv-field-title">${AE.esc(n.name)}</div>`;
        html += `<div class="ap-meta-grid" style="grid-template-columns:96px 1fr;">
          <div class="k">节点类型</div><div class="v">${nodeTypeLabel(n)}</div>
          <div class="k">可编辑</div><div class="v">否（系统节点）</div>
        </div>`;
        html += `<div class="cv-field-help">「提交申请」与「归档完成」由系统自动执行，属性不可编辑。</div>`;
        document.getElementById('propsBody').innerHTML = html;
        return;
      }

      // ---------- 1. 节点名称 ----------
      html += `<div class="cv-field">
        <label>节点名称</label>
        <input type="text" class="input" value="${AE.esc(n.name)}" maxlength="20"
               oninput="setNodeProp('name', this.value)">
      </div>`;

      // ---------- 2. 审批方式（单选，互斥） ----------
      const isPar = n.approveMode === 'parallel_all';
      html += `<div class="cv-field">
        <label>审批方式<span class="cv-field-help" style="display:inline;margin-left:6px;">单选，一个节点只能是其中一种</span></label>
        <div class="cv-mode">
          <label class="cv-mode-opt ${!isPar ? 'active' : ''}">
            <input type="radio" name="approveMode" value="serial" ${!isPar ? 'checked' : ''}
                   onchange="setApproveMode('serial')">
            <div>
              <div class="cv-mode-name">串行审批</div>
              <div class="cv-mode-desc">1 名审批人，通过后才轮到下一个节点</div>
            </div>
          </label>
          <label class="cv-mode-opt ${isPar ? 'active' : ''}">
            <input type="radio" name="approveMode" value="parallel_all" ${isPar ? 'checked' : ''}
                   onchange="setApproveMode('parallel_all')">
            <div>
              <div class="cv-mode-name">并行会签</div>
              <div class="cv-mode-desc">多人同时收到，全部通过才算过</div>
            </div>
          </label>
        </div>
      </div>`;

      // ---------- 3. 审批人员（随审批方式切换） ----------
      if (isPar) {
        html += `<div class="cv-field">
          <label>会签人员<span class="cv-field-help" style="display:inline;margin-left:6px;">至少 1 人，全部通过才算通过</span></label>
          <div id="signBox"></div>
          <button class="btn btn-default btn-sm" style="margin-top:6px;" onclick="addSign()">+ 添加会签人</button>
          <div class="cv-field-help">所有会签人同时收到待办，任一人驳回则整个流程驳回。</div>
        </div>`;
      } else {
        html += `<div class="cv-field">
          <label>审批人员</label>
          <select class="select" onchange="setNodeProp('approver', this.value)">${peopleOptions(n.approver)}</select>
          <div class="cv-field-help">从平台人员目录中选择实际审批人，展示完整姓名 + 脱敏手机号</div>
        </div>`;
      }

      // ---------- 4. 触发条件（可选 · v1.8.0：固定金额条件、最多 1 条） ----------
      // 并行会签不设触发条件（整段不渲染）
      if (!isPar) {
        const condOn = (n.condition || []).length > 0;
        const rule = condOn ? n.condition[0] : null;
        html += `<div class="cv-field">
          <label>触发条件<span class="cv-field-help" style="display:inline;margin-left:6px;">可选，满足该条件才执行本节点</span></label>
          <div class="cv-remind-box">
            <div class="cv-remind-row">
              <input type="checkbox" id="condEnabled" ${condOn ? 'checked' : ''}
                     style="margin:0;" onchange="setCondEnabled(this.checked)">
              <span style="font-size:12px;color:var(--text-secondary);">按金额条件触发（不勾选则每单都执行）</span>
            </div>
          </div>
          <div id="condWrap" style="${condOn ? '' : 'display:none;'}">
            <div class="cv-cond-row" style="margin-top:8px;">
              <span class="cv-cond-field">单据金额</span>
              <select class="select" style="width:96px;" onchange="setCondRule('operator', this.value)">
                ${Object.keys(AE.OP_LABELS).map(k =>
                  `<option value="${k}" ${rule && rule.operator === k ? 'selected' : ''}>${AE.esc(AE.OP_LABELS[k])}</option>`).join('')}
              </select>
              <input type="number" class="input" style="flex:1;" min="0"
                     value="${rule ? rule.value : ''}"
                     oninput="setCondRule('value', Number(this.value))">
              <button class="cv-op danger" title="清除条件" onclick="setCondEnabled(false)">×</button>
            </div>
            <div class="cv-field-help">仅支持 1 个单据金额条件；不满足时本节点自动跳过，流程继续往下走。</div>
          </div>
        </div>`;
      }

      // ---------- 5. 提醒规则 ----------
      const r = n.remind || { enabled: false, afterHours: 24 };
      html += `<div class="cv-field">
        <label>提醒规则</label>
        <div class="cv-remind-box">
          <div class="cv-remind-row">
            <input type="checkbox" id="remindEnabled" ${r.enabled ? 'checked' : ''}
                   style="margin:0;" onchange="setRemind('enabled', this.checked)">
            <span style="font-size:12px;color:var(--text-secondary);">开启审批提醒</span>
          </div>
          <div class="cv-remind-row" style="margin-top:10px;">
            <input type="number" class="input" min="1" max="720" value="${r.afterHours || 24}"
                   ${r.enabled ? '' : 'disabled'} oninput="setRemind('afterHours', Number(this.value))">
            <span class="unit">小时未处理后，向当前审批人发送提醒</span>
          </div>
        </div>
        <div class="cv-field-help">提醒将推送至该节点审批人的站内消息与短信</div>
      </div>`;

      // ---------- 6. 审批通知（v1.8.0 新增，审批通过后通知，可多选） ----------
      const notify = n.notify || [];
      html += `<div class="cv-field">
        <label>审批通知<span class="cv-field-help" style="display:inline;margin-left:6px;">可多选</span></label>
        <div class="wz-dd" id="dd-notify" onclick="event.stopPropagation()">
          <button type="button" class="wz-dd-trigger" onclick="toggleNotifyDD(event)">
            <span class="wz-dd-text ${notify.length ? '' : 'is-empty'}">${notify.length
              ? '已选 ' + notify.length + ' 人：' + notify.map(id => {
                  const p = AE.getPerson(id); return p ? p.name : id;
                }).join('、')
              : '请选择接收通知的人员'}</span>
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="wz-dd-panel" style="min-width: 100%;">
            <div class="wz-dd-bar">
              <span onclick="setNotifyAll(true)">全选</span>
              <span onclick="setNotifyAll(false)">清空</span>
            </div>
            <div class="notify-groups">
              ${notifyGroupHtml(notify)}
            </div>
          </div>
        </div>
        <div class="cv-field-help">本节点审批通过后，向所选人员推送通知；不选人员则不通知。</div>
      </div>`;

      // ---------- 6.1 通知类型（v1.10.0，仅作用于「审批通知」；站内信锁定不可取消） ----------
      const chans = (n.notifyChannels && n.notifyChannels.length) ? n.notifyChannels : ['inbox'];
      const hasSms = chans.indexOf('sms') >= 0;
      const notifyOff = !notify.length;   // 没选接收人时渠道无意义，置灰
      html += `<div class="cv-field">
        <label>通知类型</label>
        <div class="cv-chan-box ${notifyOff ? 'is-disabled' : ''}">
          <label class="cv-chan-opt">
            <input type="checkbox" ${chans.indexOf('inbox') >= 0 ? 'checked' : ''} disabled
                   style="margin:0;cursor:not-allowed;">
            <span>站内信</span>
            <span class="cv-chan-lock" title="站内信强制开启，不可取消">必选</span>
          </label>
          <label class="cv-chan-opt">
            <input type="checkbox" ${hasSms ? 'checked' : ''} ${notifyOff ? 'disabled' : ''}
                   style="margin:0;" onchange="setNotifyChannel('sms', this.checked)">
            <span>短信提醒</span>
          </label>
        </div>
        <div class="cv-field-help">${notifyOff
          ? '请先在上方选择接收通知的人员，再配置推送渠道。'
          : '站内信为必选渠道，保证审批通知有留痕；短信提醒按需开启。'}</div>
      </div>`;

      // ---------- 7. 节点说明 ----------
      html += `<div class="cv-field">
        <label>节点说明</label>
        <textarea class="textarea" rows="2" style="width:100%;" placeholder="给审批人的提示语"
                  oninput="setNodeProp('desc', this.value)">${AE.esc(n.desc || '')}</textarea>
      </div>`;

      document.getElementById('propsBody').innerHTML = html;
      if (isPar) renderSign(n);
    }

    /** 切换审批方式：串行 ⇄ 并行会签，人员字段随之切换 */
    function setApproveMode(mode) {
      const n = draft.nodes[selNodeIdx];
      if (!n || n.type !== 'approval') return;
      n.approveMode = mode;
      // 并行会签不支持触发条件，切换时清掉（v1.8.0）
      if (mode === 'parallel_all') {
        n.condition = [];
        if (!n.approvers || !n.approvers.length) {
          const seed = [n.approver].filter(Boolean);
          const free = ALL_PEOPLE.find(p => seed.indexOf(p.id) < 0);
          if (free) seed.push(free.id);
          n.approvers = seed.length ? seed : [ALL_PEOPLE[0].id];
        }
      } else {
        if (!n.approver && n.approvers && n.approvers.length) n.approver = n.approvers[0];
      }
      markDirty();
      renderCanvas();
      refreshPropsBody();
    }

    /** 触发条件总开关 */
    function setCondEnabled(on) {
      const n = draft.nodes[selNodeIdx];
      if (!n) return;
      n.condition = on ? (n.condition && n.condition.length ? n.condition : [{ field: 'amount', operator: 'gt', value: 1000000 }]) : [];
      markDirty();
      renderCanvas();
      refreshPropsBody();
    }

    function setNodeProp(key, val) {
      const n = draft.nodes[selNodeIdx];
      if (!n) return;
      n[key] = val;
      markDirty();
      renderCanvas();
      if (key === 'name') {
        document.getElementById('propsSubtitle').textContent =
          `${AE.CIRCLED[selNodeIdx] || (selNodeIdx + 1)} · ${val} · ${nodeTypeLabel(n)}`;
      }
    }

    function setRemind(key, val) {
      const n = draft.nodes[selNodeIdx];
      if (!n) return;
      if (!n.remind) n.remind = { enabled: true, afterHours: 24 };
      n.remind[key] = val;
      markDirty();
      renderCanvas();
      if (key === 'enabled') refreshPropsBody();
    }

    // ---- 会签人员 ----
    function renderSign(n) {
      const box = document.getElementById('signBox');
      if (!box) return;
      if (!n.approvers) n.approvers = [];
      box.innerHTML = n.approvers.map((pid, i) => `
        <div class="cv-sign-row">
          <select class="select" onchange="setSign(${i}, this.value)">${peopleOptions(pid)}</select>
          <button class="cv-op danger" title="移除" onclick="removeSign(${i})"
            ${n.approvers.length <= 1 ? 'disabled style="opacity:.3;cursor:not-allowed;"' : ''}>×</button>
        </div>`).join('');
    }

    function setSign(i, pid) {
      const n = draft.nodes[selNodeIdx];
      if (!n) return;
      const dupAt = n.approvers.indexOf(pid);
      if (dupAt >= 0 && dupAt !== i) { alert('该人员已在会签名单中'); renderSign(n); return; }
      n.approvers[i] = pid;
      markDirty();
      renderCanvas();
    }

    function addSign() {
      const n = draft.nodes[selNodeIdx];
      if (!n) return;
      if (!n.approvers) n.approvers = [];
      const free = ALL_PEOPLE.find(p => !n.approvers.includes(p.id));
      if (!free) { alert('平台人员已全部加入会签名单'); return; }
      n.approvers.push(free.id);
      markDirty();
      renderSign(n);
      renderCanvas();
    }

    function removeSign(i) {
      const n = draft.nodes[selNodeIdx];
      if (!n || n.approvers.length <= 1) { alert('并行会签至少保留 1 人'); return; }
      n.approvers.splice(i, 1);
      markDirty();
      renderSign(n);
      renderCanvas();
    }

    // ---- 触发条件（v1.8.0：固定金额、最多 1 条） ----
    function setCondEnabled(on) {
      const n = draft.nodes[selNodeIdx];
      if (!n) return;
      n.condition = on ? [{ field: 'amount', operator: 'gt', value: 1000000 }] : [];
      markDirty();
      renderCanvas();
      refreshPropsBody();
    }

    function setCondRule(key, val) {
      const n = draft.nodes[selNodeIdx];
      if (!n || !n.condition || !n.condition.length) return;
      n.condition[0][key] = val;      // 恒为第 0 条
      n.condition[0].field = 'amount'; // 字段固定单据金额
      markDirty();
      renderCanvas();
    }

    // ---- 审批通知（v1.8.0 新增） ----
    function notifyGroupHtml(selected) {
      const groups = {};
      ALL_PEOPLE.forEach(p => { (groups[p.dept] = groups[p.dept] || []).push(p); });
      return Object.keys(groups).map(dept => `
        <div class="notify-grp">
          <div class="notify-grp-title">${AE.esc(dept)}</div>
          ${groups[dept].map(p => `
            <label class="wz-dd-opt">
              <input type="checkbox" ${selected.indexOf(p.id) >= 0 ? 'checked' : ''}
                     onchange="toggleNotify('${p.id}', this.checked)">
              <span>${AE.esc(p.name)}</span>
              <span class="ph">${AE.esc(p.phone)}</span>
            </label>`).join('')}
        </div>`).join('');
    }

    function toggleNotifyDD(ev) {
      if (ev) ev.stopPropagation();
      const dd = document.getElementById('dd-notify');
      if (!dd) return;
      const wasOpen = dd.classList.contains('open');
      document.querySelectorAll('.wz-dd.open').forEach(e => e.classList.remove('open', 'up'));
      if (wasOpen) return;

      // 先展开再量高度（display:none 时 scrollHeight 为 0，量不准）
      dd.classList.add('open');
      // 下方空间不够就改为向上弹出，避免被 .ap-drawer-body 的 overflow 裁掉
      const panel = dd.querySelector('.wz-dd-panel');
      const trig = dd.querySelector('.wz-dd-trigger');
      const host = document.querySelector('.ap-drawer-body');
      if (panel && trig && host) {
        const need = panel.scrollHeight + 12;
        const below = host.getBoundingClientRect().bottom - trig.getBoundingClientRect().bottom;
        if (below < need) dd.classList.add('up');
      }
    }

    function toggleNotify(pid, on) {
      const n = draft.nodes[selNodeIdx];
      if (!n) return;
      if (!n.notify) n.notify = [];
      const i = n.notify.indexOf(pid);
      if (on && i < 0) n.notify.push(pid);
      if (!on && i >= 0) n.notify.splice(i, 1);
      markDirty();
      renderCanvas();
      refreshPropsBody();
      const dd = document.getElementById('dd-notify');
      if (dd) dd.classList.add('open');   // 保持展开，方便连续多选
    }

    function setNotifyAll(on) {
      const n = draft.nodes[selNodeIdx];
      if (!n) return;
      n.notify = on ? ALL_PEOPLE.map(p => p.id) : [];
      markDirty();
      renderCanvas();
      refreshPropsBody();
      const dd = document.getElementById('dd-notify');
      if (dd) dd.classList.add('open');
    }

    /** 勾选/取消短信提醒（v1.10.0）。站内信锁定，不走这里 */
    function setNotifyChannel(ch, on) {
      const n = draft.nodes[selNodeIdx];
      if (!n) return;
      if (!Array.isArray(n.notifyChannels)) n.notifyChannels = [];
      const i = n.notifyChannels.indexOf(ch);
      if (on && i < 0) n.notifyChannels.push(ch);
      if (!on && i >= 0) n.notifyChannels.splice(i, 1);
      // 站内信恒在，前端绕过也会被引擎 normNode 兜住
      if (n.notifyChannels.indexOf('inbox') < 0) n.notifyChannels.unshift('inbox');
      markDirty();
      renderCanvas();
    }

    // 应用模块（v1.5.0：子项已下线，8 个模块全部平级 checkbox）
    function renderModules() {
      const box = document.getElementById('modPicker');
      const sel = AE.normModules(draft.applyModules);
      box.innerHTML = AE.APPLY_MODULES.map(m => `
        <div class="wz-mod">
          <div class="wz-mod-main">
            <input type="checkbox" id="chk-${m.key}" ${sel.indexOf(m.key) >= 0 ? 'checked' : ''}
                   onchange="toggleModule('${m.key}',this.checked)">
            <label for="chk-${m.key}">${AE.esc(m.label)}</label>
          </div>
        </div>`).join('');
    }

    function toggleModule(key, on) {
      const sel = AE.normModules(draft.applyModules);
      if (on) {
        if (sel.indexOf(key) < 0) sel.push(key);
      } else {
        const i = sel.indexOf(key);
        if (i >= 0) sel.splice(i, 1);
      }
      draft.applyModules = sel;
      markDirty();
      renderModules();
    }

    // ================================================================
    // 流程图预览（弹窗 · 审批详情视觉）
    // ================================================================
    // 预览金额基准：仅用于演示「触发条件求值」，不作为真实业务输入
    const PREVIEW_AMOUNT = 500000;

    function openPreview() {
      onEdit();
      document.getElementById('pvTitle').textContent = draft.name || '未命名流程';
      const sm = STATUS_META[draft.status] || STATUS_META.draft;
      document.getElementById('pvSubtitle').innerHTML =
        `${AE.esc(AE.applyModulesText(draft.applyModules || []))} · <span class="tag ${sm.cls}">${sm.label}</span>`;
      renderPreview();
      document.getElementById('previewMask').classList.add('open');
    }

    function closePreview() {
      document.getElementById('previewMask').classList.remove('open');
    }

    function renderPreview() {
      const amt = PREVIEW_AMOUNT;
      const nodes = AE.resolveFlow(draft, { amount: amt });
      // 带触发条件的审批节点（含被跳过的）
      const condNodes = nodes.filter(n => n.branchRules && n.branchRules.length);
      const skipped = condNodes.filter(n => n.skipped);

      document.getElementById('pvBody').innerHTML = `
        <div class="pv-summary">
          <div class="k">流程名称</div><div class="v">${AE.esc(draft.name || '未命名流程')}</div>
          <div class="k">节点总数</div><div class="v">${nodes.length} 个</div>
          <div class="k">条件评估金额</div>
          <div class="v">¥ ${AE.fmtAmount(amt)}<span class="hint">演示基准值</span></div>
          <div class="k">条件结果</div>
          <div class="v">${condNodes.length
            ? (skipped.length
                ? `${skipped.length} 个节点未满足条件，已跳过`
                : `${condNodes.length} 个节点条件全部命中，正常执行`)
            : '该流程所有节点均无条件触发'}</div>
        </div>

        <div class="ap-section-title">审批节点流转</div>
        <div id="pvTimeline"></div>

        ${condNodes.length ? `
        <div class="ap-section-title">触发条件求值明细</div>
        <div style="overflow-x:auto;">
        <table class="cp-table is-compact" style="width:100%;">
          <thead><tr><th>节点</th><th>条件</th><th>操作符</th><th>阈值</th><th>实际值</th><th>结果</th></tr></thead>
          <tbody>${condNodes.map(n => (n.branchRules || []).map((r, ri) => `
            <tr>
              <td>${ri === 0 ? AE.esc(n.name) : ''}</td>
              <td>${AE.esc(r.fieldLabel || '—')}</td>
              <td>${AE.esc(r.opLabel || '—')}</td>
              <td>${AE.fmtAmount(r.value)}</td>
              <td>${AE.fmtAmount(r.actual)}</td>
              <td>${n.skipped ? '<span class="tag tag-gray">未命中 → 跳过节点</span>'
                              : (r.matched ? '<span class="tag tag-green">命中 → 执行节点</span>'
                                           : '<span class="tag tag-gray">未命中</span>')}</td>
            </tr>`).join('')).join('')}</tbody>
        </table></div>` : ''}
      `;

      // 时间线：复用引擎渲染，与业务单据「审批详情」完全一致
      document.getElementById('pvTimeline').innerHTML =
        AE.renderTimeline({ flow: draft, formData: { amount: amt }, currentIdx: -1 });
    }

    // ================================================================
    // 保存
    // ================================================================
    function saveDraft() {
      onEdit();
      if (!validateBasic()) return;

      if (!draft.nodes.some(n => n.type === 'start')) { alert('必须保留「提交申请」发起节点'); gotoStepForce(2); return; }
      if (!draft.nodes.some(n => n.type === 'archive')) { alert('必须保留「归档完成」节点'); gotoStepForce(2); return; }
      for (const n of draft.nodes) {
        if (n.type !== 'approval') continue;
        if (n.approveMode === 'parallel_all' && (!n.approvers || !n.approvers.length)) {
          alert(`审批节点「${n.name}」选择了并行会签，至少需要 1 名会签人`); gotoStepForce(2); openProps(draft.nodes.indexOf(n)); return;
        }
        if (n.approveMode === 'serial' && !n.approver) {
          alert(`审批节点「${n.name}」请选择审批人员`); gotoStepForce(2); openProps(draft.nodes.indexOf(n)); return;
        }
      }

      AE.saveFlow(draft);
      document.getElementById('dirtyFlag').classList.remove('show');
      toast('流程已保存');
      setTimeout(() => { location.href = './approval-flow-list.html'; }, 900);
    }

    function toast(msg) {
      const t = document.createElement('div');
      t.textContent = msg;
      t.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);' +
        'background:var(--color-primary);color:#fff;padding:8px 18px;border-radius:6px;' +
        'font-size:13px;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.2);';
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 1800);
    }
  </script>
</body>
</html>
