        return '<a href="javascript:void(0)" data-action="edit">修改</a>' +
               '<a href="javascript:void(0)" data-action="void" class="danger">作废</a>' +
               '<a href="javascript:void(0)" data-action="view">详情</a>';
      } else if (row.status === '驳回') {
        return '<a href="javascript:void(0)" data-action="edit">修改</a>' +
               '<a href="javascript:void(0)" data-action="void" class="danger">作废</a>' +
               '<a href="javascript:void(0)" data-action="view">详情</a>';
      } else if (row.status === '待上传已生效单据') {
        return '<a href="javascript:void(0)" data-action="view">详情</a>' +
               '<a href="javascript:void(0)" data-action="upload">上传附件</a>' +
               '<a href="javascript:void(0)" data-action="void" class="danger">作废</a>';
      } else if (row.status === '审批中') {
        return '<a href="javascript:void(0)" data-action="view">详情</a>' +
               '<a href="javascript:void(0)" data-action="withdraw" class="danger">撤回</a>';
      } else {
        // 已作废 / 已生效(无有效编号) = 详情
        return '<a href="javascript:void(0)" data-action="view">详情</a>';
      }
    }

    var currentTabKey = 'all';

    function getFilteredMock(tabKey) {
      if (tabKey === 'all') return BOND_MOCK;
      // tabKey 映射到 status 文字
      var keyToStatus = {
        auditing: '审批中',
        uploading: '待上传已生效单据',
        effective: '已生效',
        rejected: '驳回',
        voided: '已作废',
      };
      var targetStatus = keyToStatus[tabKey];
      if (!targetStatus) return BOND_MOCK;
      return BOND_MOCK.filter(function (r) { return r.status === targetStatus; });
    }

    function renderBondTable() {
      var data = getFilteredMock(currentTabKey);
      var tbody = document.getElementById('bondTbody');
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="10"><div class="empty-state"><div class="empty-state-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 10h8M8 14h5"/></svg></div>暂无数据</div></td></tr>';
        return;
      }
      tbody.innerHTML = data.map(function (r) {
        var statusCls = BL_STATUS_CLASS[r.status] || '';
        return '<tr>' +
          '<td class="col-num">' + r.contract + '</td>' +
          '<td>' + r.seller + '</td>' +
          '<td>' + r.buyer + '</td>' +
          '<td style="text-align: right;" class="col-num">¥ ' + r.amount + '</td>' +
          '<td>' + r.deadline + '</td>' +
          '<td>' + r.issueDate + '</td>' +
          '<td class="col-num">' + r.blNo + '</td>' +
          '<td>' + r.uploadTime + '</td>' +
          '<td><span class="bl-status ' + statusCls + '">' + r.status + '</span></td>' +
          '<td class="col-action" style="text-align: right;">' +
            '<div class="col-action-row">' + renderActions(r) + '</div>' +
          '</td>' +
        '</tr>';
      }).join('');
    }

        uploading: BOND_MOCK.filter(function (r) { return r.status === '待上传已生效单据'; }).length,
        effective: BOND_MOCK.filter(function (r) { return r.status === '已生效'; }).length,
        rejected: BOND_MOCK.filter(function (r) { return r.status === '驳回'; }).length,
        voided: BOND_MOCK.filter(function (r) { return r.status === '已作废'; }).length,
      };
      document.querySelectorAll('.cp-tab').forEach(function (t) {
        var key = t.getAttribute('data-tab-key');
        if (key && counts[key] !== undefined) {
          var span = t.querySelector('.count');
          if (span) span.textContent = counts[key];
        }
      });
    }

    function switchTab(el, key) {
      document.querySelectorAll('.cp-tab').forEach(function (t) { t.classList.remove('active'); });
      el.classList.add('active');
      currentTabKey = key;
      renderBondTable();
    }
    document.addEventListener('DOMContentLoaded', function () {
      updateBondTabCounts();
      renderBondTable();
    });

    // 操作列点击事件委托（v1.7.99.80/83/84 模式：inline Utils fallback）
    // v1.7.99.212 hotfix: view action 真的跳转到 bond-letter-detail.html?blNo=XXX（之前只是 toast）
    document.body.addEventListener('click', function(e) {
      var target = e.target;
      if (target.tagName === 'A' && target.closest('.col-action')) {
        var action = target.getAttribute('data-action');
        if (!action) return;
        e.preventDefault();
        if (action === 'view') {
          // v1.7.99.212: view action 跳转到详情页（拿 tr 里第 2 个 .col-num = 追保函编号）
          var tr = target.closest('tr');
          var nums = tr ? tr.querySelectorAll('.col-num') : [];
          var blNo = nums.length >= 2 ? nums[1].textContent.trim() : '';
          window.location.href = './bond-letter-detail.html?blNo=' + encodeURIComponent(blNo);
          return;
        }
        var labels = { edit: '修改', void: '作废', upload: '上传附件' };
        if (action === 'void' && !window.confirm('确定要作废这条追保函吗？')) return;
        if (window.Utils && Utils.toast) {
          Utils.toast('【' + (labels[action] || action) + '】操作已触发（二期实现）', 'info');
        } else {
          console.log('[toast] info 【' + (labels[action] || action) + '】操作已触发（二期实现）');
        }
      }
    });

    // inline Utils fallback（v1.7.99.80 经验）
    window.Utils = window.Utils || {
      toast: function(msg, type) { try { console.log('[Utils.toast]', type || 'info', msg); } catch (e) {} }
    };
  </script>
  </div>
  <!-- /main-content -->
</body>
</html>
