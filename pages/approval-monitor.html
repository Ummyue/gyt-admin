<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>审批流程监控 - 豫港通 v1.1.0</title>
  <link rel="stylesheet" href="../assets/css/design-system.css">
  <link rel="stylesheet" href="../assets/css/list-page.css">
  <link rel="stylesheet" href="../assets/css/approval.css">
  <link rel="stylesheet" href="../assets/css/pin-annotation.css">
  <style>
    .page-body { padding: 20px 24px; }
    /* ===== KPI ===== */
    .ap-kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
    .ap-kpi {
      background: var(--bg-card); border: 1px solid var(--border-default);
      border-radius: 8px; padding: 14px 16px;
    }
    .ap-kpi-value { font-size: 26px; font-weight: 700; color: var(--text-primary); line-height: 1.2; }
    .ap-kpi-label { font-size: 12px; color: var(--text-tertiary); margin-top: 4px; }
    .ap-kpi.is-info  .ap-kpi-value { color: #2563EB; }
    .ap-kpi.is-ok    .ap-kpi-value { color: #059669; }
    .ap-kpi.is-warn  .ap-kpi-value { color: #D97706; }

    /* 详情抽屉样式已抽到 assets/css/approval.css（.ap-drawer* 平台统一右侧抽屉） */

    /* 抽屉内嵌表格：去掉宽表 min-width，用紧凑版 */
    .cp-table.is-compact { min-width: 0; }
    .cp-table.is-compact thead th,
    .cp-table.is-compact tbody td { padding: 8px 10px; font-size: 12px; white-space: normal; }

    /* 空状态 */
    .ap-empty { padding: 40px 16px; text-align: center; color: var(--text-tertiary); font-size: 13px; }

    /* 操作列 */
    .col-action-row {
      display: flex; align-items: center; justify-content: flex-end;
      gap: 8px; white-space: nowrap;
    }
    .col-action-row a { color: var(--color-primary); text-decoration: none; font-size: 12px; }
    .col-action-row a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-logo">
      <div style="width: 36px; height: 36px; background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 16px;">豫</div>
      <span>豫港通</span>
    </div>
    <div class="topbar-menu">
      <a class="topbar-menu-item" href="./workbench.html" data-menu-key="工作台">工作台</a>
      <a class="topbar-menu-item" href="./project-list.html" data-menu-key="准入管理">准入管理</a>
      <a class="topbar-menu-item active" href="./contract-purchase.html" data-menu-key="数字供应链">数字供应链</a>
      <a class="topbar-menu-item" href="./warehouse-inbound.html" data-menu-key="仓储管理">仓储管理</a>
      <a class="topbar-menu-item" href="./cockpit.html" data-menu-key="数据中心">数据中心</a>
      <a class="topbar-menu-item" href="./warning-list.html" data-menu-key="预警中心">预警中心</a>
      <a class="topbar-menu-item" href="./account-personal.html" data-menu-key="账户中心">账户中心</a>
      <button class="pin-trigger-btn" id="pinTriggerBtn" title="页面标记（4 位数字密码保护）"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>标记</button>
      <button class="topbar-changelog-btn" onclick="window.open('./changelog.html', '_blank')" title="查看高保真原型版本变更记录">📋 版本变更记录</button>
    </div>
    <div class="topbar-right">
      <div class="topbar-icon-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="badge"></span>
      </div>
      <div class="topbar-user">
        <div class="topbar-user-avatar">张</div>
        <div>
          <div class="topbar-user-name">张爽</div>
          <div class="topbar-user-org">港通供应链</div>
        </div>
      </div>
    </div>
  </div>

  <div style="display: flex;">
    <div class="sidemenu" id="leftSidemenu"></div>

    <div class="main-content" style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
      <div class="page-body" style="flex: 1; overflow-y: auto; background: var(--bg-page);">

        <!-- 面包屑 -->
        <div class="breadcrumb-inline">
          <a href="./contract-purchase.html">数字供应链</a>
          <span class="sep">/</span>
          <a href="./approval-flow-list.html">审批管理</a>
          <span class="sep">/</span>
          <span class="current">审批流程监控</span>
        </div>

        <!-- 标题 + 右侧按钮 -->
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;">
          <h1 class="page-h1" style="margin: 0;">审批流程监控</h1>
        </div>

        <!-- KPI -->
        <div class="ap-kpi-row">
          <div class="ap-kpi">
            <div class="ap-kpi-value" id="kpiTotal">0</div>
            <div class="ap-kpi-label">审批实例总数</div>
          </div>
          <div class="ap-kpi is-info">
            <div class="ap-kpi-value" id="kpiDoing">0</div>
            <div class="ap-kpi-label">审批中</div>
          </div>
          <div class="ap-kpi is-ok">
            <div class="ap-kpi-value" id="kpiDone">0</div>
            <div class="ap-kpi-label">已通过</div>
          </div>
          <div class="ap-kpi is-warn">
            <div class="ap-kpi-value" id="kpiRemind">0</div>
            <div class="ap-kpi-label">已触发审批提醒</div>
          </div>
        </div>

        <!-- ========== 审批实例 ========== -->
        <div class="cp-panel">

          <!-- 区块 1：筛选 -->
          <div class="cp-block">
            <div class="cp-filter-summary">
              <div class="cp-filter-summary-left">
                当前搜索：<span data-filter-chips class="filter-chips"></span><span class="filter-empty-hint">（无筛选条件）</span>
                <button type="button" class="clear-all-btn" style="display: none;" onclick="clearAllFilters(this)">清除全部</button>
              </div>
              <button class="btn btn-text btn-sm" onclick="exportInstances()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                数据导出
              </button>
            </div>
            <div class="cp-filter">
              <div class="cp-filter-item">
                <span class="cp-filter-label">单据编号</span>
                <input type="text" class="input" id="fltKw" placeholder="单据编号或发起人" oninput="renderTable()">
              </div>
              <div class="cp-filter-item">
                <span class="cp-filter-label">应用模块</span>
                <select class="select" id="fltModule" onchange="renderTable()">
                  <option value="">全部模块</option>
                </select>
              </div>
            </div>
          </div>

          <!-- 区块 2：状态 tab -->
          <div class="cp-block cp-block-tab">
            <div class="cp-tab-bar">
              <div class="cp-tab-bar-tabs" id="statusTabs"></div>
              <div class="cp-tab-bar-actions">
                <span style="font-size: 12px; color: var(--text-tertiary);">数据截止 2026-10-15 11:00</span>
              </div>
            </div>
          </div>

          <!-- 区块 3：实例表格 -->
          <div class="cp-block" style="padding: 0;">
            <div class="cp-table-wrap">
              <table class="cp-table" style="min-width: 0;">
                <thead>
                  <tr>
                    <th style="width: 16%;">单据编号</th>
                    <th style="width: 9%;">应用模块</th>
                    <th style="width: 11%;">引用流程</th>
                    <th style="width: 10%;text-align: right;">单据金额</th>
                    <th style="width: 7%;">发起人</th>
                    <th style="width: 10%;">当前节点</th>
                    <th style="width: 12%;">当前审批人</th>
                    <th style="width: 7%;">状态</th>
                    <th style="width: 12%;">提交时间</th>
                    <th class="col-action" style="width: 6%;text-align: right;">操作</th>
                  </tr>
                </thead>
                <tbody id="tblBody"></tbody>
              </table>
            </div>
          </div>

          <!-- 区块 4：分页 -->
          <div class="cp-block">
            <div class="cp-pagination">
              <div id="pageInfo">共 0 条记录 · 第 1 / 1 页</div>
              <div style="display: flex; align-items: center; gap: 14px;">
                <div class="cp-pagination-pages" id="pageBtns"></div>
                <select class="cp-pagination-size">
                  <option>10 条/页</option>
                  <option>20 条/页</option>
                  <option>50 条/页</option>
                </select>
                <span class="cp-pagination-jump">跳至 <input type="number" min="1" value="1"> 页</span>
              </div>
            </div>
          </div>

        </div>
        <!-- /cp-panel -->

      </div>
    </div>
  </div>
  <!-- /main-content -->

  <!-- 详情抽屉 -->
  <div class="ap-drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
  <div class="ap-drawer" id="drawer">
    <div class="ap-drawer-header">
      <div>
        <div class="ap-drawer-title" id="dwTitle">审批详情</div>
        <div style="font-size:12px;color:var(--text-tertiary);margin-top:2px;" id="dwSubtitle"></div>
      </div>
      <span class="ap-drawer-close" onclick="closeDrawer()">×</span>
    </div>
    <div class="ap-drawer-body" id="dwBody"></div>
    <div class="ap-drawer-footer">
      <button class="btn btn-default" onclick="closeDrawer()">关闭</button>
      <button class="btn btn-default" onclick="dwRemind()">立即催办</button>
      <button class="btn btn-primary" onclick="dwWithdraw()">撤回申请</button>
    </div>
  </div>

  <script src="../shared/js/topnav-drawer.js"></script>
  <script src="../shared/js/left-sidemenu.js"></script>
  <script src="../shared/js/filter-chips.js"></script>
  <script src="../shared/js/approval-engine.js"></script>
  <script>
    const AE = window.ApprovalEngine;

    // ================================================================
    // Mock 审批实例（引用配置中的流程模板）
    // ================================================================
    const INSTANCES = [
      { id:'INS-2026-1001', docNo:'DLXLC-DSRMT-20261015-001', module:'contract', flowId:'standard',
        amount: 850000, submitter:'张磊', submitTime:'2026-10-15 09:15', currentNode:1,
        status:'doing', elapsedH: 6 },

      { id:'INS-2026-1002', docNo:'HT-XSCG-20261015-002', module:'contract', flowId:'highRisk',
        amount: 3200000, submitter:'王芳', submitTime:'2026-10-15 08:30', currentNode:3,
        status:'doing', elapsedH: 3 },

      { id:'INS-2026-1003', docNo:'FK-20261014-003', module:'payment', flowId:'highRisk',
        amount: 1500000, submitter:'李强', submitTime:'2026-10-14 11:20', currentNode:4,
        status:'doing', elapsedH: 22 },

      { id:'INS-2026-1004', docNo:'SYH-XY-20261015-004', module:'settlement', flowId:'standard',
        amount: 320000, submitter:'赵敏', submitTime:'2026-10-15 10:05', currentNode:1,
        status:'doing', elapsedH: 1 },

      { id:'INS-2026-1005', docNo:'XM-20261015-005', module:'project', flowId:'standard',
        amount: 680000, submitter:'陈晨', submitTime:'2026-10-15 09:50', currentNode:2,
        status:'doing', elapsedH: 2 },

      { id:'INS-2026-1006', docNo:'FK-20261012-006', module:'refund', flowId:'highRisk',
        amount: 180000, submitter:'周涛', submitTime:'2026-10-12 09:00', currentNode:5,
        status:'approved', elapsedH: 30 },

      { id:'INS-2026-1007', docNo:'HT-XSCG-20261010-007', module:'contract', flowId:'highRisk',
        amount: 2200000, submitter:'孙丽', submitTime:'2026-10-10 15:22', currentNode:2,
        status:'rejected', elapsedH: 12 },

      { id:'INS-2026-1008', docNo:'ZBF-20261011-008', module:'bond_letter', flowId:'highRisk',
        amount: 5000000, submitter:'吴静', submitTime:'2026-10-11 08:50', currentNode:5,
        status:'approved', elapsedH: 55 },

      { id:'INS-2026-1009', docNo:'SYH-XY-20261013-009', module:'settlement', flowId:'standard',
        amount: 950000, submitter:'郑浩', submitTime:'2026-10-13 14:10', currentNode:2,
        status:'doing', elapsedH: 26 },

      { id:'INS-2026-1010', docNo:'FH-20261014-010', module:'release', flowId:'simple',
        amount: 260000, submitter:'冯雪', submitTime:'2026-10-14 10:30', currentNode:1,
        status:'withdrawn', elapsedH: 8 }
    ];

    // Mock 审批提醒记录（由节点提醒规则触发）
    const REMINDS = [
      { docNo:'FK-20261014-003',  module:'payment',    node:'合规审查',   to:'许文静',
        phone:'136 0001 XXXX', threshold: 48, channel:'站内消息 + 短信', at:'2026-10-15 10:20', status:'已送达' },
      { docNo:'FK-20261014-003',  module:'payment',    node:'合规审查',   to:'许文静',
        phone:'136 0001 XXXX', threshold: 48, channel:'站内消息 + 短信', at:'2026-10-14 11:20', status:'已送达' },
      { docNo:'SYH-XY-20261013-009', module:'settlement', node:'业务审批', to:'王浩',
        phone:'137 0000 XXXX', threshold: 24, channel:'站内消息 + 短信', at:'2026-10-14 14:10', status:'已送达' },
      { docNo:'HT-XSCG-20261010-007', module:'contract', node:'业务审批', to:'李娜',
        phone:'139 0000 XXXX', threshold: 12, channel:'站内消息 + 短信', at:'2026-10-10 15:22', status:'已送达' },
      { docNo:'DLXLC-DSRMT-20261015-001', module:'contract', node:'业务审批', to:'张磊',
        phone:'138 0000 XXXX', threshold: 24, channel:'站内消息', at:'2026-10-15 09:15', status:'待送达' }
    ];

    const STATUS_META = {
      doing:     { label:'审批中', cls:'tag-yellow' },
      approved:  { label:'已通过', cls:'tag-green'  },
      rejected:  { label:'已驳回', cls:'tag-red'    },
      withdrawn: { label:'已撤回', cls:'tag-gray'   }
    };

    let curTab = '';
    let curInstance = null;
    let currentPage = 1;
    const PAGE_SIZE = 10;

    // ================================================================
    // 初始化筛选下拉
    // ================================================================
    (function initFilters() {
      document.getElementById('fltModule').innerHTML +=
        AE.APPLY_MODULES.map(m => `<option value="${m.key}">${AE.esc(m.label)}</option>`).join('');
    })();

    // ================================================================
    // KPI
    // ================================================================
    function renderKPI() {
      const doing = INSTANCES.filter(i => i.status === 'doing');
      const done = INSTANCES.filter(i => i.status === 'approved');
      document.getElementById('kpiTotal').textContent = INSTANCES.length;
      document.getElementById('kpiDoing').textContent = doing.length;
      document.getElementById('kpiDone').textContent = done.length;
      document.getElementById('kpiRemind').textContent = REMINDS.length;
    }

    // ================================================================
    // 状态 tab
    // ================================================================
    function renderTabs() {
      const tabs = [
        { key:'',          label:'全部',   count: INSTANCES.length },
        { key:'doing',     label:'审批中', count: INSTANCES.filter(i=>i.status==='doing').length },
        { key:'approved',  label:'已通过', count: INSTANCES.filter(i=>i.status==='approved').length },
        { key:'rejected',  label:'已驳回', count: INSTANCES.filter(i=>i.status==='rejected').length },
        { key:'withdrawn', label:'已撤回', count: INSTANCES.filter(i=>i.status==='withdrawn').length }
      ];
      document.getElementById('statusTabs').innerHTML = tabs.map(t =>
        `<div class="cp-tab ${curTab===t.key?'active':''}" onclick="switchTab('${t.key}')">
          ${t.label}<span class="count">${t.count}</span>
        </div>`).join('');
    }

    function switchTab(k) { curTab = k; currentPage = 1; renderTabs(); renderTable(); }

    // ================================================================
    // 表格
    // ================================================================
    function moduleLabel(key) {
      const m = AE.getModule(key);
      return m ? m.label : key;
    }

    function getFiltered() {
      const kw = (document.getElementById('fltKw').value || '').trim();
      const mod = document.getElementById('fltModule').value;
      return INSTANCES.filter(i => {
        if (curTab && i.status !== curTab) return false;
        if (mod && i.module !== mod) return false;
        if (kw && i.docNo.indexOf(kw) < 0 && i.submitter.indexOf(kw) < 0) return false;
        return true;
      });
    }

    function renderTable() {
      const all = getFiltered();
      const totalPages = Math.max(1, Math.ceil(all.length / PAGE_SIZE));
      if (currentPage > totalPages) currentPage = totalPages;
      const rows = all.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

      document.getElementById('tblBody').innerHTML = rows.map(i => {
        const sm = STATUS_META[i.status];
        const flow = AE.getFlow(i.flowId);
        const nodes = AE.resolveFlow(flow, { amount: i.amount });
        const node = nodes[i.currentNode];
        const people = AE.nodeApprovers(node);
        const peopleText = people.length
          ? people.map(p => p.name).join('、')
          : (node && node.name === '归档完成' ? '—' : '—');
        return `<tr style="cursor:pointer;" onclick="openDrawer('${i.id}')">
          <td style="font-family: var(--font-mono); font-size: 12px;">${AE.esc(i.docNo)}</td>
          <td><span class="tag tag-blue">${AE.esc(moduleLabel(i.module))}</span></td>
          <td style="font-size: 12px; color: var(--text-secondary);">${AE.esc(flow ? flow.name : '—')}</td>
          <td style="text-align: right; font-variant-numeric: tabular-nums;">¥ ${AE.fmtAmount(i.amount)}</td>
          <td>${AE.esc(i.submitter)}</td>
          <td style="font-size: 12px;">${AE.esc(node ? node.name : '—')}</td>
          <td style="font-size: 12px; color: var(--text-secondary);">${AE.esc(peopleText)}</td>
          <td><span class="tag ${sm.cls}">${sm.label}</span></td>
          <td style="font-size: 12px; color: var(--text-tertiary);">${AE.esc(i.submitTime)}</td>
          <td class="col-action" style="text-align: right;">
            <div class="col-action-row"><a class="link">详情</a></div>
          </td>
        </tr>`;
      }).join('') || `<tr><td colspan="10"><div class="ap-empty">暂无匹配记录</div></td></tr>`;

      renderPagination(all.length, totalPages);
    }

    function renderPagination(total, totalPages) {
      document.getElementById('pageInfo').textContent =
        `共 ${total} 条记录 · 第 ${currentPage} / ${totalPages} 页`;
      const btns = [`<div class="cp-pagination-page${currentPage===1?' disabled':''}" onclick="gotoPage(${currentPage-1})">‹</div>`];
      for (let i = 1; i <= totalPages; i++) {
        btns.push(`<div class="cp-pagination-page${i===currentPage?' active':''}" onclick="gotoPage(${i})">${i}</div>`);
      }
      btns.push(`<div class="cp-pagination-page${currentPage===totalPages?' disabled':''}" onclick="gotoPage(${currentPage+1})">›</div>`);
      document.getElementById('pageBtns').innerHTML = btns.join('');
    }

    function gotoPage(p) {
      const totalPages = Math.max(1, Math.ceil(getFiltered().length / PAGE_SIZE));
      if (p < 1 || p > totalPages) return;
      currentPage = p;
      renderTable();
    }

    // ================================================================
    // 详情抽屉
    // ================================================================
    function openDrawer(id) {
      curInstance = INSTANCES.find(i => i.id === id);
      if (!curInstance) return;

      const flow = AE.getFlow(curInstance.flowId);
      const nodes = AE.resolveFlow(flow, { amount: curInstance.amount });
      const node = nodes[curInstance.currentNode];
      const people = AE.nodeApprovers(node);
      const sm = STATUS_META[curInstance.status];

      document.getElementById('dwTitle').textContent = curInstance.docNo;
      document.getElementById('dwSubtitle').innerHTML =
        `${AE.esc(moduleLabel(curInstance.module))} · ${AE.esc(flow.name)} · <span class="tag ${sm.cls}">${sm.label}</span>`;

      const remind = (node && node.remind && node.remind.enabled)
        ? `未处理满 ${node.remind.afterHours} 小时将向「${people.map(p=>p.name).join('、') || '—'}」发送提醒`
        : '该节点未开启审批提醒';

      document.getElementById('dwBody').innerHTML = `
        <div class="ap-meta-grid">
          <div class="k">应用模块</div><div class="v">${AE.esc(moduleLabel(curInstance.module))}</div>
          <div class="k">单据金额</div><div class="v">¥ ${AE.fmtAmount(curInstance.amount)}</div>
          <div class="k">引用流程</div><div class="v">${AE.esc(flow.name)}</div>
          <div class="k">发起人</div><div class="v">${AE.esc(curInstance.submitter)}</div>
          <div class="k">提交时间</div><div class="v">${AE.esc(curInstance.submitTime)}</div>
          <div class="k">当前节点</div><div class="v">${AE.esc(node ? node.name : '—')}</div>
          <div class="k">当前审批人</div>
          <div class="v">${people.length ? AE.esc(people.map(p => p.name + ' ' + p.phone).join('、')) : '—'}</div>
          <div class="k">已耗时</div><div class="v">${curInstance.elapsedH} 小时</div>
          <div class="k">提醒规则</div><div class="v" style="font-weight:400; font-size:12px;">${AE.esc(remind)}</div>
        </div>

        <div class="ap-section-title">审批节点流转</div>
        <div id="dwTimeline"></div>

        <div class="ap-section-title">条件分支求值明细</div>
        <div id="dwBranch"></div>
      `;

      let curIdx = curInstance.currentNode;
      if (curInstance.status === 'approved') curIdx = nodes.length;
      document.getElementById('dwTimeline').innerHTML =
        AE.renderTimeline({ flow: flow, formData: { amount: curInstance.amount }, currentIdx: curIdx });

      const branchNodes = nodes.filter(n => n.fromBranch || n.skipped);
      document.getElementById('dwBranch').innerHTML = branchNodes.length ? `
        <div style="overflow-x:auto;">
        <table class="cp-table is-compact" style="width:100%;">
          <thead><tr>
            <th>条件</th><th>操作符</th><th>阈值</th><th>实际值</th><th>结果</th><th>命中节点</th>
          </tr></thead>
          <tbody>${branchNodes.map(n => {
            if (n.fromBranch) {
              return `<tr>
                <td>单据金额</td><td>&gt;</td><td>1,000,000</td>
                <td>${AE.fmtAmount(curInstance.amount)}</td>
                <td><span class="tag tag-green">命中</span></td>
                <td>${AE.esc(n.name)}</td>
              </tr>`;
            }
            const r = (n.branchRules || [])[0];
            return `<tr>
              <td>${AE.esc(r ? r.fieldLabel : '—')}</td>
              <td>${AE.esc(r ? r.opLabel : '—')}</td>
              <td>${AE.fmtAmount(r ? r.value : 0)}</td>
              <td>${AE.fmtAmount(r ? r.actual : 0)}</td>
              <td><span class="tag tag-gray">未命中 → 跳过</span></td>
              <td>—</td>
            </tr>`;
          }).join('')}</tbody>
        </table></div>` : '<div style="font-size:12px;color:var(--text-tertiary);">该流程未配置条件分支</div>';

      document.getElementById('drawerOverlay').classList.add('open');
      document.getElementById('drawer').classList.add('open');
    }

    function closeDrawer() {
      document.getElementById('drawerOverlay').classList.remove('open');
      document.getElementById('drawer').classList.remove('open');
      curInstance = null;
    }

    function dwRemind() {
      toast('已向当前审批人发送催办通知');
    }

    function dwWithdraw() {
      if (!curInstance) return;
      if (!confirm(`确定撤回审批申请「${curInstance.docNo}」？`)) return;
      curInstance.status = 'withdrawn';
      closeDrawer();
      renderKPI(); renderTabs(); renderTable();
      toast('申请已撤回');
    }

    function exportInstances() {
      toast('已导出 ' + getFiltered().length + ' 条审批实例记录');
    }

    function toast(msg) {
      const t = document.createElement('div');
      t.textContent = msg;
      t.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);' +
        'background:var(--color-primary);color:#fff;padding:8px 18px;border-radius:6px;' +
        'font-size:13px;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.2);';
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2000);
    }

    // ================================================================
    // 初始化
    // ================================================================
    renderKPI();
    renderTabs();
    renderTable();
  </script>
  <script src="../assets/js/pin-annotation.js"></script>
</body>
</html>
