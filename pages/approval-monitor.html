<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>审批流程监控 - 豫港通 v1.0.0</title>
  <link rel="stylesheet" href="../assets/css/design-system.css">
  <link rel="stylesheet" href="../assets/css/list-page.css">
  <link rel="stylesheet" href="../assets/css/approval.css">
  <link rel="stylesheet" href="../assets/css/pin-annotation.css">
  <style>
    .page-body { padding: 20px 24px; }

    /* KPI */
    .ap-kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
    .ap-kpi {
      background: #fff; border: 1px solid var(--border-color);
      border-radius: 8px; padding: 14px 16px;
    }
    .ap-kpi-value { font-size: 26px; font-weight: 700; color: var(--text-primary); line-height: 1.2; }
    .ap-kpi-label { font-size: 12px; color: var(--text-tertiary); margin-top: 4px; }
    .ap-kpi.is-danger .ap-kpi-value { color: #DC2626; }
    .ap-kpi.is-warn   .ap-kpi-value { color: #D97706; }
    .ap-kpi.is-ok     .ap-kpi-value { color: #059669; }

    /* 状态 tab */
    .ap-status-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border-color); margin-bottom: 0; }
    .ap-status-tab {
      padding: 9px 16px; font-size: 13px; color: var(--text-secondary);
      cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
      user-select: none;
    }
    .ap-status-tab:hover { color: var(--color-primary); }
    .ap-status-tab.active { color: var(--color-primary); border-bottom-color: var(--color-primary); font-weight: 500; }
    .ap-status-tab .cnt { font-size: 11px; color: var(--text-tertiary); margin-left: 4px; }

    /* 详情抽屉 */
    .ap-drawer-overlay {
      position: fixed; inset: 0; background: rgba(15,23,42,.45);
      z-index: 999; display: none;
    }
    .ap-drawer-overlay.open { display: block; }
    .ap-drawer {
      position: fixed; top: 0; right: 0; bottom: 0; width: 880px; max-width: 92vw;
      background: #fff; box-shadow: -4px 0 20px rgba(0,0,0,.12);
      z-index: 1000; display: none; flex-direction: column;
    }
    .ap-drawer.open { display: flex; }
    .ap-drawer-header {
      padding: 16px 24px; border-bottom: 1px solid var(--border-color);
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    .ap-drawer-title { font-size: 16px; font-weight: 600; }
    .ap-drawer-body { flex: 1; padding: 20px 24px; overflow-y: auto; }
    .ap-drawer-footer {
      padding: 12px 24px; border-top: 1px solid var(--border-color);
      display: flex; justify-content: flex-end; gap: 8px; flex-shrink: 0;
    }

    .ap-meta-grid {
      display: grid; grid-template-columns: 120px 1fr 120px 1fr;
      gap: 10px 12px; padding: 14px 16px; background: #F8FAFC;
      border: 1px solid var(--border-color); border-radius: 6px; margin-bottom: 18px;
    }
    .ap-meta-grid .k { font-size: 12px; color: var(--text-tertiary); }
    .ap-meta-grid .v { font-size: 13px; color: var(--text-primary); font-weight: 500; }

    .ap-section-title {
      font-size: 13px; font-weight: 600; color: var(--text-primary);
      margin: 18px 0 10px; padding-left: 8px; border-left: 3px solid var(--color-primary);
    }

    /* 超时高亮 */
    .ap-overdue-row { background: #FEF2F2 !important; }
    .ap-overdue-badge {
      display: inline-block; padding: 1px 6px; border-radius: 3px;
      background: #FEE2E2; color: #B91C1C; font-size: 11px; font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-logo">
      <div style="width: 36px; height: 36px; background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 16px;">豫</div>
      <span>豫港通</span>
    </div>
    <div class="topbar-menu">
      <a class="topbar-menu-item" href="./workbench.html" data-menu-key="工作台">工作台</a>
      <a class="topbar-menu-item" href="./project-list.html" data-menu-key="准入管理">准入管理</a>
      <a class="topbar-menu-item active" href="./contract-purchase.html" data-menu-key="数字供应链">数字供应链</a>
      <a class="topbar-menu-item" href="./warehouse-inbound.html" data-menu-key="仓储管理">仓储管理</a>
      <a class="topbar-menu-item" href="./cockpit.html" data-menu-key="数据中心">数据中心</a>
      <a class="topbar-menu-item" href="./warning-config.html" data-menu-key="预警中心">预警中心</a>
      <a class="topbar-menu-item" href="./account-company.html" data-menu-key="账户中心">账户中心</a>
    </div>
  </div>

  <div style="display: flex;">
    <div class="sidemenu" id="leftSidemenu"></div>

    <div class="main-content" style="flex: 1; min-width: 0;">
      <div class="page-header" style="padding: 14px 24px;">
        <div class="breadcrumb">数字供应链 / 审批管理 / 审批流程监控</div>
        <h1 class="page-title">审批流程监控</h1>
      </div>

      <div class="page-body">
        <!-- KPI -->
        <div class="ap-kpi-row">
          <div class="ap-kpi">
            <div class="ap-kpi-value" id="kpiTotal">0</div>
            <div class="ap-kpi-label">审批实例总数</div>
          </div>
          <div class="ap-kpi is-warn">
            <div class="ap-kpi-value" id="kpiDoing">0</div>
            <div class="ap-kpi-label">进行中</div>
          </div>
          <div class="ap-kpi is-danger">
            <div class="ap-kpi-value" id="kpiOverdue">0</div>
            <div class="ap-kpi-label">超时未处理</div>
          </div>
          <div class="ap-kpi is-ok">
            <div class="ap-kpi-value" id="kpiAvg">—</div>
            <div class="ap-kpi-label">平均审批时长（小时）</div>
          </div>
        </div>

        <!-- 筛选 + tab -->
        <div class="card">
          <div class="card-header" style="display:flex;flex-direction:column;gap:12px;">
            <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
              <input type="text" class="input" id="fltKw" placeholder="搜索单据编号 / 发起人" style="width: 200px;" oninput="renderTable()">
              <select class="select" id="fltModule" style="width: 130px;" onchange="renderTable()">
                <option value="">全部模块</option>
              </select>
              <select class="select" id="fltFlow" style="width: 160px;" onchange="renderTable()">
                <option value="">全部流程</option>
              </select>
              <div style="flex:1;"></div>
              <span style="font-size:12px;color:var(--text-tertiary);">数据截止 2026-10-12 11:00</span>
            </div>
            <div class="ap-status-tabs" id="statusTabs"></div>
          </div>
          <div class="card-body" style="padding: 0;">
            <table class="data-table" style="width: 100%;">
              <thead>
                <tr>
                  <th style="width: 150px;">单据编号</th>
                  <th style="width: 100px;">业务模块</th>
                  <th style="width: 140px;">引用流程</th>
                  <th style="width: 130px;">单据金额</th>
                  <th style="width: 100px;">发起人</th>
                  <th>当前节点</th>
                  <th style="width: 100px;">状态</th>
                  <th style="width: 130px;">提交时间</th>
                  <th style="width: 80px;">操作</th>
                </tr>
              </thead>
              <tbody id="tblBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- /main-content -->

  <!-- 详情抽屉 -->
  <div class="ap-drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
  <div class="ap-drawer" id="drawer">
    <div class="ap-drawer-header">
      <div>
        <div class="ap-drawer-title" id="dwTitle">审批详情</div>
        <div style="font-size:12px;color:var(--text-tertiary);margin-top:2px;" id="dwSubtitle"></div>
      </div>
      <span class="ap-drawer-close" onclick="closeDrawer()" style="cursor:pointer;color:var(--text-tertiary);font-size:20px;line-height:1;padding:4px 8px;">×</span>
    </div>
    <div class="ap-drawer-body" id="dwBody"></div>
    <div class="ap-drawer-footer">
      <button class="btn btn-default" onclick="closeDrawer()">关闭</button>
      <button class="btn btn-default" onclick="dwRemind()">催办</button>
      <button class="btn btn-primary" onclick="dwWithdraw()">撤回申请</button>
    </div>
  </div>

  <script src="../shared/js/topnav-drawer.js"></script>
  <script src="../shared/js/left-sidemenu.js"></script>
  <script src="../shared/js/approval-engine.js"></script>
  <script>
    const AE = window.ApprovalEngine;

    // ================================================================
    // Mock 审批实例数据（引用配置中的流程模板）
    // ================================================================
    const INSTANCES = [
      { id:'INS-2026-1001', docNo:'DLXLC-DSRMT-20261010-001', module:'合同管理', flowId:'standard',
        amount: 850000, submitter:'张磊', submitTime:'2026-10-10 09:15', currentNode:1,
        status:'doing', overdue:false, elapsedH: 48 },

      { id:'INS-2026-1002', docNo:'GTGYL-MSXS-20261010-s', module:'合同管理', flowId:'highRisk',
        amount: 3200000, submitter:'王芳', submitTime:'2026-10-10 14:30', currentNode:3,
        status:'doing', overdue:true, elapsedH: 72 },

      { id:'INS-2026-1003', docNo:'HTLS-20261008-023', module:'资金管理', flowId:'highRisk',
        amount: 1500000, submitter:'李强', submitTime:'2026-10-08 11:20', currentNode:4,
        status:'doing', overdue:true, elapsedH: 96 },

      { id:'INS-2026-1004', docNo:'JSDJ-20261011-008', module:'收发货管理', flowId:'simple',
        amount: 320000, submitter:'赵敏', submitTime:'2026-10-11 10:05', currentNode:1,
        status:'doing', overdue:false, elapsedH: 25 },

      { id:'INS-2026-1005', docNo:'LX20261010001', module:'准入管理', flowId:'standard',
        amount: 680000, submitter:'陈晨', submitTime:'2026-10-10 16:42', currentNode:2,
        status:'doing', overdue:false, elapsedH: 42 },

      { id:'INS-2026-1006', docNo:'FPZS-20261005-016', module:'发票管理', flowId:'simple',
        amount: 180000, submitter:'周涛', submitTime:'2026-10-05 09:00', currentNode:3,
        status:'approved', overdue:false, elapsedH: 30 },

      { id:'INS-2026-1007', docNo:'BZJ-20261003-004', module:'资金管理', flowId:'highRisk',
        amount: 2200000, submitter:'孙丽', submitTime:'2026-10-03 15:22', currentNode:2,
        status:'rejected', overdue:false, elapsedH: 12 },

      { id:'INS-2026-1008', docNo:'ZBF-20261009-011', module:'追保函管理', flowId:'highRisk',
        amount: 5000000, submitter:'吴静', submitTime:'2026-10-09 08:50', currentNode:4,
        status:'approved', overdue:false, elapsedH: 55 },

      { id:'INS-2026-1009', docNo:'JSJ-20261011-021', module:'结算单管理', flowId:'standard',
        amount: 950000, submitter:'郑浩', submitTime:'2026-10-11 14:10', currentNode:2,
        status:'doing', overdue:false, elapsedH: 21 },

      { id:'INS-2026-1010', docNo:'HZ-20261010-035', module:'货转管理', flowId:'simple',
        amount: 260000, submitter:'冯雪', submitTime:'2026-10-10 10:30', currentNode:1,
        status:'withdrawn', overdue:false, elapsedH: 8 }
    ];

    const STATUS_META = {
      doing:     { label:'审批中',   cls:'tag-orange' },
      approved:  { label:'已通过',   cls:'tag-green' },
      rejected:  { label:'已驳回',   cls:'tag-red' },
      withdrawn: { label:'已撤回',   cls:'tag-gray' }
    };

    let curTab = '';
    let curInstance = null;

    // ================================================================
    // 初始化筛选下拉
    // ================================================================
    (function initFilters() {
      const mods = [...new Set(INSTANCES.map(i => i.module))].sort();
      document.getElementById('fltModule').innerHTML += mods.map(m => `<option value="${m}">${m}</option>`).join('');
      const flows = AE.listFlows();
      document.getElementById('fltFlow').innerHTML += flows.map(f => `<option value="${f.id}">${AE.esc(f.name)}</option>`).join('');
    })();

    // ================================================================
    // KPI
    // ================================================================
    function renderKPI() {
      const doing = INSTANCES.filter(i => i.status === 'doing');
      const overdue = doing.filter(i => i.overdue);
      const finished = INSTANCES.filter(i => i.status === 'approved');
      const avg = finished.length
        ? (finished.reduce((s,i) => s + i.elapsedH, 0) / finished.length).toFixed(1)
        : '—';
      document.getElementById('kpiTotal').textContent = INSTANCES.length;
      document.getElementById('kpiDoing').textContent = doing.length;
      document.getElementById('kpiOverdue').textContent = overdue.length;
      document.getElementById('kpiAvg').textContent = avg;
    }

    // ================================================================
    // 状态 tab
    // ================================================================
    function renderTabs() {
      const tabs = [
        { key:'',              label:'全部',   count: INSTANCES.length },
        { key:'doing',         label:'审批中', count: INSTANCES.filter(i=>i.status==='doing').length },
        { key:'overdue',       label:'超时',   count: INSTANCES.filter(i=>i.overdue).length },
        { key:'approved',      label:'已通过', count: INSTANCES.filter(i=>i.status==='approved').length },
        { key:'rejected',      label:'已驳回', count: INSTANCES.filter(i=>i.status==='rejected').length },
        { key:'withdrawn',     label:'已撤回', count: INSTANCES.filter(i=>i.status==='withdrawn').length }
      ];
      document.getElementById('statusTabs').innerHTML = tabs.map(t =>
        `<div class="ap-status-tab ${curTab===t.key?'active':''}" onclick="switchTab('${t.key}')">
          ${t.label}<span class="cnt">${t.count}</span>
        </div>`).join('');
    }

    function switchTab(k) {
      curTab = k;
      renderTabs();
      renderTable();
    }

    // ================================================================
    // 表格
    // ================================================================
    function renderTable() {
      const kw = (document.getElementById('fltKw').value || '').trim();
      const mod = document.getElementById('fltModule').value;
      const fid = document.getElementById('fltFlow').value;

      const rows = INSTANCES.filter(i => {
        if (curTab === 'overdue' && !i.overdue) return false;
        if (curTab && curTab !== 'overdue' && i.status !== curTab) return false;
        if (mod && i.module !== mod) return false;
        if (fid && i.flowId !== fid) return false;
        if (kw && i.docNo.indexOf(kw) < 0 && i.submitter.indexOf(kw) < 0) return false;
        return true;
      });

      document.getElementById('tblBody').innerHTML = rows.map(i => {
        const sm = STATUS_META[i.status];
        const flow = AE.getFlow(i.flowId);
        const nodes = AE.resolveFlow(flow, { amount: i.amount });
        const curNodeName = nodes[i.currentNode]
          ? nodes[i.currentNode].name : '—';
        return `<tr class="${i.overdue ? 'ap-overdue-row' : ''}" style="cursor:pointer;" onclick="openDrawer('${i.id}')">
          <td style="font-family:var(--font-mono);font-size:12px;">${AE.esc(i.docNo)}</td>
          <td><span class="tag tag-blue">${AE.esc(i.module)}</span></td>
          <td style="font-size:12px;color:var(--text-secondary);">${AE.esc(flow ? flow.name : '—')}</td>
          <td style="text-align:right;font-variant-numeric:tabular-nums;">¥ ${AE.fmtAmount(i.amount)}</td>
          <td>${AE.esc(i.submitter)}</td>
          <td style="font-size:12px;">
            ${AE.esc(curNodeName)}
            ${i.overdue ? '<span class="ap-overdue-badge">超时 '+i.elapsedH+'h</span>' : ''}
          </td>
          <td><span class="tag ${sm.cls}">${sm.label}</span></td>
          <td style="font-size:12px;color:var(--text-tertiary);">${AE.esc(i.submitTime)}</td>
          <td><span class="link">详情</span></td>
        </tr>`;
      }).join('') || '<tr><td colspan="9" style="text-align:center;padding:32px;color:var(--text-tertiary);">暂无匹配记录</td></tr>';
    }

    // ================================================================
    // 详情抽屉
    // ================================================================
    function openDrawer(id) {
      curInstance = INSTANCES.find(i => i.id === id);
      if (!curInstance) return;

      const flow = AE.getFlow(curInstance.flowId);
      const nodes = AE.resolveFlow(flow, { amount: curInstance.amount });
      const sm = STATUS_META[curInstance.status];

      document.getElementById('dwTitle').textContent = curInstance.docNo;
      document.getElementById('dwSubtitle').innerHTML =
        `${AE.esc(curInstance.module)} · ${AE.esc(flow.name)} · <span class="tag ${sm.cls}">${sm.label}</span>`;

      let html = `
        <div class="ap-meta-grid">
          <div class="k">业务模块</div><div class="v">${AE.esc(curInstance.module)}</div>
          <div class="k">单据金额</div><div class="v">¥ ${AE.fmtAmount(curInstance.amount)}</div>
          <div class="k">引用流程</div><div class="v">${AE.esc(flow.name)}</div>
          <div class="k">发起人</div><div class="v">${AE.esc(curInstance.submitter)}</div>
          <div class="k">提交时间</div><div class="v">${AE.esc(curInstance.submitTime)}</div>
          <div class="k">已耗时</div>
          <div class="v" style="${curInstance.overdue?'color:#DC2626;font-weight:600;':''}">
            ${curInstance.elapsedH} 小时 ${curInstance.overdue?'（已超时）':''}
          </div>
        </div>

        <div class="ap-section-title">审批节点流转</div>
        <div id="dwTimeline"></div>

        <div class="ap-section-title">条件分支求值明细</div>
        <div id="dwBranch"></div>
      `;

      document.getElementById('dwBody').innerHTML = html;

      // 时间线（按实例状态决定 currentIdx）
      let curIdx = curInstance.currentNode;
      if (curInstance.status === 'approved') curIdx = nodes.length;
      if (curInstance.status === 'withdrawn') curIdx = curInstance.currentNode;
      document.getElementById('dwTimeline').innerHTML =
        AE.renderTimeline({ flow: flow, formData: { amount: curInstance.amount }, currentIdx: curIdx });

      // 分支明细
      const branchNodes = nodes.filter(n => n.fromBranch || n.skipped);
      document.getElementById('dwBranch').innerHTML = branchNodes.length ? `
        <table class="data-table" style="width:100%;font-size:12px;">
          <thead><tr>
            <th>条件</th><th>操作符</th><th>阈值</th><th>实际值</th><th>结果</th><th>命中节点</th>
          </tr></thead>
          <tbody>${branchNodes.map(n => {
            const r = (n.branchRule) ? null : (n.branchRules || [])[0];
            if (n.fromBranch) {
              return `<tr>
                <td>单据金额</td><td>&gt;</td><td>1,000,000</td>
                <td>${AE.fmtAmount(curInstance.amount)}</td>
                <td><span class="tag tag-green">命中</span></td>
                <td>${AE.esc(n.name)}</td>
              </tr>`;
            }
            return `<tr>
              <td>${AE.esc(r ? r.fieldLabel : '—')}</td>
              <td>${AE.esc(r ? r.opLabel : '—')}</td>
              <td>${AE.fmtAmount(r ? r.value : 0)}</td>
              <td>${AE.fmtAmount(r ? r.actual : 0)}</td>
              <td><span class="tag tag-gray">未命中 → 跳过</span></td>
              <td>—</td>
            </tr>`;
          }).join('')}</tbody>
        </table>` : '<div style="font-size:12px;color:var(--text-tertiary);">该流程未配置条件分支</div>';

      document.getElementById('drawerOverlay').classList.add('open');
      document.getElementById('drawer').classList.add('open');
    }

    function closeDrawer() {
      document.getElementById('drawerOverlay').classList.remove('open');
      document.getElementById('drawer').classList.remove('open');
      curInstance = null;
    }

    function dwRemind() { toast('已发送催办通知'); }
    function dwWithdraw() {
      if (!confirm(`确定撤回审批申请「${curInstance.docNo}」？`)) return;
      curInstance.status = 'withdrawn';
      closeDrawer();
      renderKPI(); renderTabs(); renderTable();
      toast('申请已撤回');
    }

    function toast(msg) {
      const t = document.createElement('div');
      t.textContent = msg;
      t.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);' +
        'background:var(--color-primary);color:#fff;padding:8px 18px;border-radius:6px;' +
        'font-size:13px;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.2);';
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2000);
    }

    // ================================================================
    // 初始化
    // ================================================================
    renderKPI();
    renderTabs();
    renderTable();
  </script>
</body>
</html>
