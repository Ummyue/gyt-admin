<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>出库记录 - 豫港通 v1.7.99.86</title>
  <link rel="stylesheet" href="../assets/css/design-system.css">
  <link rel="stylesheet" href="../assets/css/list-page.css">
  <link rel="stylesheet" href="../assets/css/pin-annotation.css">
  <style>
    .page-body { padding: 20px 24px; }
    /* 10 列：出库日期 / 品类 / 出库数量(吨) / 出库单价(元/吨) / 车数 / 合同编号 / 业务线号 / 收货单位 / 仓库&货位 / 数据类型 / 操作 */
    .cp-table th.col-num, .cp-table td.col-num { font-family: var(--font-mono); }
    .cp-table .col-num { font-family: var(--font-mono); color: var(--text-secondary); }
    .cp-table .col-qty { text-align: right; font-family: var(--font-mono); }
    .cp-table .col-price { text-align: right; font-family: var(--font-mono); }
    /* 数据类型 tag 颜色（v1.7.99.86 跟入库记录一致） */
    .dt-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
    .dt-tag.manual { background: #FEF3C7; color: #A16207; }
    .dt-tag.system { background: #DBEAFE; color: #1E40AF; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-logo">
      <div style="width: 36px; height: 36px; background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 16px;">豫</div>
      <span>豫港通</span>
    </div>
    <div class="topbar-menu">
      <a class="topbar-menu-item" href="./workbench.html" data-menu-key="工作台">工作台</a>
      <a class="topbar-menu-item" href="./project-list.html" data-menu-key="准入管理">准入管理</a>
      <a class="topbar-menu-item" href="./contract-purchase.html" data-menu-key="数字供应链">数字供应链</a>
      <a class="topbar-menu-item active" href="./warehouse-inbound.html" data-menu-key="仓储管理">仓储管理</a>
      <a class="topbar-menu-item" href="./cockpit.html" data-menu-key="数据中心">数据中心</a>
      <a class="topbar-menu-item" href="./warning-list.html" data-menu-key="预警中心">预警中心</a>
      <a class="topbar-menu-item" href="./account-personal.html" data-menu-key="账户中心">账户中心</a>
      <button class="topbar-changelog-btn" onclick="window.open('./changelog.html', '_blank')" title="查看高保真原型版本变更记录">📋 版本变更记录</button>
    </div>
    <div class="topbar-right">
      <div class="topbar-icon-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="badge"></span>
      </div>
      <div class="topbar-user">
        <div class="topbar-user-avatar">张</div>
        <div>
          <div class="topbar-user-name">张爽</div>
          <div class="topbar-user-org">港通供应链</div>
        </div>
      </div>
    </div>
  </div>

  <div style="display: flex;">
    <div class="sidemenu" id="leftSidemenu"></div>

    <div class="main-content" style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
      <div class="page-body" style="flex: 1; overflow-y: auto; background: var(--bg-page);">

        <!-- 面包屑 -->
        <div class="breadcrumb-inline">
          <a href="#">仓储管理</a>
          <span class="sep">/</span>
          <a href="#">出库管理</a>
          <span class="sep">/</span>
          <span class="current">出库记录</span>
        </div>

        <!-- 标题 + 右上 新增出库（v1.7.99.116：加 onclick 跳新增销售出库页） -->
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;">
          <h1 class="page-h1" style="margin: 0;">出库记录</h1>
          <button class="btn btn-primary" onclick="window.location.href='./warehouse-outbound-new.html'">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
            新增出库
          </button>
        </div>

        <!-- 合并 panel -->
        <div class="cp-panel">

          <!-- 区块 1：9 字段筛选区（v1.7.99.86 按图 2：编号/收货单位/出库日期/品类/仓位/货位/关联业务线状态/业务线号/数据类型） -->
          <div class="cp-block">
            <div class="cp-filter-summary">
              <div class="cp-filter-summary-left">
                当前搜索：<span data-filter-chips class="filter-chips"></span><span class="filter-empty-hint">（无筛选条件）</span>
                <button type="button" class="clear-all-btn" style="display: none;" onclick="clearAllFilters(this)">清除全部</button>
              </div>
              <button class="btn btn-text btn-sm">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                数据导出
              </button>
            </div>
            <div class="cp-filter">
              <div class="cp-filter-item">
                <span class="cp-filter-label">编号</span>
                <input type="text" class="input" placeholder="请输入订单、合同、下游计划、出库编号">
              </div>
              <div class="cp-filter-item">
                <span class="cp-filter-label">收货单位</span>
                <input type="text" class="input" placeholder="请输入收货单位">
              </div>
              <div class="cp-filter-item">
                <span class="cp-filter-label">出库日期</span>
                <input type="text" class="input" placeholder="开始时间 ~ 结束时间">
              </div>
              <div class="cp-filter-item">
                <span class="cp-filter-label">品类</span>
                <input type="text" class="input" placeholder="请输入品类">
              </div>
              <div class="cp-filter-item">
                <span class="cp-filter-label">仓位</span>
                <select class="select"><option>请选择仓位</option><option>1 号仓</option><option>2 号仓</option><option>3 号仓</option></select>
              </div>
              <div class="cp-filter-item">
                <span class="cp-filter-label">货位</span>
                <input type="text" class="input" placeholder="请输入货位">
              </div>
              <div class="cp-filter-item">
                <span class="cp-filter-label">关联业务线状态</span>
                <select class="select"><option>请选择业务线状态</option><option>已关联</option><option>未关联</option></select>
              </div>
              <div class="cp-filter-item">
                <span class="cp-filter-label">业务线号</span>
                <input type="text" class="input" placeholder="请输入业务线号">
              </div>
              <div class="cp-filter-item">
                <span class="cp-filter-label">数据类型</span>
                <select class="select"><option>请选择数据类型</option><option>手动新增(销售出库)</option><option>系统自动(下游同步)</option></select>
              </div>
              <div class="cp-filter-item">
                <span class="cp-filter-label">出库类型</span>
                <select class="select"><option>请选择出库类型</option><option>销售出库</option><option>盘亏出库</option></select>
              </div>
            </div>
          </div>

          <!-- 区块 2：4 tab 状态机（v1.7.99.86 按图 2：全部/汽运/火运/船运） -->
          <div class="cp-block cp-block-tab">
            <div class="cp-tab-bar">
              <div class="cp-tab-bar-tabs">
                <div class="cp-tab active" onclick="switchTab(this, 'all')">全部</div>
                <div class="cp-tab" onclick="switchTab(this, 'road')">汽运</div>
                <div class="cp-tab" onclick="switchTab(this, 'rail')">火运</div>
                <div class="cp-tab" onclick="switchTab(this, 'ship')">船运</div>
              </div>
            </div>
          </div>

          <!-- 区块 3：10 列表格（v1.7.99.86 按图 2：出库日期/品类/出库数量(吨)/出库单价(元/吨)/车数/合同编号/业务线号/收货单位/仓库&货位/数据类型/操作） -->
          <div class="cp-block" style="padding: 0;">
            <div class="cp-table-wrap">
              <table class="cp-table">
                <thead>
                  <tr>
                    <th style="width: 8%;">出库日期</th>
                    <th style="width: 7%;">品类</th>
                    <th style="width: 8%;text-align: right;">出库数量(吨)</th>
                    <th style="width: 9%;text-align: right;">出库单价(元/吨)</th>
                    <th style="width: 6%;text-align: right;">车数</th>
                    <th style="width: 14%;">合同编号</th>
                    <th style="width: 12%;">业务线号</th>
                    <th style="width: 13%;">收货单位</th>
                    <th style="width: 11%;">仓库&货位</th>
                    <th style="width: 6%;">数据类型</th>
                    <th class="col-action" style="width: auto;text-align: right;">操作</th>
                  </tr>
                </thead>
                <tbody id="outboundTbody"></tbody>
              </table>
            </div>
          </div>

          <!-- 区块 4：分页（v1.7.99.86 按图 2：共 76 条信息 + 1-8 页 + 10 条/页 + 跳至） -->
          <div class="cp-block">
            <div class="cp-pagination">
              <div>共 76 条信息</div>
              <div style="display: flex; align-items: center; gap: 14px;">
                <div class="cp-pagination-pages">
                  <div class="cp-pagination-page">‹</div>
                  <div class="cp-pagination-page active">1</div>
                  <div class="cp-pagination-page">2</div>
                  <div class="cp-pagination-page">3</div>
                  <div class="cp-pagination-page">4</div>
                  <div class="cp-pagination-page">5</div>
                  <div class="cp-pagination-page">6</div>
                  <div class="cp-pagination-page">7</div>
                  <div class="cp-pagination-page">8</div>
                  <div class="cp-pagination-page">›</div>
                </div>
                <select class="cp-pagination-size">
                  <option>10 条/页</option>
                  <option>20 条/页</option>
                  <option>50 条/页</option>
                </select>
                <span class="cp-pagination-jump">跳至 <input type="number" min="1" value="1"> 页</span>
              </div>
            </div>
          </div>

        </div>
        <!-- /cp-panel -->

      </div>
    </div>
  </div>
  <script src="../shared/js/topnav-drawer.js"></script>
  <script src="../shared/js/left-sidemenu.js"></script>
  <script src="../shared/js/filter-chips.js"></script>
  <script>
    // v1.7.99.86：10 行 mock（按图 2 1:1 复制）
    // 合同号 YL-MSXS-20260127-s + 业务线号 SKYWX202607050001 + 收货单位 郑州信必达国际供应链 + 数据类型 手动新增(销售出库)
    const OUTBOUND_MOCK = [
      { date: '2026-07-28', category: '木薯淀粉', qty: '69', price: '3647.00', carCount: 2, contract: 'YL-MSXS-20260127-s', bizLine: 'SKYWX202607050001', receiver: '郑州信必达国际供应链有限公司', warehouse: '中粮贸易集团...心', dataType: 'manual' },
      { date: '2026-07-27', category: '木薯淀粉', qty: '69', price: '3647.00', carCount: 2, contract: 'YL-MSXS-20260127-s', bizLine: 'SKYWX202607050001', receiver: '郑州信必达国际供应链有限公司', warehouse: '中粮贸易集团...心', dataType: 'manual' },
      { date: '2026-07-24', category: '木薯淀粉', qty: '34', price: '3647.00', carCount: 1, contract: 'YL-MSXS-20260127-s', bizLine: 'SKYWX202607050001', receiver: '郑州信必达国际供应链有限公司', warehouse: '中粮贸易集团...心', dataType: 'manual' },
      { date: '2026-07-23', category: '木薯淀粉', qty: '69', price: '3647.00', carCount: 2, contract: 'YL-MSXS-20260127-s', bizLine: 'SKYWX202607050001', receiver: '郑州信必达国际供应链有限公司', warehouse: '中粮贸易集团...心', dataType: 'manual' },
      { date: '2026-07-22', category: '木薯淀粉', qty: '34', price: '3647.00', carCount: 1, contract: 'YL-MSXS-20260127-s', bizLine: 'SKYWX202607050001', receiver: '郑州信必达国际供应链有限公司', warehouse: '中粮贸易集团...心', dataType: 'manual' },
      { date: '2026-07-20', category: '木薯淀粉', qty: '103', price: '3647.00', carCount: 4, contract: 'YL-MSXS-20260127-s', bizLine: 'SKYWX202607050001', receiver: '郑州信必达国际供应链有限公司', warehouse: '中粮贸易集团...心', dataType: 'manual' },
      { date: '2026-07-18', category: '木薯淀粉', qty: '35', price: '3444.83', carCount: 1, contract: 'YL-MSXS-20260127-s', bizLine: 'SKYWX202607050001', receiver: '郑州信必达国际供应链有限公司', warehouse: '中粮贸易集团...心', dataType: 'manual' },
      { date: '2026-07-17', category: '木薯淀粉', qty: '34', price: '3444.83', carCount: 1, contract: 'YL-MSXS-20260127-s', bizLine: 'SKYWX202607050001', receiver: '郑州信必达国际供应链有限公司', warehouse: '中粮贸易集团...心', dataType: 'manual' },
      { date: '2026-07-16', category: '木薯淀粉', qty: '79', price: '3444.83', carCount: 2, contract: 'YL-MSXS-20260127-s', bizLine: 'SKYWX202607050001', receiver: '郑州信必达国际供应链有限公司', warehouse: '中粮贸易集团...心', dataType: 'manual' },
      { date: '2026-07-15', category: '木薯淀粉', qty: '34', price: '3444.83', carCount: 1, contract: 'YL-MSXS-20260127-s', bizLine: 'SKYWX202607050001', receiver: '郑州信必达国际供应链有限公司', warehouse: '中粮贸易集团...心', dataType: 'manual' },
    ];

    const DT_LABEL = { manual: '手动新增(销售出库)', system: '系统自动(下游同步)' };

    function renderOutboundTable() {
      const tbody = document.getElementById('outboundTbody');
      tbody.innerHTML = OUTBOUND_MOCK.map((r) => {
        return `<tr>
          <td>${r.date}</td>
          <td>${r.category}</td>
          <td style="text-align: right;" class="col-qty">${r.qty}</td>
          <td style="text-align: right;" class="col-price">${r.price}</td>
          <td style="text-align: right;" class="col-num">${r.carCount}</td>
          <td class="col-num">${r.contract}</td>
          <td class="col-num">${r.bizLine}</td>
          <td>${r.receiver}</td>
          <td>${r.warehouse}</td>
          <td><span class="dt-tag ${r.dataType}">${DT_LABEL[r.dataType] || r.dataType}</span></td>
          <td class="col-action" style="text-align: right;">
            <a href="javascript:void(0)" data-action="view">详情</a>
            <a href="javascript:void(0)" data-action="edit">编辑</a>
            <a href="javascript:void(0)" data-action="delete" class="danger">删除</a>
          </td>
        </tr>`;
      }).join('');
    }

    function switchTab(el, key) {
      document.querySelectorAll('.cp-tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
    }
    document.addEventListener('DOMContentLoaded', renderOutboundTable);

    // 操作列点击事件委托（v1.7.99.80/83/84/85 模式：inline Utils fallback）
    document.body.addEventListener('click', function(e) {
      var target = e.target;
      if (target.tagName === 'A' && target.closest('.col-action')) {
        var action = target.getAttribute('data-action');
        if (!action) return;
        e.preventDefault();
        var labels = { view: '查看', edit: '编辑', delete: '删除' };
        if (action === 'delete' && !window.confirm('确定要删除这条出库记录吗？')) return;
        if (window.Utils && Utils.toast) {
          Utils.toast('【' + (labels[action] || action) + '】操作已触发（二期实现）', 'info');
        } else {
          console.log('[toast] info 【' + (labels[action] || action) + '】操作已触发（二期实现）');
        }
      }
    });

    // inline Utils fallback（v1.7.99.80 经验）
    window.Utils = window.Utils || {
      toast: function(msg, type) { try { console.log('[Utils.toast]', type || 'info', msg); } catch (e) {} }
    };
  </script>
  </div>
  <!-- /main-content -->
<script src="../assets/js/pin-annotation.js"></script>
  <script src="../shared/js/prd-fab.js"></script>
</body>
</html>
