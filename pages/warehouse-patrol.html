<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>巡库记录 - 豫港通 v1.7.99.86</title>
  <link rel="stylesheet" href="../assets/css/design-system.css">
  <link rel="stylesheet" href="../assets/css/list-page.css">
  <link rel="stylesheet" href="../assets/css/pin-annotation.css">
  <style>
    .page-body { padding: 20px 24px; }
    /* 12 列（v1.7.99.86 按图 6：序号/仓库名称/仓房/货主/巡库时间/巡库结果/处理状态/处理时间/巡库人员/监管负责人/报告生成时间/操作） */
    .cp-table th.col-num, .cp-table td.col-num { font-family: var(--font-mono); }
    .cp-table .col-seq { font-family: var(--font-mono); color: var(--text-secondary); text-align: center; }
    /* 巡库结果 tag 颜色（v1.7.99.86：正常/异常/待处理） */
    .patrol-result { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
    .patrol-result.normal { background: #D1FAE5; color: #047857; }
    .patrol-result.abnormal { background: #FEE2E2; color: #DC2626; }
    .patrol-result.pending { background: #FEF3C7; color: #A16207; }
    /* 处理状态 tag 颜色 */
    .patrol-status { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
    .patrol-status.handled { background: #DBEAFE; color: #1E40AF; }
    .patrol-status.unhandled { background: #FEF3C7; color: #A16207; }
    .patrol-status.closed { background: #F3F4F6; color: #6B7280; }
    /* empty state（v1.7.99.86 按图 6：暂无数据） */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 20px;
      color: var(--text-tertiary);
      font-size: 13px;
    }
    .empty-state-icon {
      width: 64px;
      height: 64px;
      border: 1.5px dashed #CBD5E1;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-logo">
      <div style="width: 36px; height: 36px; background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 16px;">豫</div>
      <span>豫港通</span>
    </div>
    <div class="topbar-menu">
      <a class="topbar-menu-item" href="./workbench.html" data-menu-key="工作台">工作台</a>
      <a class="topbar-menu-item" href="./project-list.html" data-menu-key="准入管理">准入管理</a>
      <a class="topbar-menu-item" href="./contract-purchase.html" data-menu-key="数字供应链">数字供应链</a>
      <a class="topbar-menu-item active" href="./warehouse-inbound.html" data-menu-key="仓储管理">仓储管理</a>
      <a class="topbar-menu-item" href="./cockpit.html" data-menu-key="数据中心">数据中心</a>
      <a class="topbar-menu-item" href="./warning-list.html" data-menu-key="预警中心">预警中心</a>
      <a class="topbar-menu-item" href="./account-personal.html" data-menu-key="账户中心">账户中心</a>
      <button class="topbar-changelog-btn" onclick="window.open('./changelog.html', '_blank')" title="查看高保真原型版本变更记录">📋 版本变更记录</button>
    </div>
    <div class="topbar-right">
      <div class="topbar-icon-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="badge"></span>
      </div>
      <div class="topbar-user">
        <div class="topbar-user-avatar">张</div>
        <div>
          <div class="topbar-user-name">张爽</div>
          <div class="topbar-user-org">港通供应链</div>
        </div>
      </div>
    </div>
  </div>

  <div style="display: flex;">
    <div class="sidemenu" id="leftSidemenu"></div>

    <div class="main-content" style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
      <div class="page-body" style="flex: 1; overflow-y: auto; background: var(--bg-page);">

        <!-- 面包屑 -->
        <div class="breadcrumb-inline">
          <a href="#">仓储管理</a>
          <span class="sep">/</span>
          <a href="#">巡库管理</a>
          <span class="sep">/</span>
          <span class="current">巡库记录</span>
        </div>

        <!-- 标题 -->
        <h1 class="page-h1" style="margin: 0 0 14px;">巡库记录</h1>

        <!-- 合并 panel -->
        <div class="cp-panel">

          <!-- 区块 1：3 字段筛选区（v1.7.99.86 按图 6：巡库结果/处理状态/巡库时间） -->
          <div class="cp-block">
            <div class="cp-filter" style="grid-template-columns: 1fr 1fr 1fr; gap: 14px 20px;">
              <div class="cp-filter-item">
                <span class="cp-filter-label">巡库结果</span>
                <select class="select"><option>请选择</option><option>正常</option><option>异常</option><option>待处理</option></select>
              </div>
              <div class="cp-filter-item">
                <span class="cp-filter-label">处理状态</span>
                <select class="select"><option>请选择</option><option>已处理</option><option>未处理</option><option>已关闭</option></select>
              </div>
              <div class="cp-filter-item">
                <span class="cp-filter-label">巡库时间</span>
                <input type="text" class="input" placeholder="开始时间 ~ 结束时间">
              </div>
            </div>
          </div>

          <!-- 区块 2：12 列表格（v1.7.99.86 按图 6：序号/仓库名称/仓房/货主/巡库时间/巡库结果/处理状态/处理时间/巡库人员/监管负责人/报告生成时间/操作） -->
          <div class="cp-block" style="padding: 0;">
            <div class="cp-table-wrap">
              <table class="cp-table">
                <thead>
                  <tr>
                    <th style="width: 5%;">序号</th>
                    <th style="width: 9%;">仓库名称</th>
                    <th style="width: 7%;">仓房</th>
                    <th style="width: 10%;">货主</th>
                    <th style="width: 9%;">巡库时间</th>
                    <th style="width: 8%;">巡库结果</th>
                    <th style="width: 8%;">处理状态</th>
                    <th style="width: 9%;">处理时间</th>
                    <th style="width: 8%;">巡库人员</th>
                    <th style="width: 8%;">监管负责人</th>
                    <th style="width: 9%;">报告生成时间</th>
                    <th class="col-action" style="width: auto;text-align: right;">操作</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td colspan="12">
                      <div class="empty-state">
                        <div class="empty-state-icon">
                          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 10h8M8 14h5"/></svg>
                        </div>
                        暂无数据
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

        </div>
        <!-- /cp-panel -->

      </div>
    </div>
  </div>
  <script src="../shared/js/topnav-drawer.js"></script>
  <script src="../shared/js/left-sidemenu.js"></script>
  <script src="../shared/js/filter-chips.js"></script>
  <script>
  </script>
  </div>
  <!-- /main-content -->
<script src="../assets/js/pin-annotation.js"></script>
  <script src="../shared/js/prd-fab.js"></script>
</body>
</html>
