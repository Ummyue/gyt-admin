<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>库点信息管理 - 豫港通 v1.7.99.119</title>
  <link rel="stylesheet" href="../assets/css/design-system.css">
  <link rel="stylesheet" href="../assets/css/list-page.css">
  <link rel="stylesheet" href="../assets/css/pin-annotation.css">
  <style>
    .page-body { padding: 20px 24px; }
    /* v1.7.99.119 顶部基础信息表（5 列 3 行 label-value 灰底） */
    .info-table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
    .info-table th, .info-table td {
      padding: 12px 16px; font-size: 13px; border: 1px solid var(--border-light);
    }
    .info-table th {
      background: #F8FAFC; color: var(--text-tertiary); font-weight: 400;
      text-align: left; width: 130px;
    }
    .info-table td {
      background: #fff; color: var(--text-primary); font-weight: 500;
    }
    .info-table .address-cell .edit-icon {
      color: var(--text-tertiary); margin-left: 8px; cursor: pointer;
      display: inline-flex; vertical-align: middle;
    }
    .info-table .address-cell .edit-icon:hover { color: var(--color-primary); }
    /* v1.7.99.119 tab 栏（库点平面图 / 仓储租赁合同） */
    .point-tabs { display: flex; gap: 32px; border-bottom: 1px solid var(--border-light); margin-bottom: 0; }
    .point-tab {
      padding: 12px 4px; font-size: 14px; color: var(--text-tertiary);
      cursor: pointer; border-bottom: 2px solid transparent;
      transition: all 0.2s; user-select: none;
    }
    .point-tab.active { color: var(--color-primary); border-bottom-color: var(--color-primary); font-weight: 500; }
    .point-tab:hover:not(.active) { color: var(--text-primary); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    /* v1.7.99.119 tap 头部（右侧按钮） */
    .tab-header {
      display: flex; align-items: center; justify-content: flex-end;
      padding: 16px 0;
    }
    /* v1.7.99.119 tap1 空状态（未配置平面图信息） */
    .empty-state {
      padding: 60px 24px;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      color: var(--text-tertiary);
    }
    .empty-state .empty-icon {
      width: 64px; height: 64px; color: #CBD5E1;
    }
    .empty-state .empty-text { font-size: 13px; color: var(--text-tertiary); }
    /* v1.7.99.119 监控信息 / 上传合同 按钮（与其他模块对齐） */
    .btn-primary {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 16px; background: var(--color-primary); color: #fff;
      border: 0; border-radius: 4px; font-size: 13px; cursor: pointer;
    }
    .btn-primary:hover { background: #1E3A8A; }
    /* v1.7.99.119 仓储租赁合同表格 11 列 */
    .lease-table-wrap { overflow-x: auto; }
    .lease-table { width: 100%; min-width: 100%; border-collapse: collapse; }
    .lease-table th, .lease-table td {
      padding: 10px 10px; text-align: left; border-bottom: 1px solid var(--border-light);
      font-size: 12px; white-space: nowrap;
    }
    .lease-table th { color: var(--text-tertiary); font-weight: 500; background: #F8FAFC; }
    .lease-table td { color: var(--text-primary); }
    .lease-table .col-num { font-family: var(--font-mono); color: var(--text-secondary); }
    .lease-table .col-actions { white-space: nowrap; }
    .lease-table .col-actions a {
      color: var(--color-primary); text-decoration: none; margin-right: 8px; cursor: pointer;
    }
    .lease-table .col-actions a:hover { text-decoration: underline; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 12px; }
    .tag-green { background: #DCFCE7; color: #166534; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-logo">
      <div style="width: 36px; height: 36px; background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 16px;">豫</div>
      <span>豫港通</span>
    </div>
    <div class="topbar-menu">
      <a class="topbar-menu-item" href="./workbench.html" data-menu-key="工作台">工作台</a>
      <a class="topbar-menu-item" href="./project-list.html" data-menu-key="准入管理">准入管理</a>
      <a class="topbar-menu-item" href="./contract-purchase.html" data-menu-key="数字供应链">数字供应链</a>
      <a class="topbar-menu-item active" href="./warehouse-inbound.html" data-menu-key="仓储管理">仓储管理</a>
      <a class="topbar-menu-item" href="./cockpit.html" data-menu-key="数据中心">数据中心</a>
      <a class="topbar-menu-item" href="./warning-list.html" data-menu-key="预警中心">预警中心</a>
      <a class="topbar-menu-item" href="./account-personal.html" data-menu-key="账户中心">账户中心</a>
      <button class="topbar-changelog-btn" onclick="window.open('./changelog.html', '_blank')" title="查看高保真原型版本变更记录">📋 版本变更记录</button>
    </div>
    <div class="topbar-right">
      <div class="topbar-icon-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="badge"></span>
      </div>
      <div class="topbar-user">
        <div class="topbar-user-avatar">张</div>
        <div>
          <div class="topbar-user-name">张爽</div>
          <div class="topbar-user-org">港通供应链</div>
        </div>
      </div>
    </div>
  </div>

  <div style="display: flex;">
    <div class="sidemenu" id="leftSidemenu"></div>

    <div class="main-content" style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
      <div class="page-body" style="flex: 1; overflow-y: auto; background: var(--bg-page);">

        <!-- 面包屑 -->
        <div class="breadcrumb-inline">
          <a href="#">仓储管理</a>
          <span class="sep">/</span>
          <a href="#">基础数据</a>
          <span class="sep">/</span>
          <span class="current">库点信息管理</span>
        </div>

        <!-- 标题 -->
        <h1 class="page-h1" style="margin: 0 0 14px 0;">库点信息管理</h1>

        <!-- v1.7.99.119 基础信息表（6 字段 3 行 灰底 label + 白底 value） -->
        <table class="info-table">
          <tr>
            <th>库点编号</th>
            <td>ZT0001</td>
            <th>库点名称</th>
            <td>国际物流枢纽仓库</td>
            <th>仓储企业</th>
            <td>河南国际物流枢纽建设运营有限公司</td>
          </tr>
          <tr>
            <th>行业</th>
            <td>粮食</td>
            <th>类型</th>
            <td>库点</td>
            <th>库点联系人</th>
            <td>饶永生</td>
          </tr>
          <tr>
            <th>联系人手机号</th>
            <td>156 5238 XXXX</td>
            <th>地址</th>
            <td class="address-cell" colspan="3">
              河南省/郑州市/新郑市 河南省郑州市新郑市航空港区郑州国际陆港综合楼
              <span class="edit-icon" title="编辑地址">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              </span>
            </td>
          </tr>
        </table>

        <!-- v1.7.99.119 2 tab 切换（库点平面图 / 仓储租赁合同） -->
        <div class="point-tabs">
          <div class="point-tab active" data-tab="floor" onclick="switchPointTab(this, 'floor')">库点平面图</div>
          <div class="point-tab" data-tab="lease" onclick="switchPointTab(this, 'lease')">仓储租赁合同</div>
        </div>

        <!-- v1.7.99.119 tap1：库点平面图 -->
        <div class="tab-content active" id="tab-floor">
          <div class="tab-header">
            <button class="btn-primary" onclick="Utils.toast('监控信息', 'info')">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
              监控信息
            </button>
          </div>
          <!-- 空状态（v1.7.99.119 锁：未配置平面图信息） -->
          <div class="empty-state" style="background: #fff; border: 1px solid var(--border-light); border-radius: 8px;">
            <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M6 9V2h12v7"/>
              <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
              <path d="M6 14h12v8H6z"/>
            </svg>
            <div class="empty-text">未配置平面图信息</div>
          </div>
        </div>

        <!-- v1.7.99.119 tap2：仓储租赁合同 -->
        <div class="tab-content" id="tab-lease">
          <div class="tab-header">
            <button class="btn-primary" onclick="Utils.toast('上传合同', 'info')">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
              上传合同
            </button>
          </div>
          <div class="lease-table-wrap" style="background: #fff; border: 1px solid var(--border-light); border-radius: 8px;">
            <table class="lease-table">
              <thead>
                <tr>
                  <th style="width: 9%;">合同编号</th>
                  <th style="width: 10%;">库点名称</th>
                  <th style="width: 6%;">合同状态</th>
                  <th style="width: 7%;">签订日期</th>
                  <th style="width: 11%;">生效日期</th>
                  <th style="width: 13%;">业务实际负责人</th>
                  <th style="width: 6%;">签章状态</th>
                  <th style="width: 13%;">仓储方名称</th>
                  <th style="width: 13%;">承租方名称</th>
                  <th style="width: 5%;">付费方名称</th>
                  <th style="width: 7%;">操作</th>
                </tr>
              </thead>
              <tbody id="leaseTbody">
                <!-- JS 渲染 -->
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>
  <script src="../shared/js/topnav-drawer.js"></script>
  <script src="../shared/js/left-sidemenu.js"></script>
  <script>
    // v1.7.99.80 inline Utils fallback
    window.Utils = window.Utils || {
      toast: function(msg, type) {
        if (typeof window.showToast === 'function') return window.showToast(msg, type);
        console.log('[' + (type || 'info') + ']', msg);
      }
    };

    // v1.7.99.119 tab 切换函数（库点平面图 / 仓储租赁合同）
    function switchPointTab(el, tabKey) {
      document.querySelectorAll('.point-tab').forEach(function(t) { t.classList.remove('active'); });
      el.classList.add('active');
      document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
      var target = document.getElementById('tab-' + tabKey);
      if (target) target.classList.add('active');
    }

    // v1.7.99.119 仓储租赁合同 mock 数据（1 行，按 user 2026-08-04 截图实际）
    var LEASE_MOCK = [
      {
        contractNo: '20260201-20270131',
        pointName: '国际物流枢纽仓库',
        status: '已生效',
        signDate: '2026-02-01',
        effectiveDate: '2026-02-01至2027-01-31',
        owner: '港通资本-杨哲-157 1391 XXXX',
        signStatus: '双方签署',
        storage: '河南国际物流枢纽建设运营有限公司',
        rent: '河南中豫港通供应链管理有限公司',
        payer: '-'
      }
    ];

    // v1.7.99.119 渲染合同表格
    (function() {
      var tbody = document.getElementById('leaseTbody');
      if (!tbody) return;
      tbody.innerHTML = LEASE_MOCK.map(function(r) {
        return '<tr>' +
          '<td class="col-num">' + r.contractNo + '</td>' +
          '<td>' + r.pointName + '</td>' +
          '<td><span class="tag tag-green">' + r.status + '</span></td>' +
          '<td class="col-num">' + r.signDate + '</td>' +
          '<td>' + r.effectiveDate + '</td>' +
          '<td>' + r.owner + '</td>' +
          '<td>' + r.signStatus + '</td>' +
          '<td>' + r.storage + '</td>' +
          '<td>' + r.rent + '</td>' +
          '<td>' + r.payer + '</td>' +
          '<td class="col-actions"><a onclick="Utils.toast(\'查看附件\', \'info\')">查看附件</a><a onclick="Utils.toast(\'更多操作\', \'info\')">更多&gt;</a></td>' +
          '</tr>';
      }).join('');
    })();
  </script>
  </div>
  <!-- /main-content -->
<script src="../assets/js/pin-annotation.js"></script>
  <script src="../shared/js/prd-fab.js"></script>
</body>
</html>
