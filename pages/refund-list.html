<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>退款管理 - 豫港通</title>
  <link rel="stylesheet" href="../assets/css/design-system.css">
  <link rel="stylesheet" href="../assets/css/list-page.css">
  <link rel="stylesheet" href="../assets/css/pin-annotation.css">
  <style>
    .page-body { padding: 20px 24px; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-logo">
      <div style="width: 36px; height: 36px; background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 16px;">豫</div>
      <span>豫港通</span>
    </div>
    <div class="topbar-menu">
      <a class="topbar-menu-item" href="./workbench.html" data-menu-key="工作台">工作台</a>
      <a class="topbar-menu-item" href="./project-list.html" data-menu-key="准入管理">准入管理</a>
      <a class="topbar-menu-item active" href="./contract-purchase.html" data-menu-key="数字供应链">数字供应链</a>
      <a class="topbar-menu-item" href="./warehouse-inbound.html" data-menu-key="仓储管理">仓储管理</a>
      <a class="topbar-menu-item" href="./cockpit.html" data-menu-key="数据中心">数据中心</a>
      <a class="topbar-menu-item" href="./warning-list.html" data-menu-key="预警中心">预警中心</a>
      <a class="topbar-menu-item" href="./account-personal.html" data-menu-key="账户中心">账户中心</a>
      <button class="topbar-changelog-btn" onclick="window.open('./changelog.html', '_blank')" title="查看高保真原型版本变更记录">📋 版本变更记录</button>
    </div>
    <div class="topbar-right">
      <div class="topbar-icon-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="badge"></span>
      </div>
      <div class="topbar-user">
        <div class="topbar-user-avatar">张</div>
        <div>
          <div class="topbar-user-name">张爽</div>
          <div class="topbar-user-org">港通供应链</div>
        </div>
      </div>
    </div>
  </div>

  <div style="display: flex;">
    <div class="sidemenu" id="leftSidemenu"></div>

    <div class="main-content" style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
      <div class="page-body" style="flex: 1; overflow-y: auto; background: var(--bg-page);">

        <!-- 面包屑 -->
        <div class="breadcrumb-inline">
          <a href="#">数字供应链</a>
          <span class="sep">/</span>
          <a href="#">货款管理</a>
          <span class="sep">/</span>
          <span class="current">退款管理</span>
        </div>

        <!-- 标题 + 新增退款 -->
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;">
          <h1 class="page-h1" style="margin: 0;">退款管理</h1>
          <button class="btn btn-primary" onclick="goRefundApply()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
            新增退款
          </button>
        </div>

        <!-- 合并 panel：筛选 / 状态 tab / 表格 / 分页 -->
        <div class="cp-panel">

          <!-- 区块 1：筛选区（v1.7.99.63 按图 1：5 字段 - 编号/企业名称/合同类型/退款日期/业务类型） -->
          <div class="cp-block">
            <div class="cp-filter-summary">
              <div class="cp-filter-summary-left">
                当前搜索：<span data-filter-chips class="filter-chips"></span><span class="filter-empty-hint">（无筛选条件）</span>
                <button type="button" class="clear-all-btn" style="display: none;" onclick="clearAllFilters(this)">清除全部</button>
              </div>
              <button class="btn btn-text btn-sm">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                数据导出
              </button>
            </div>
            <div class="cp-filter">
              <div class="cp-filter-item">
                <span class="cp-filter-label">编号</span>
                <input type="text" class="input" placeholder="请输入订单、合同、资金流水号">
              </div>
              <div class="cp-filter-item">
                <span class="cp-filter-label">企业名称</span>
                <input type="text" class="input" placeholder="请输入企业名称">
              </div>
              <div class="cp-filter-item">
                <span class="cp-filter-label">合同类型</span>
                <select class="select"><option>请选择合同类型</option><option>采购合同</option><option>销售合同</option></select>
              </div>
              <div class="cp-filter-item">
                <span class="cp-filter-label">退款日期</span>
                <input type="text" class="input" placeholder="开始时间 ~ 结束时间">
              </div>
              <div class="cp-filter-item">
                <span class="cp-filter-label">业务类型</span>
                <select class="select"><option>请选择业务类型</option><option>存货业务</option><option>预付业务</option><option>账期业务</option><option>购销业务</option></select>
              </div>
            </div>
          </div>

          <!-- 区块 2：状态 tab（v1.7.99.63 按图 1：5 个 tap - 全部/审批中/已退款/驳回/无效） -->
          <div class="cp-block cp-block-tab">
            <div class="cp-tab-bar">
              <div class="cp-tab-bar-tabs">
                <div class="cp-tab active">全部</div>
                <div class="cp-tab" style="color: #1e40af;">审批中</div>
                <div class="cp-tab" style="color: #15803d;">已退款</div>
                <div class="cp-tab" style="color: #dc2626;">驳回</div>
                <div class="cp-tab" style="color: #6b7280;">无效</div>
              </div>
              <div class="cp-tab-bar-actions">
                <!-- 状态 tab 右侧空，预留扩展位 -->
              </div>
            </div>
          </div>

          <!-- 区块 3：表格（v1.7.99.63 按图 1：8 列 + v1.7.99.152 加 6 行 mock 默认显示"全部"） -->
          <div class="cp-block" style="padding: 0;">
            <div class="cp-table-wrap">
              <table class="cp-table">
                <thead>
                  <tr>
                    <th style="width: 12%;">合同类型</th>
                    <th style="width: 18%;">合同编号</th>
                    <th style="width: 14%;">退款方</th>
                    <th style="width: 14%;">收款方</th>
                    <th style="width: 12%;text-align: right;">退款金额(元)</th>
                    <th style="width: 10%;">退款日期</th>
                    <th class="col-status" style="width: 8%;">退款状态</th>
                    <th class="col-action" style="width: auto;text-align: right;">操作</th>
                  </tr>
                </thead>
                <tbody id="refundTbody">
                  <!-- v1.7.99.152 加枚举数据：默认显示"全部" 6 行 mock -->
                </tbody>
              </table>
            </div>
          </div>

          <!-- 区块 4：分页 -->
          <div class="cp-block">
            <div class="cp-pagination">
              <div>共 0 条记录</div>
              <div style="display: flex; align-items: center; gap: 14px; visibility: hidden;">
                <div class="cp-pagination-pages">
                  <div class="cp-pagination-page">‹</div>
                  <div class="cp-pagination-page active">1</div>
                  <div class="cp-pagination-page">›</div>
                </div>
                <select class="cp-pagination-size">
                  <option>10 条/页</option>
                </select>
                <span class="cp-pagination-jump">跳至 <input type="number" min="1" value="1"> 页</span>
              </div>
            </div>
          </div>

        </div>
        <!-- /cp-panel -->

      </div>
    </div>
  </div>
  <script src="../shared/js/topnav-drawer.js"></script>
  <script src="../shared/js/left-sidemenu.js"></script>
  <script src="../shared/js/filter-chips.js"></script>
  <script>
    // 跳转到合同选择侧边抽屉过渡页（v1.7.99.63 新增退款 - 图 2）
    function goRefundApply() {
      // 直接跳到新增退款表单页（合同选择侧边抽屉在 refund-apply.html 内嵌实现）
      window.location.href = './refund-apply.html';
    }

    // tab 切换（v1.7.99.63 + v1.7.99.152 加 mock 数据 + 状态机交互）
    const REFUND_MOCK = {
      all: [
        { type: '采购合同', contract: 'GTGYL-MSXS-20240915-001', from: '中豫港通供应链', to: '陕煤物流监管', amount: '¥ 250,000.00', date: '2024-09-18', status: '审批中' },
        { type: '销售合同', contract: 'XSHT-TYYGJ-20241003-002', from: '天宇源国际贸易', to: '荣厚实业有限公司', amount: '¥ 180,500.00', date: '2024-10-05', status: '已退款' },
        { type: '采购合同', contract: 'CGHT-GQCS-20240825-001', from: '高琦测试煤业', to: '河南荣厚实业', amount: '¥ 95,200.00', date: '2024-08-28', status: '已退款' },
        { type: '销售合同', contract: 'XSHT-SXJY-20240711-003', from: '山西锦阳鑫煤炭', to: '郑州信必达国际', amount: '¥ 320,000.00', date: '2024-07-15', status: '驳回' },
        { type: '采购合同', contract: 'CGHT-SYMT-20240618-001', from: '陕煤物流监管', to: '河南荣厚实业', amount: '¥ 75,800.00', date: '2024-06-20', status: '无效' },
        { type: '销售合同', contract: 'GTGYL-HKJC-20240510-001', from: '河南机场物流', to: '东航物流', amount: '¥ 145,600.00', date: '2024-05-12', status: '审批中' },
      ],
      审批中: [],
      已退款: [],
      驳回: [],
      无效: [],
    };
    REFUND_MOCK['审批中'] = REFUND_MOCK.all.filter(r => r.status === '审批中');
    REFUND_MOCK['已退款'] = REFUND_MOCK.all.filter(r => r.status === '已退款');
    REFUND_MOCK['驳回'] = REFUND_MOCK.all.filter(r => r.status === '驳回');
    REFUND_MOCK['无效'] = REFUND_MOCK.all.filter(r => r.status === '无效');

    const REFUND_STATUS_COLOR = {
      '审批中': 'tag-blue',
      '已退款': 'tag-green',
      '驳回': 'tag-red',
      '无效': 'tag-gray',
    };

    function renderRefund(key) {
      const data = REFUND_MOCK[key] || [];
      const tbody = document.getElementById('refundTbody');
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 80px 0; color: var(--text-tertiary);"><div style="display: flex; flex-direction: column; align-items: center; gap: 12px;"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color: #D1D5DB;"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg><span style="font-size: 13px;">暂无数据</span></div></td></tr>';
        return;
      }
      tbody.innerHTML = data.map(r => `
        <tr class="cp-row-clickable">
          <td>${r.type}</td>
          <td class="col-num">${r.contract}</td>
          <td>${r.from}</td>
          <td>${r.to}</td>
          <td style="text-align: right;" class="col-num">${r.amount}</td>
          <td>${r.date}</td>
          <td class="col-status"><span class="tag ${REFUND_STATUS_COLOR[r.status] || 'tag-gray'}">${r.status}</span></td>
          <td class="col-action" style="text-align: right;"><a href="./refund-detail.html">查看</a></td>
        </tr>
      `).join('');
    }

    document.querySelectorAll('.cp-tab-bar-tabs .cp-tab').forEach(function(tab) {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.cp-tab-bar-tabs .cp-tab').forEach(function(t) { t.classList.remove('active'); });
        tab.classList.add('active');
        const key = tab.textContent.trim();
        renderRefund(key);
        Utils.toast('已切换到：' + key, 'info');
      });
    });

    // 初始渲染"全部" tab
    renderRefund('all');
  </script>
<script src="../assets/js/pin-annotation.js"></script>
</body>
</html>
