<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>销售结算 - 豫港通 v1.7.99.82</title>
  <link rel="stylesheet" href="../assets/css/design-system.css">
  <link rel="stylesheet" href="../assets/css/list-page.css">
  <link rel="stylesheet" href="../assets/css/pin-annotation.css">
  <style>
    .page-body { padding: 20px 24px; }
    /* 9 列表格列宽（v1.7.99.82） */
    .cp-table th.col-num, .cp-table td.col-num { font-family: var(--font-mono); }
    /* 7 种结算单状态 badge 颜色（v1.7.99.82 按 user 图 5 状态定义：审批中/审批驳回/待上传已生效单据/待确认/量产投放/已生效/已作废）*/
    .settle-status { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 500; }
    .settle-status.auditing { background: #FEF3C7; color: #A16207; }      /* 审批中 - 黄色 */
    .settle-status.rejected { background: #FEE2E2; color: #DC2626; }      /* 审批驳回 - 红色 */
    .settle-status.uploading { background: #DBEAFE; color: #1E40AF; }     /* 待上传已生效单据 - 蓝色 */
    .settle-status.toconfirm { background: #E0E7FF; color: #4338CA; }     /* 待确认 - 蓝紫 */
    .settle-status.producing { background: #FCE7F3; color: #BE185D; }     /* 量产投放 - 粉色 */
    .settle-status.effective { background: #D1FAE5; color: #047857; }     /* 已生效 - 绿色 */
    .settle-status.voided { background: #F3F4F6; color: #6B7280; }        /* 已作废 - 灰色 */
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-logo">
      <div style="width: 36px; height: 36px; background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 16px;">豫</div>
      <span>豫港通</span>
    </div>
    <div class="topbar-menu">
      <a class="topbar-menu-item" href="./workbench.html" data-menu-key="工作台">工作台</a>
      <a class="topbar-menu-item" href="./project-list.html" data-menu-key="准入管理">准入管理</a>
      <a class="topbar-menu-item active" href="./contract-purchase.html" data-menu-key="数字供应链">数字供应链</a>
      <a class="topbar-menu-item" href="./warehouse-inbound.html" data-menu-key="仓储管理">仓储管理</a>
      <a class="topbar-menu-item" href="./cockpit.html" data-menu-key="数据中心">数据中心</a>
      <a class="topbar-menu-item" href="./warning-list.html" data-menu-key="预警中心">预警中心</a>
      <a class="topbar-menu-item" href="./account-personal.html" data-menu-key="账户中心">账户中心</a>
      <button class="topbar-changelog-btn" onclick="window.open('./changelog.html', '_blank')" title="查看高保真原型版本变更记录">📋 版本变更记录</button>
    </div>
    <div class="topbar-right">
      <div class="topbar-icon-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="badge"></span>
      </div>
      <div class="topbar-user">
        <div class="topbar-user-avatar">张</div>
        <div>
          <div class="topbar-user-name">张爽</div>
          <div class="topbar-user-org">港通供应链</div>
        </div>
      </div>
    </div>
  </div>

  <div style="display: flex;">
    <div class="sidemenu" id="leftSidemenu"></div>

    <div class="main-content" style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
      <div class="page-body" style="flex: 1; overflow-y: auto; background: var(--bg-page);">

        <!-- 面包屑 v1.7.99.82 -->
        <div class="breadcrumb-inline">
          <a href="#">结算管理</a>
          <span class="sep">/</span>
          <span class="current">销售结算</span>
        </div>

        <!-- 标题 + 新增 -->
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;">
          <h1 class="page-h1" style="margin: 0;">销售结算</h1>
          <a href="./settlement-sales-new.html" class="btn btn-primary">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
            新增销售结算单
          </a>
        </div>

        <!-- 合并 panel -->
        <div class="cp-panel">

          <!-- 区块 1：5 字段筛选区（v1.7.99.82 按 user 图 5 搜索条件：编号/企业名称/品名/品类型/结算日期） -->
          <div class="cp-block">
            <div class="cp-filter-summary">
              <div class="cp-filter-summary-left">
                当前搜索：<span data-filter-chips class="filter-chips"></span><span class="filter-empty-hint">（无筛选条件）</span>
                <button type="button" class="clear-all-btn" style="display: none;" onclick="clearAllFilters(this)">清除全部</button>
              </div>
              <button class="btn btn-text btn-sm" onclick="alert('已将销售结算单数据导出为 Excel（销售结算单_20240730.xlsx）')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                数据导出
              </button>
            </div>
            <div class="cp-filter">
              <div class="cp-filter-item">
                <span class="cp-filter-label">编号</span>
                <input type="text" class="input" placeholder="请输入合同、结算单编号">
              </div>
              <div class="cp-filter-item">
                <span class="cp-filter-label">企业名称</span>
                <input type="text" class="input" placeholder="请输入企业名称">
              </div>
              <div class="cp-filter-item">
                <span class="cp-filter-label">品名</span>
                <input type="text" class="input" placeholder="请输入品名">
              </div>
              <div class="cp-filter-item">
                <span class="cp-filter-label">品类型</span>
                <select class="select">
                  <option>请选择</option>
                  <option>淀粉制品</option>
                  <option>糖粉</option>
                  <option>谷物</option>
                </select>
              </div>
              <div class="cp-filter-item">
                <span class="cp-filter-label">结算日期</span>
                <input type="text" class="input" placeholder="请选择结算日期">
              </div>
            </div>
          </div>

          <!-- 区块 2：6 tab（v1.7.99.82 按 user 图 5：全部/审批中/待上传已生效单据/已生效/驳回/已作废，**v1.7.99.93：「收回」→「驳回」**） -->
          <div class="cp-block cp-block-tab">
            <div class="cp-tab-bar">
              <div class="cp-tab-bar-tabs">
                <div class="cp-tab active" onclick="switchTab(this, 'all')">全部 <span class="count">10</span></div>
                <div class="cp-tab" onclick="switchTab(this, 'auditing')">审批中 <span class="count">3</span></div>
                <div class="cp-tab" onclick="switchTab(this, 'uploading')">待上传已生效单据 <span class="count">2</span></div>
                <div class="cp-tab" onclick="switchTab(this, 'effective')">已生效 <span class="count">3</span></div>
                <div class="cp-tab" onclick="switchTab(this, 'rejected')">驳回 <span class="count">1</span></div>
                <div class="cp-tab" onclick="switchTab(this, 'voided')">已作废 <span class="count">1</span></div>
              </div>
              <div class="cp-tab-bar-actions"></div>
            </div>
          </div>

          <!-- 区块 3：9 列表格（v1.7.99.82 按 user 图 5 列表_字段） -->
          <div class="cp-block" style="padding: 0;">
            <div class="cp-table-wrap">
              <table class="cp-table">
                <thead>
                  <tr>
                    <th style="width: 13%;">结算单编号</th>
                    <th style="width: 16%;">买方企业</th>
                    <th style="width: 9%;text-align: right;">结算金额(元)</th>
                    <th style="width: 8%;text-align: right;">结算数量</th>
                    <th style="width: 8%;text-align: right;">结算单价</th>
                    <th style="width: 8%;">结算日期</th>
                    <th style="width: 16%;">销售订单/单批次合同编号</th>
                    <th class="col-status" style="width: 11%;">结算单状态</th>
                    <th class="col-action" style="width: auto;text-align: right;">操作</th>
                  </tr>
                </thead>
                <tbody id="settleTbody"></tbody>
              </table>
            </div>
          </div>

          <!-- 区块 4：分页 -->
          <div class="cp-block">
            <div class="cp-pagination">
              <div>共 10 条记录 · 第 1 / 1 页</div>
              <div style="display: flex; align-items: center; gap: 14px;">
                <div class="cp-pagination-pages">
                  <div class="cp-pagination-page">‹</div>
                  <div class="cp-pagination-page active">1</div>
                  <div class="cp-pagination-page">›</div>
                </div>
                <select class="cp-pagination-size">
                  <option>10 条/页</option>
                  <option>20 条/页</option>
                  <option>50 条/页</option>
                </select>
                <span class="cp-pagination-jump">跳至 <input type="number" min="1" value="1"> 页</span>
              </div>
            </div>
          </div>

        </div>
        <!-- /cp-panel -->

      </div>
    </div>
  </div>
  <script src="../shared/js/topnav-drawer.js"></script>
  <script src="../shared/js/left-sidemenu.js"></script>
  <script src="../shared/js/filter-chips.js"></script>
  <script>
    // 7 种状态（v1.7.99.82 按 user 图 5：审批中/审批驳回/待上传已生效单据/待确认/量产投放/已生效/已作废，**v1.7.99.93：「收回」→「驳回」**）
    const STATUS_CLASS = {
      '审批中': 'auditing',
      '驳回': 'rejected',
      '待上传已生效单据': 'uploading',
      '待确认': 'toconfirm',
      '量产投放': 'producing',
      '已生效': 'effective',
      '已作废': 'voided',
    };
    // 5 状态操作按钮矩阵（v1.7.99.82 按 user 图 5 操作列表格，**v1.7.99.93：「收回」→「驳回」**）
    // 审批中：详情 | 审批驳回：详情、修改、作废 | 待上传已生效单据：详情、上传附件、作废 | 已生效：详情 | 已作废：详情
    const STATUS_ACTIONS = {
      '审批中': [{ text: '详情', href: './settlement-sales-detail.html?status=auditing' }],
      '驳回': [
        { text: '详情', href: './settlement-sales-detail.html?status=rejected' },
        { text: '修改', href: './settlement-sales-new.html?status=rejected' },
        { text: '作废', href: 'javascript:void(0)', onclick: "openVoidModal(this, '驳回')" }
      ],
      '待上传已生效单据': [
        { text: '详情', href: './settlement-sales-detail.html?status=uploading' },
        { text: '上传附件', href: 'javascript:void(0)', onclick: "openUploadAttachModal(this)" },
        { text: '作废', href: 'javascript:void(0)', onclick: "openVoidModal(this, '待上传已生效单据')" }
      ],
      '已生效': [{ text: '详情', href: './settlement-sales-detail.html?status=effective' }],
      '已作废': [{ text: '详情', href: './settlement-sales-detail.html?status=voided' }],
    };
    // 10 行 mock（v1.7.99.82 销售版：销售合同关联客户 + 6 tab 分布）
    const SETTLE_MOCK = [
      { no: 'XSJS-20241119-001', buyer: '郑州信必达供应链管理有限公司', amount: '1,000,000.22', qty: '100吨', price: '10,000.22元/吨', date: '2024-11-19', contract: 'XSXS-20241119-001、XSXS-20241119-002', status: '审批中' },
      { no: 'XSJS-20241118-002', buyer: '河南物产集团有限公司', amount: '2,300,000.50', qty: '230吨', price: '10,000.22元/吨', date: '2024-11-18', contract: 'XSXS-20241118-001', status: '审批中' },
      { no: 'XSJS-20241115-003', buyer: '浙江昌瑞贸易有限公司', amount: '4,560,000.00', qty: '1,200吨', price: '3,800元/吨', date: '2024-11-15', contract: 'XSXS-20241115-001', status: '审批中' },
      { no: 'XSJS-20241112-004', buyer: '国电投河南电力燃料有限公司', amount: '1,200,000.00', qty: '400吨', price: '3,000元/吨', date: '2024-11-12', contract: 'XSXS-20241112-001', status: '待上传已生效单据' },
      { no: 'XSJS-20241110-005', buyer: '国能河南燃料有限公司', amount: '1,800,000.00', qty: '600吨', price: '3,000元/吨', date: '2024-11-10', contract: 'XSXS-20241110-001', status: '待上传已生效单据' },
      { no: 'XSJS-20241105-006', buyer: '河南煤炭储配交易中心有限公司', amount: '3,400,000.00', qty: '1,000吨', price: '3,400元/吨', date: '2024-11-05', contract: 'XSXS-20241105-001', status: '已生效' },
      { no: 'XSJS-20241101-007', buyer: '山西潞安环保能源开发有限公司', amount: '5,200,000.00', qty: '1,500吨', price: '3,466.67元/吨', date: '2024-11-01', contract: 'XSXS-20241101-001', status: '已生效' },
      { no: 'XSJS-20241025-008', buyer: '天宇潇国际贸易集团有限公司', amount: '8,694,000.00', qty: '2,898吨', price: '3,000元/吨', date: '2024-10-25', contract: 'XSXS-20241025-001', status: '已生效' },
      { no: 'XSJS-20241020-009', buyer: '中国华能集团燃料有限公司', amount: '2,200,000.00', qty: '550吨', price: '4,000元/吨', date: '2024-10-20', contract: 'XSXS-20241020-001', status: '驳回' },
      { no: 'XSJS-20241015-010', buyer: '中煤能源山东有限公司', amount: '1,600,000.00', qty: '500吨', price: '3,200元/吨', date: '2024-10-15', contract: 'XSXS-20241015-001', status: '已作废' },
    ];
    function renderSettleTable() {
      const tbody = document.getElementById('settleTbody');
      tbody.innerHTML = SETTLE_MOCK.map((r, i) => {
        const cls = STATUS_CLASS[r.status] || '';
        const actions = STATUS_ACTIONS[r.status] || [];
        const actionHtml = actions.map(a => {
          if (a.href.startsWith('javascript:')) {
            return `<a href="${a.href}" onclick="${a.onclick}">${a.text}</a>`;
          }
          return `<a href="${a.href}">${a.text}</a>`;
        }).join('');
        return `<tr>
          <td class="col-num">${r.no}</td>
          <td>${r.buyer}</td>
          <td style="text-align: right;" class="col-num">${r.amount}</td>
          <td style="text-align: right;">${r.qty}</td>
          <td style="text-align: right;">${r.price}</td>
          <td>${r.date}</td>
          <td class="col-num">${r.contract}</td>
          <td><span class="settle-status ${cls}">${r.status}</span></td>
          <td class="col-action" style="text-align: right;">${actionHtml}</td>
        </tr>`;
      }).join('');
    }
    function switchTab(el, key) {
      document.querySelectorAll('.cp-tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
    }
    // 作废弹窗（v1.7.99.82 按 user 图 5：作废原因必填，提交后 tip 提示：结算单已作废）
    function openVoidModal(el, status) {
      if (typeof Utils !== 'undefined' && Utils.toast) {
        Utils.toast('作废原因必填，提交后结算单状态变更为已作废', 'warning');
      } else {
        alert('作废原因必填，提交后结算单状态变更为已作废');
      }
    }
    // 上传附件弹窗（v1.7.99.82 按 user 图 5：弹窗附件最多支持上传20个）
    function openUploadAttachModal(el) {
      if (typeof Utils !== 'undefined' && Utils.toast) {
        Utils.toast('已打开上传附件弹窗（最多支持20个）', 'info');
      } else {
        alert('已打开上传附件弹窗（最多支持20个）');
      }
    }
    document.addEventListener('DOMContentLoaded', renderSettleTable);
  </script>
  </div>
  <!-- /main-content -->
<script src="../assets/js/pin-annotation.js"></script>
  <script src="../shared/js/prd-fab.js"></script>
</body>
</html>
