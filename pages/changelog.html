      function fmtTs(iso) {
        if (!iso) return '—';
        const d = new Date(iso);
        const pad = n => String(n).padStart(2, '0');
        // 智能识别：原字符串带 Z（UTC）→ +8 转北京时间；不带 Z（本地）→ 直接读取
        const isUTC = typeof iso === 'string' && /Z$/.test(iso);
        if (isUTC) {
          const beijing = new Date(d.getTime() + 8 * 3600 * 1000);
          return `${beijing.getUTCFullYear()}-${pad(beijing.getUTCMonth() + 1)}-${pad(beijing.getUTCDate())} ${pad(beijing.getUTCHours())}:${pad(beijing.getUTCMinutes())}:${pad(beijing.getUTCSeconds())}`;
        }
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
      }

      function relativeTime(iso) {
        if (!iso) return '';
        const d = new Date(iso);
        const diff = (Date.now() - d.getTime()) / 1000;
        if (diff < 60) return '刚刚';
        if (diff < 3600) return `${Math.floor(diff / 60)} 分钟前`;
        if (diff < 86400) return `${Math.floor(diff / 3600)} 小时前`;
        if (diff < 86400 * 7) return `${Math.floor(diff / 86400)} 天前`;
        return fmtTs(iso);
      }

          +   '刷新'

      // v1.7.99.174 刷新：重新读取 localStorage + baseline，合并渲染
      function refreshChangelog() {
        var btn = document.getElementById('changelogRefreshBtn');
        if (btn) btn.classList.add('refreshing');
        try {
          var local = [];
          try { local = JSON.parse(localStorage.getItem('ygt_changelog_v1') || '[]'); } catch (e) { local = []; }
          // baseline + local 合并（unshift：baseline 在前）
          var merged = BASELINE.concat(local);
          renderSummary(merged);
          renderList(merged);
          // toast 提示（Utils.toast 不存在则降级为 console.log）
          try {
            if (window.Utils && Utils.toast) Utils.toast('已刷新，共 ' + merged.length + ' 条变更记录', 'success');
            else if (typeof showToast === 'function') showToast('已刷新，共 ' + merged.length + ' 条变更记录', 'success');
            else console.log('changelog refresh: ' + merged.length + ' 条');
          } catch (e) { console.log('changelog refresh: ' + merged.length + ' 条'); }
        } finally {
          setTimeout(function() { if (btn) btn.classList.remove('refreshing'); }, 600);
        }
      }
      window.refreshChangelog = refreshChangelog;

      function escapeHtml(s) {
        if (s === null || s === undefined) return '';
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      function renderChange(ch) {
        var beforeHtml = ch.before
          ? '<div class="changelog-change-before">' + escapeHtml(ch.before) + '</div>'
          : '<div class="changelog-change-before empty">（无 / 新增项）</div>';
        var afterHtml = ch.after
          ? '<div class="changelog-change-after">' + escapeHtml(ch.after) + '</div>'

        return ''
          + '<div class="changelog-change">'
          +   '<div class="changelog-change-type ' + ch.type + '">' + (ch.type === 'add' ? '+ 新增' : ch.type === 'remove' ? '− 删除' : '~ 修改') + '</div>'
          +   '<div class="changelog-change-content">'
          +     '<div class="changelog-change-location">📍 ' + escapeHtml(ch.location) + '</div>'
          +     '<div class="changelog-change-diff">' + beforeHtml + '<div class="changelog-change-arrow">→</div>' + afterHtml + '</div>'
          +   '</div>'
          + '</div>';
      }

      function renderSnapshot(label, snap, type) {
        var safeLabel = type === 'prev' ? '变更前' : '变更后';
        if (!snap) {
          return '<div class="changelog-snapshot">'
            + '<div class="changelog-snapshot-label ' + type + '">' + safeLabel + '</div>'
            + '<div class="changelog-snapshot-img">（无截图）</div>'
            + '</div>';
        }
        return '<div class="changelog-snapshot">'
          + '<div class="changelog-snapshot-label ' + type + '">' + safeLabel + '</div>'
          + '<div class="changelog-snapshot-img"><img src="' + snap + '" alt="' + safeLabel + '"></div>'
          + '</div>';
      }

      function renderCard(item) {
        var changesHtml = '';
        if (item.changes && item.changes.length) {
          changesHtml = ''
            + '<div class="changelog-changes-title">📐 改动明细（' + item.changes.length + ' 项）</div>'
            + '<div class="changelog-changes">' + item.changes.map(renderChange).join('') + '</div>';
        }
        var snapshotsHtml = '';
        if (item.prevSnapshot || item.newSnapshot) {
          snapshotsHtml = '<div class="changelog-snapshots">'
            + renderSnapshot('变更前', item.prevSnapshot, 'prev')
            + renderSnapshot('变更后', item.newSnapshot, 'next')
            + '</div>';
        }
        return ''
          + '<div class="changelog-card">'
          +   '<div class="changelog-card-header">'
          +     '<div class="changelog-card-meta">'
          +       '<span class="tag-version">' + escapeHtml(item.version || 'v1.7.99.0') + '</span>'
          +       '<span class="tag-module">' + escapeHtml(item.module || '未指定模块') + '</span>'
          +       '<span class="changelog-card-ts"><strong>' + relativeTime(item.ts) + '</strong> · ' + fmtTs(item.ts) + '</span>'
          +     '</div>'
          +   '</div>'
          +   '<div class="changelog-card-body">'
          +     (item.summary ? '<div class="changelog-summary-text">📝 ' + escapeHtml(item.summary) + '</div>' : '')
          +     changesHtml
          +     snapshotsHtml
          +   '</div>'
          + '</div>';
      }

      function renderList(list) {
        var wrap = document.getElementById('changelogList');
        if (list.length === 0) {
          wrap.innerHTML = '<div class="changelog-empty">'
            + '<div class="changelog-empty-icon">📭</div>'
            + '<div class="changelog-empty-title">暂无变更记录</div>'
            + '<div class="changelog-empty-desc">当前为「功能壳」状态。<br>后续每次原型调整，将通过 <code>window.YGTChangelog.add({...})</code> 写入记录，<br>包含：版本号 / 功能模块归属 / 改动时间 / 改动明细（旧 → 新） / 文字总结。</div>'
            + '</div>';
          return;
        }
        wrap.innerHTML = list.map(renderCard).join('');
      }

      function init() {
        // 合并 baseline + localStorage（localStorage 的 unshift 在头部）
        var runtime = loadAll();
        var list = runtime.concat(BASELINE);
        renderSummary(list);
        renderList(list);
        document.getElementById('metaInfo').textContent = '共 ' + list.length + ' 条 · 按时间倒序';
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
